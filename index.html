<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>砖块工坊 · Brick Studio</title>
<meta name="description" content="砖块工坊：在马卡龙色的 3D 世界里自由拼搭积木、角色、建筑与城市交通。" />
<meta name="theme-color" content="#f7eef4" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d98ca1'/%3E%3Crect x='6' y='14' width='20' height='10' rx='2' fill='white'/%3E%3Crect x='8' y='10' width='4' height='6' rx='1.5' fill='white'/%3E%3Crect x='14' y='10' width='4' height='6' rx='1.5' fill='white'/%3E%3Crect x='20' y='10' width='4' height='6' rx='1.5' fill='white'/%3E%3C/svg%3E" />
<style>
  :root {
    --site-bg: #f7eef4;
    --site-fg: #5a4a55;
    --site-accent: #d98ca1;
    --site-on-accent: #fffaf8;
    --site-surface: #fdfaf7;
    --site-muted: #9a8e97;
    --site-border: rgba(90, 74, 85, .12);
    --site-font: "Avenir Next", -apple-system, BlinkMacSystemFont, "SF Pro Display",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --site-radius: 12px;
    --site-space: 1;
    --site-type: 1;
    --site-motion: 1;

    --ink: var(--site-fg);
    --ink-2: #75636e;
    --muted: var(--site-muted);
    --paper: var(--site-surface);
    --line: var(--site-border);
    --coral: var(--site-accent);
    --panel: rgba(255, 255, 255, .7);
    --shadow: 0 18px 50px rgba(90, 74, 85, .15), 0 2px 8px rgba(90, 74, 85, .05);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: var(--site-font);
    color: var(--ink);
    background-color: var(--site-bg);
    background-image:
      radial-gradient(900px 620px at 78% 8%, rgba(255, 230, 238, .88), transparent 62%),
      radial-gradient(900px 620px at 12% 92%, rgba(214, 237, 230, .6), transparent 66%),
      linear-gradient(165deg, rgba(233, 242, 251, .9) 0%, rgba(247, 238, 244, 0) 48%, rgba(253, 244, 233, .9) 100%);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: crosshair;
  }
  #stage canvas { display: block; cursor: inherit; }
  #stage.is-rotating { cursor: grabbing; }
  #stage.is-panning { cursor: move; }
  #stage.is-erasing { cursor: cell; }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(84, 67, 79, .10) 100%);
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: calc(20px * var(--site-space, 1)) calc(24px * var(--site-space, 1));
    pointer-events: none;
    animation: fadeIn .8s ease both;
  }
  .topbar > * { pointer-events: auto; }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px 9px 10px;
    border-radius: calc(var(--site-radius, 12px) * 1.5);
    background: color-mix(in srgb, var(--site-surface) 55%, transparent);
    border: 1px solid rgba(255, 255, 255, .72);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    box-shadow: 0 8px 26px rgba(45, 64, 57, .1);
  }
  .brand__logo {
    width: 38px; height: 38px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: var(--coral);
    display: grid;
    place-items: center;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12), 0 4px 10px rgba(217, 85, 63, .25);
  }
  .brand h1 {
    margin: 0;
    font-size: calc(17px * var(--site-type, 1));
    font-weight: 800;
    letter-spacing: .01em;
    line-height: 1.15;
  }
  .brand__tag {
    display: block;
    margin-top: 2px;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: .3em;
    color: var(--muted);
  }
  .topbar__right {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .counter {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 42px;
    padding: 0 15px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(255, 255, 255, .72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 26px rgba(45, 64, 57, .08);
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .counter b {
    font-size: 13px;
    color: var(--ink);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .counter__size {
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: .01em;
  }
  .counter__dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--coral);
    box-shadow: 0 0 0 3px rgba(217, 85, 63, .14);
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 5px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(255, 255, 255, .72);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    box-shadow: 0 8px 26px rgba(45, 64, 57, .08);
  }
  .actions__sep {
    width: 1px; height: 20px;
    margin: 0 3px;
    background: var(--line);
  }
  .icon-btn {
    width: 38px; height: 38px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: var(--site-radius, 12px);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    transition: background calc(180ms * var(--site-motion, 1)) ease,
      color calc(180ms * var(--site-motion, 1)) ease,
      transform calc(180ms * var(--site-motion, 1)) ease;
  }
  .icon-btn:hover { background: rgba(90, 74, 85, .07); }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn.is-active { background: var(--ink); color: var(--site-on-accent); }
  .icon-btn:disabled { opacity: .28; cursor: default; background: transparent; }
  .icon-btn svg { width: 19px; height: 19px; pointer-events: none; }
  .icon-btn .icon-off { display: none; }
  .icon-btn.is-muted .icon-on { display: none; }
  .icon-btn.is-muted .icon-off { display: block; }

  /* ---------- hint ---------- */
  .hint {
    position: fixed;
    left: 24px;
    top: 104px;
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 11px 14px;
    border-radius: calc(var(--site-radius, 12px) * 1.1667);
    background: color-mix(in srgb, var(--site-surface) 38%, transparent);
    border: 1px solid rgba(255, 255, 255, .5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: rgba(90, 74, 85, .62);
    font-size: 11px;
    line-height: 1.4;
    pointer-events: none;
    animation: fadeIn 1s .2s ease both;
  }
  .hint kbd {
    display: inline-block;
    min-width: 34px;
    margin-right: 7px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, .7);
    border: 1px solid rgba(90, 74, 85, .08);
    box-shadow: 0 1px 0 rgba(90, 74, 85, .06);
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--ink-2);
    text-align: center;
  }

  /* ---------- intro ---------- */
  .intro {
    position: fixed;
    left: 50%;
    top: 104px;
    z-index: 8;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(255, 255, 255, .8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 12px 34px rgba(45, 64, 57, .1);
    font-size: 13px;
    color: var(--ink-2);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .55s ease, transform .55s ease;
  }
  .intro b { color: var(--ink); font-weight: 800; }
  .intro__dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--coral);
    box-shadow: 0 0 0 0 rgba(217, 85, 63, .35);
    animation: pulse 2s infinite;
  }
  .intro.is-hidden {
    opacity: 0;
    transform: translate(-50%, -10px);
  }

  /* ---------- dock ---------- */
  .dock {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: max-content;
    max-width: calc(100vw - 32px);
    padding: calc(12px * var(--site-space, 1)) calc(16px * var(--site-space, 1));
    border-radius: calc(var(--site-radius, 12px) * 2);
    background: color-mix(in srgb, var(--site-surface) 74%, transparent);
    border: 1px solid rgba(255, 255, 255, .82);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: var(--shadow);
    flex-wrap: wrap;
    animation: fadeIn .8s .08s ease both;
  }
  .dock__group {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .dock__label {
    padding-left: 3px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .24em;
    color: var(--muted);
  }
  .dock__row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dock__sep {
    width: 1px;
    height: 46px;
    background: var(--line);
    align-self: center;
  }
  .cat-tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-left: 1px;
    min-height: 16px;
  }
  .cat-tab {
    padding: 2px 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .1em;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  .cat-tab:hover { background: rgba(90, 74, 85, .06); color: var(--ink-2); }
  .cat-tab.is-active { background: rgba(90, 74, 85, .09); color: var(--ink); }
  .cat-tab:focus-visible { outline: 2px solid var(--coral); outline-offset: 1px; }

  .brick-list {
    display: flex;
    gap: 6px;
    flex: 0 1 auto;
    min-width: 0;
    max-width: min(52vw, 500px);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 1px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-behavior: smooth;
  }
  .brick-list::-webkit-scrollbar { display: none; }
  .brick-list .brick-chip { flex: 0 0 auto; }
  .brick-chip {
    width: 50px; height: 46px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: calc(var(--site-radius, 12px) * 1.0833);
    background: rgba(90, 74, 85, .045);
    color: var(--ink-2);
    cursor: pointer;
    transition: background calc(180ms * var(--site-motion, 1)) ease,
      color calc(180ms * var(--site-motion, 1)) ease,
      transform calc(180ms * var(--site-motion, 1)) ease,
      box-shadow calc(180ms * var(--site-motion, 1)) ease;
  }
  .brick-chip:hover { background: rgba(90, 74, 85, .09); }
  .brick-chip:active { transform: scale(.95); }
  .brick-chip.is-active {
    background: var(--ink);
    color: var(--site-on-accent);
    box-shadow: 0 7px 16px rgba(90, 74, 85, .22);
  }
  .brick-chip svg { display: block; }
  .brick-chip--prop {
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-family: inherit;
  }
  .brick-chip--prop svg { width: 22px; height: 22px; }
  .brick-chip--prop span {
    display: block;
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .02em;
    color: inherit;
    opacity: .8;
  }
  .brick-chip--labeled {
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-family: inherit;
  }
  .brick-chip--labeled svg { width: 25px; height: 25px; }
  .brick-chip--labeled span {
    display: block;
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .02em;
    color: inherit;
    opacity: .8;
  }
  .dock__group--colors.is-fixed {
    opacity: .32;
    pointer-events: none;
    filter: saturate(.4);
  }
  .tool-btn:disabled {
    opacity: .32;
    cursor: default;
    transform: none;
  }
  .rotate-btn {
    height: 46px;
    min-width: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: 1px dashed rgba(90, 74, 85, .28);
    border-radius: calc(var(--site-radius, 12px) * 1.0833);
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .rotate-btn:hover { background: rgba(90, 74, 85, .05); border-color: rgba(90, 74, 85, .4); }
  .rotate-btn:active { transform: scale(.95); }
  .rotate-btn svg { width: 18px; height: 18px; }
  .rotate-btn span {
    font-size: 9px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .color-list { display: flex; gap: 7px; align-items: center; }
  .color-dot {
    position: relative;
    width: 26px; height: 26px;
    flex: 0 0 auto;
    padding: 0;
    border: 2px solid rgba(255, 255, 255, .9);
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 -3px 6px rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .12);
    cursor: pointer;
    transition: transform .16s ease, outline-color .16s ease;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .color-dot:hover { transform: scale(1.1); }
  .color-dot.is-active { outline-color: var(--ink); }
  .color-dot.is-active::after {
    content: "";
    position: absolute;
    left: 8px; top: 7px;
    width: 8px; height: 4px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg);
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .45));
  }
  .tool-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 11px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: rgba(90, 74, 85, .045);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .tool-btn:hover { background: rgba(90, 74, 85, .09); }
  .tool-btn:active { transform: scale(.96); }
  .tool-btn.is-active { background: var(--ink); color: var(--site-on-accent); }
  .tool-btn svg { width: 16px; height: 16px; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 150px;
    z-index: 30;
    transform: translate(-50%, 8px);
    padding: 9px 17px;
    border-radius: 999px;
    background: rgba(90, 74, 85, .9);
    color: #fff;
    font-size: 12px;
    letter-spacing: .02em;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.is-show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- modal ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(80, 64, 74, .26);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .modal[hidden] { display: none; }
  .modal__card {
    width: min(360px, 100%);
    padding: 24px;
    border-radius: 22px;
    background: var(--paper);
    border: 1px solid rgba(255, 255, 255, .6);
    box-shadow: 0 24px 80px rgba(20, 35, 30, .32);
    animation: pop .22s ease both;
  }
  .modal__card h2 {
    margin: 0 0 8px;
    font-size: 18px;
    letter-spacing: .01em;
  }
  .modal__card p {
    margin: 0 0 20px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--muted);
  }
  .modal__actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .18s ease, transform .18s ease;
  }
  .btn:hover { filter: brightness(.96); }
  .btn:active { transform: scale(.97); }
  .btn--ghost { background: rgba(90, 74, 85, .06); color: var(--ink-2); }
  .btn--danger { background: var(--coral); color: var(--site-on-accent); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(217, 85, 63, .35); }
    70% { box-shadow: 0 0 0 8px rgba(217, 85, 63, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 85, 63, 0); }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    .hint { display: none; }
  }
  @media (max-width: 980px) {
    .topbar { padding: 14px 16px; }
    .dock { gap: 12px; padding: 10px 12px; bottom: 14px; }
    .dock__sep { display: none; }
    .brand__tag { display: none; }
    .counter { height: 38px; padding: 0 12px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
    .intro { top: 88px; }
  }
  @media (max-width: 760px) {
    .topbar { padding: 12px; }
    .brand { padding: 7px 12px 7px 8px; gap: 9px; }
    .brand__logo { width: 32px; height: 32px; border-radius: 10px; }
    .brand h1 { font-size: 15px; }
    .counter { display: none; }
    .dock {
      left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
      width: auto;
      max-width: none;
      transform: none;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      border-radius: 20px;
    }
    .dock__group { gap: 0; }
    .dock__label { display: none; }
    .dock__row { gap: 5px; }
    .brick-list { max-width: calc(100vw - 92px); }
    .brick-chip { width: 44px; height: 42px; border-radius: 11px; }
    .brick-chip--prop { width: 52px; }
    .brick-chip--labeled { width: 48px; }
    .rotate-btn { height: 42px; min-width: 42px; border-radius: 11px; }
    .color-dot { width: 23px; height: 23px; }
    .color-list { gap: 6px; }
    .tool-btn { height: 32px; padding: 0 9px; }
    .intro {
      top: 80px;
      max-width: calc(100vw - 28px);
      padding: 8px 14px;
      font-size: 12px;
      white-space: normal;
      text-align: center;
    }
    .toast { bottom: 190px; }
  }
  @media (max-width: 520px) {
    .topbar { padding: 10px; }
    .actions { gap: 1px; padding: 4px; }
    .icon-btn { width: 32px; height: 32px; }
    .icon-btn svg { width: 17px; height: 17px; }
    .brand { padding: 6px 9px 6px 7px; gap: 7px; border-radius: 14px; }
    .brand__logo { width: 28px; height: 28px; border-radius: 9px; }
    .brand h1 { font-size: 13.5px; }
    .dock { gap: 8px; padding: 8px; }
    .brick-chip { width: 40px; height: 38px; }
    .brick-chip--prop { width: 48px; }
    .brick-chip--labeled { width: 44px; }
    .brick-chip--labeled svg { width: 22px; height: 22px; }
    .rotate-btn { height: 38px; min-width: 38px; }
    .color-dot { width: 21px; height: 21px; }
    .color-dot.is-active::after { left: 6px; top: 5px; width: 7px; height: 3px; }
    .tool-btn { font-size: 11px; padding: 0 8px; gap: 4px; }
    .cat-tab { padding: 1px 5px; font-size: 8.5px; }
  }
  /* ---------- weather ---------- */
  .weather-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: transparent;
    transition: background 1.1s ease, opacity 1.1s ease;
  }
  body.weather-sunny .weather-overlay {
    background: radial-gradient(ellipse at 76% 4%, rgba(255, 238, 184, .4), transparent 43%);
  }
  body.weather-rain .weather-overlay {
    background: linear-gradient(180deg, rgba(83, 111, 139, .3), rgba(107, 128, 145, .13));
  }
  body.weather-snow .weather-overlay {

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);

    const cam = {
      theta: 0.62,
      phi: 1.0,
      radius: 56,
      target: new THREE.Vector3(0, 0.58, 0),
      userZoomed: false
    };

    function plateFits(radius) {
      cam.radius = radius;
      applyCamera();
      const corners = [
        new THREE.Vector3(-SIZE / 2, 0, -SIZE / 2),
        new THREE.Vector3(SIZE / 2, 0, -SIZE / 2),
        new THREE.Vector3(SIZE / 2, 0, SIZE / 2),
        new THREE.Vector3(-SIZE / 2, 0, SIZE / 2)
      ];
      let maxX = 0;
      let maxY = -Infinity;
      let minY = Infinity;
      for (let i = 0; i < corners.length; i++) {
        const v = corners[i].clone().project(camera);
        maxX = Math.max(maxX, Math.abs(v.x));
        maxY = Math.max(maxY, v.y);
        minY = Math.min(minY, v.y);
      }
      const xLimit = window.innerWidth < window.innerHeight ? 1.22 : 0.87;
      return maxX <= xLimit && maxY <= 0.72 && -minY <= 0.82;
    }

    function fitViewToPlate() {
      cam.target.set(0, 0.58, 0);
      let lo = 20;
      let hi = 200;
      for (let i = 0; i < 26; i++) {
        const mid = (lo + hi) / 2;
        if (plateFits(mid)) hi = mid;
        else lo = mid;
      }
      cam.radius = hi;
      applyCamera();
    }

    function applyCamera() {
      const r = cam.radius;
      const sp = Math.sin(cam.phi);
      camera.position.set(
        cam.target.x + r * sp * Math.sin(cam.theta),
        cam.target.y + r * Math.cos(cam.phi),
        cam.target.z + r * sp * Math.cos(cam.theta)
      );
      camera.lookAt(cam.target);
      camera.updateMatrixWorld();
    }
    applyCamera();

    // ---------------------------------------------------------------- lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xb9aeb6, 0.55);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff2dd, 0.95);
    keyLight.position.set(26, 44, 18);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -34;
    keyLight.shadow.camera.right = 34;
    keyLight.shadow.camera.top = 34;
    keyLight.shadow.camera.bottom = -34;
    keyLight.shadow.camera.near = 8;
    keyLight.shadow.camera.far = 130;
    keyLight.shadow.bias = -0.0004;
    keyLight.shadow.normalBias = 0.035;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xbcd7ff, 0.22);
    fillLight.position.set(-30, 18, -26);
    scene.add(fillLight);

    // ---------------------------------------------------------------- weather
    const WEATHER_MODES = ['sunny', 'rain', 'snow'];
    const WEATHER_AUTO_MS = 20000;
    const WEATHER_LABELS = { sunny: '晴天', rain: '下雨', snow: '下雪' };
    const WEATHER_LIGHT = {
      sunny: { hemi: 0.55, key: 0.95, fill: 0.22, color: new THREE.Color(0xfff2dd) },
      rain: { hemi: 0.4, key: 0.6, fill: 0.16, color: new THREE.Color(0xd7e5f0) },
      snow: { hemi: 0.58, key: 0.72, fill: 0.23, color: new THREE.Color(0xedf6ff) }
    };
    const weatherGroup = new THREE.Group();
    scene.add(weatherGroup);
    let weatherLightTarget = WEATHER_LIGHT.sunny;
    let weatherAutoTimer = null;
    let lastWeatherFrame = 0;

    const WEATHER_HALF = 31;
    const RAIN_COUNT = 720;
    const SNOW_COUNT = 1100;

    const rainDrops = [];
    const rainPositions = new Float32Array(RAIN_COUNT * 6);
    for (let i = 0; i < RAIN_COUNT; i++) {
      const drop = {
        x: (Math.random() * 2 - 1) * WEATHER_HALF,
        y: Math.random() * 20,
        z: (Math.random() * 2 - 1) * WEATHER_HALF,
        speed: 13 + Math.random() * 9,
        len: 0.5 + Math.random() * 0.8
      };
      rainDrops.push(drop);
      writeRainDrop(i, drop);
    }
    function writeRainDrop(i, drop) {
      const o = i * 6;
      rainPositions[o] = drop.x;
      rainPositions[o + 1] = drop.y;
      rainPositions[o + 2] = drop.z;
      rainPositions[o + 3] = drop.x + 0.12;
      rainPositions[o + 4] = drop.y - drop.len;
      rainPositions[o + 5] = drop.z + 0.04;
    }
    const rainGeo = new THREE.BufferGeometry();
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainMat = new THREE.LineBasicMaterial({
      color: 0xb9d6e9,
      transparent: true,
      opacity: 0.64,
      depthWrite: false
    });
    const rainLines = new THREE.LineSegments(rainGeo, rainMat);
    rainLines.frustumCulled = false;
    rainLines.visible = false;
    weatherGroup.add(rainLines);

    const snowFlakes = [];
    const snowPositions = new Float32Array(SNOW_COUNT * 3);
    for (let i = 0; i < SNOW_COUNT; i++) {
      const flake = {
        sx: (Math.random() * 2 - 1) * WEATHER_HALF,
        sz: (Math.random() * 2 - 1) * WEATHER_HALF,
        y: Math.random() * 16,
        speed: 0.65 + Math.random() * 0.9,
        phase: Math.random() * Math.PI * 2
      };
      snowFlakes.push(flake);
      snowPositions[i * 3] = flake.sx;
      snowPositions[i * 3 + 1] = flake.y;
      snowPositions[i * 3 + 2] = flake.sz;
    }
    function makeSnowTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 1, 32, 32, 31);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.45, 'rgba(255,255,255,.95)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const snowGeo = new THREE.BufferGeometry();
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
    const snowMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.55,
      map: makeSnowTexture(),
      transparent: true,
      opacity: 1,
      depthWrite: false,
      alphaTest: 0.01,
      sizeAttenuation: true
    });
    const snowPoints = new THREE.Points(snowGeo, snowMat);
    snowPoints.frustumCulled = false;
    snowPoints.visible = false;
    weatherGroup.add(snowPoints);

    function updateWeatherUI() {
      if (!weatherRowEl) return;
      weatherRowEl.querySelectorAll('.weather-btn').forEach(function (btn) {
        const mode = btn.dataset.weather;
        const active = mode === 'auto' ? state.weatherAuto : (!state.weatherAuto && state.weather === mode);
        btn.classList.toggle('is-active', active);
        btn.classList.toggle('is-current', state.weatherAuto && mode === state.weather);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function applyWeatherVisuals(mode) {
      if (WEATHER_MODES.indexOf(mode) === -1) mode = 'sunny';
      state.weather = mode;
      document.body.classList.remove('weather-sunny', 'weather-rain', 'weather-snow');
      document.body.classList.add('weather-' + mode);
      rainLines.visible = mode === 'rain';
      snowPoints.visible = mode === 'snow';
      weatherLightTarget = WEATHER_LIGHT[mode];
      lastWeatherFrame = performance.now();
      updateWeatherUI();
    }

    function stopWeatherAuto() {
      if (weatherAutoTimer) clearInterval(weatherAutoTimer);
      weatherAutoTimer = null;
    }

    function startWeatherAuto() {
      stopWeatherAuto();
      weatherAutoTimer = setInterval(function () {
        const i = WEATHER_MODES.indexOf(state.weather);
        applyWeatherVisuals(WEATHER_MODES[(i + 1) % WEATHER_MODES.length]);
        scheduleSave();
      }, WEATHER_AUTO_MS);
    }

    function setWeatherMode(mode) {
      if (WEATHER_MODES.indexOf(mode) === -1) return;
      stopWeatherAuto();
      state.weatherAuto = false;
      applyWeatherVisuals(mode);
      updateWeatherUI();
      scheduleSave();
      toast('天气 · ' + WEATHER_LABELS[mode]);
      playSound('tick');
    }

    function toggleWeatherAuto() {
      state.weatherAuto = !state.weatherAuto;
      if (state.weatherAuto) {
        startWeatherAuto();
        toast('自动天气已开启 · 每 20 秒切换');
      } else {
        stopWeatherAuto();
        toast('自动天气已关闭');
      }
      updateWeatherUI();
      scheduleSave();
      playSound('tick');
    }

    function updateWeather(now) {
      const t = weatherLightTarget;
      hemiLight.intensity += (t.hemi - hemiLight.intensity) * 0.055;
      keyLight.intensity += (t.key - keyLight.intensity) * 0.055;
      fillLight.intensity += (t.fill - fillLight.intensity) * 0.055;
      keyLight.color.lerp(t.color, 0.055);

      if (!rainLines.visible && !snowPoints.visible) {
        lastWeatherFrame = now;
        return;
      }
      const dt = Math.min(0.05, Math.max(0, (now - lastWeatherFrame) / 1000));
      lastWeatherFrame = now;

      if (rainLines.visible) {
        for (let i = 0; i < RAIN_COUNT; i++) {
          const drop = rainDrops[i];
          drop.y -= drop.speed * dt;
          if (drop.y < -1) {
            drop.y = 18 + Math.random() * 5;
            drop.x = (Math.random() * 2 - 1) * WEATHER_HALF;
            drop.z = (Math.random() * 2 - 1) * WEATHER_HALF;
          }
          writeRainDrop(i, drop);
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      if (snowPoints.visible) {
        for (let i = 0; i < SNOW_COUNT; i++) {
          const flake = snowFlakes[i];
          flake.y -= flake.speed * dt;
          if (flake.y < 0) {
            flake.y = 14 + Math.random() * 4;
            flake.sx = (Math.random() * 2 - 1) * WEATHER_HALF;
            flake.sz = (Math.random() * 2 - 1) * WEATHER_HALF;
            flake.phase = Math.random() * Math.PI * 2;
          }
          snowPositions[i * 3] = flake.sx + Math.sin(now * 0.0007 + flake.phase) * 0.55;
          snowPositions[i * 3 + 1] = flake.y;
          snowPositions[i * 3 + 2] = flake.sz + Math.cos(now * 0.00055 + flake.phase) * 0.42;
        }
        snowGeo.attributes.position.needsUpdate = true;
      }
    }

    // ---------------------------------------------------------------- helpers
    function mergeGeometries(list) {
      const parts = list.map(function (g) { return g.index ? g.toNonIndexed() : g; });
      const merged = new THREE.BufferGeometry();
      const names = ['position', 'normal', 'uv'];
      for (let n = 0; n < names.length; n++) {
        const name = names[n];
        const first = parts[0].attributes[name];
        if (!first) continue;
        let total = 0;
        for (let i = 0; i < parts.length; i++) total += parts[i].attributes[name].count;
        const array = new first.array.constructor(total * first.itemSize);
        let offset = 0;
        for (let i = 0; i < parts.length; i++) {
          const attr = parts[i].attributes[name];
          array.set(attr.array, offset);
          offset += attr.array.length;
        }
        merged.setAttribute(name, new THREE.BufferAttribute(array, first.itemSize));
      }
      merged.computeBoundingSphere();
      return merged;
    }

    function effDims(def, rot) {
      return (rot % 2 === 0) ? [def.w, def.d] : [def.d, def.w];
    }

    function cellKey(x, z, y) { return x + ',' + z + ',' + y; }

    function worldX(gx, ew) { return -SIZE / 2 + (gx + ew / 2) * CELL; }
    function worldZ(gz, ed) { return -SIZE / 2 + (gz + ed / 2) * CELL; }

    // ---------------------------------------------------------------- baseplate
    const plateTopMat = new THREE.MeshStandardMaterial({ color: 0xb6d8c6, roughness: 0.58, metalness: 0.02 });
    const plateBodyMat = new THREE.MeshStandardMaterial({ color: 0x8fbca9, roughness: 0.68, metalness: 0 });
    const platePickMat = new THREE.MeshBasicMaterial({ visible: false });

    let plateTopMesh = null;
    let plateBodyMesh = null;
    let platePick = null;
    let groundShadowMesh = null;
    let symmetryLine = null;

    function buildPlateTopGeometry() {
      const parts = [];
      const topSlab = new THREE.BoxGeometry(SIZE, 0.08, SIZE);
      topSlab.translate(0, -0.04, 0);
      parts.push(topSlab);

      const studGeo = new THREE.CylinderGeometry(0.28, 0.3, STUD, 12);
      for (let x = 0; x < SIZE; x++) {
        for (let z = 0; z < SIZE; z++) {
          const s = studGeo.clone();
          s.translate(-SIZE / 2 + x + 0.5, STUD / 2, -SIZE / 2 + z + 0.5);
          parts.push(s);
        }
      }
      return mergeGeometries(parts);
    }

    function rebuildPlate() {
      if (!plateTopMesh) {
        plateTopMesh = new THREE.Mesh(buildPlateTopGeometry(), plateTopMat);
        plateTopMesh.receiveShadow = true;
        plateTopMesh.userData.isPlate = true;
        scene.add(plateTopMesh);
      } else {
        plateTopMesh.geometry.dispose();
        plateTopMesh.geometry = buildPlateTopGeometry();
      }

      if (!plateBodyMesh) {
        plateBodyMesh = new THREE.Mesh(new THREE.BoxGeometry(SIZE + 0.6, 0.42, SIZE + 0.6), plateBodyMat);
        plateBodyMesh.position.y = -0.29;
        plateBodyMesh.receiveShadow = true;
        plateBodyMesh.castShadow = true;
        scene.add(plateBodyMesh);
      } else {
        plateBodyMesh.geometry.dispose();
        plateBodyMesh.geometry = new THREE.BoxGeometry(SIZE + 0.6, 0.42, SIZE + 0.6);
      }

      if (!platePick) {
        platePick = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), platePickMat);
        platePick.rotation.x = -Math.PI / 2;
        platePick.position.y = 0.001;
        scene.add(platePick);
      } else {
        platePick.geometry.dispose();
        platePick.geometry = new THREE.PlaneGeometry(SIZE, SIZE);
      }

      if (groundShadowMesh) {
        groundShadowMesh.scale.setScalar(SIZE / 40);
      }

      const shadowSize = SIZE / 2 + 8;
      keyLight.shadow.camera.left = -shadowSize;
      keyLight.shadow.camera.right = shadowSize;
      keyLight.shadow.camera.top = shadowSize;
      keyLight.shadow.camera.bottom = -shadowSize;
      keyLight.shadow.camera.updateProjectionMatrix();

      rebuildSymmetryLine();
      updatePlateSizeUI();
    }

    function rebuildSymmetryLine() {
      if (!symmetryLine) {
        const mat = new THREE.LineDashedMaterial({
          color: 0xd98ca1,
          dashSize: 0.55,
          gapSize: 0.45,
          transparent: true,
          opacity: 0.65
        });
        symmetryLine = new THREE.Line(new THREE.BufferGeometry(), mat);
        scene.add(symmetryLine);
      } else {
        symmetryLine.geometry.dispose();
      }
      symmetryLine.geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0.021, -SIZE / 2),
        new THREE.Vector3(0, 0.021, SIZE / 2)
      ]);
      symmetryLine.computeLineDistances();
      symmetryLine.visible = state.symmetry;
    }

    function updatePlateSizeUI() {
      plateSizeEl.textContent = SIZE + '×' + SIZE;
      extendBtn.disabled = SIZE >= MAX_SIZE;
      extendBtn.title = SIZE >= MAX_SIZE ? '底板已是最大尺寸' : '加宽底板 (+8 格)';
    }

    rebuildPlate();

    // soft shadow under the floating plate
    (function addGroundShadow() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 8, 128, 128, 128);
      g.addColorStop(0, 'rgba(96, 82, 92, .24)');
      g.addColorStop(0.55, 'rgba(96, 82, 92, .11)');
      g.addColorStop(1, 'rgba(96, 82, 92, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
      groundShadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(72, 72), mat);
      groundShadowMesh.rotation.x = -Math.PI / 2;
      groundShadowMesh.position.y = -0.55;
      groundShadowMesh.scale.setScalar(SIZE / 40);
      scene.add(groundShadowMesh);
    })();

    fitViewToPlate();

    // ---------------------------------------------------------------- brick assets
    const geomCache = new Map();
    const matCache = new Map();

    function getBrickGeometry(id) {
      if (geomCache.has(id)) return geomCache.get(id);
      const def = TYPE_MAP[id];
      const parts = [];
      const width = def.w * CELL - GAP;
      const depth = def.d * CELL - GAP;

      if (def.shape === 'round') {
        const body = new THREE.CylinderGeometry(width / 2, width / 2, BODY, 24);
        body.translate(0, BODY / 2, 0);
        parts.push(body);
        const studGeo = new THREE.CylinderGeometry(0.27, 0.3, STUD, 20);
        const stud = studGeo.clone();
        stud.translate(0, BODY + STUD / 2 - 0.002, 0);
        parts.push(stud);
      } else if (def.shape === 'tile') {
        const lower = new THREE.BoxGeometry(width, BODY - 0.045, depth);
        lower.translate(0, (BODY - 0.045) / 2, 0);
        parts.push(lower);
        const top = new THREE.BoxGeometry(width - 0.09, 0.045, depth - 0.09);
        top.translate(0, BODY - 0.0225, 0);
        parts.push(top);
      } else if (def.shape === 'slope') {
        const hw = width / 2;
        const hd = depth / 2;
        const low = 0.12;
        const zFlat = -hd + 0.6;
        const shape = new THREE.Shape();
        shape.moveTo(-hd, 0);
        shape.lineTo(hd, 0);
        shape.lineTo(hd, low);
        shape.lineTo(zFlat, BODY);
        shape.lineTo(-hd, BODY);
        shape.closePath();
        const wedge = new THREE.ExtrudeGeometry(shape, {
          depth: width,
          bevelEnabled: false,
          curveSegments: 1,
          steps: 1
        });
        wedge.rotateY(-Math.PI / 2);
        wedge.translate(width / 2, 0, 0);
        parts.push(wedge);

        const studGeo = new THREE.CylinderGeometry(0.27, 0.3, STUD, 16);
        for (let i = 0; i < def.w; i++) {
          const stud = studGeo.clone();
          stud.translate(
            -def.w * CELL / 2 + (i + 0.5) * CELL,
            BODY + STUD / 2 - 0.002,
            (-hd + zFlat) / 2
          );
          parts.push(stud);
        }
      } else {
        const body = new THREE.BoxGeometry(width, BODY, depth);
        body.translate(0, BODY / 2, 0);
        parts.push(body);

        const studGeo = new THREE.CylinderGeometry(0.27, 0.3, STUD, 16);
        for (let i = 0; i < def.w; i++) {
          for (let j = 0; j < def.d; j++) {
            const s = studGeo.clone();
            s.translate(
              -def.w * CELL / 2 + (i + 0.5) * CELL,
              BODY + STUD / 2 - 0.002,
              -def.d * CELL / 2 + (j + 0.5) * CELL
            );
            parts.push(s);
          }
        }
      }

      const merged = mergeGeometries(parts);
      geomCache.set(id, merged);
      return merged;
    }

    function getMaterial(hex) {
      if (matCache.has(hex)) return matCache.get(hex);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(hex),
        roughness: 0.36,
        metalness: 0.02
      });
      matCache.set(hex, mat);
      return mat;
    }

    function createBrickMesh(rec) {
      const def = TYPE_MAP[rec.type];
      const dims = effDims(def, rec.rot);
      const mesh = new THREE.Mesh(getBrickGeometry(rec.type), getMaterial(rec.color));
      mesh.position.set(
        worldX(rec.gx, dims[0]),
        rec.layer * LAYER,
        worldZ(rec.gz, dims[1])
      );
      mesh.rotation.y = rec.rot * Math.PI / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.record = rec;
      return mesh;
    }


    // ---------------------------------------------------------------- prop assets
    const propMatCache = new Map();
    const propTemplateCache = new Map();

    function pastelPropColor(hex) {
      const key = String(hex || '').toLowerCase();
      return PASTEL_PROP_MAP[key] || hex;
    }

    function propMat(hex, emissive) {
      const base = pastelPropColor(hex);
      const em = emissive ? pastelPropColor(emissive) : null;
      const key = base + (em ? ':' + em : '');
      if (propMatCache.has(key)) return propMatCache.get(key);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(base),
        roughness: 0.48,
        metalness: 0.02,
        emissive: em ? new THREE.Color(em) : 0x000000,
        emissiveIntensity: em ? 0.85 : 0
      });
      propMatCache.set(key, mat);
      return mat;
    }

    const PROP_BUILDERS = {
      minifig: buildMinifig,
      girl: buildGirl,
      cat: buildCat,
      dog: buildDog,
      duck: buildDuck,
      chair: buildChair,
      table: buildTable,
      lamp: buildLamp,
      plant: buildPlant,
      road_straight: buildRoadStraight,
      road_curve: buildRoadCurve,
      road_cross: buildRoadCross,
      rail_track: buildRailTrack,
      train: buildTrain,
      train_car: buildTrainCar,
      train_freight: buildTrainFreight,
      car: buildCar,
      column: buildColumn,
      fence: buildFence,
      door: buildDoor,
      window: buildWindow
    };

    function getPropTemplate(id) {
      if (propTemplateCache.has(id)) return propTemplateCache.get(id);
      const builder = PROP_BUILDERS[id];
      if (!builder) return new THREE.Group();
      const template = builder();
      const def = PROP_MAP[id];
      if (def && def.scale) template.scale.setScalar(def.scale);
      if (def && def.support && !def.native) template.scale.y *= LAYER;
      template.traverse(function (o) {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      propTemplateCache.set(id, template);
      return template;
    }

    function createPropObject(rec) {
      const def = PROP_MAP[rec.propType];
      if (!def) return null;
      const dims = effDims(def, rec.rot);
      const group = getPropTemplate(rec.propType).clone(true);
      group.position.set(
        worldX(rec.gx, dims[0]),
        rec.layer * LAYER,
        worldZ(rec.gz, dims[1])
      );
      group.rotation.y = rec.rot * Math.PI / 2;
      group.userData.propMeshes = [];
      group.traverse(function (o) {
        if (o.isMesh) {
          o.userData.record = rec;
          group.userData.propMeshes.push(o);
        }
      });
      return group;
    }

    function createPropGhost(id) {
      const template = getPropTemplate(id);
      const group = template.clone(true);
      group.position.set(0, 0, 0);
      group.rotation.set(0, 0, 0);
      group.traverse(function (o) {
        if (o.isMesh) {
          o.material = ghostGoodMat;
          o.castShadow = false;
          o.receiveShadow = false;
          o.userData.ghost = true;
        }
      });
      return group;
    }

    // ---------------------------------------------------------------- ghost + eraser
    const ghostGoodMat = new THREE.MeshBasicMaterial({
      color: 0xf4fffb, transparent: true, opacity: 0.42, depthWrite: false
    });
    const ghostBadMat = new THREE.MeshBasicMaterial({
      color: 0xe05a4d, transparent: true, opacity: 0.46, depthWrite: false
    });
    const ghostEdgeMat = new THREE.LineBasicMaterial({
      color: 0x164537, transparent: true, opacity: 0.55
    });

    const ghostGroup = new THREE.Group();
    ghostGroup.visible = false;
    scene.add(ghostGroup);
    const ghostMirror = new THREE.Group();
    ghostMirror.visible = false;
    scene.add(ghostMirror);

    const edgeGeoCache = new Map();
    function getGhostEdgeGeometry(id) {
      if (edgeGeoCache.has(id)) return edgeGeoCache.get(id);
      const geo = new THREE.EdgesGeometry(getBrickGeometry(id), 28);
      edgeGeoCache.set(id, geo);
      return geo;
    }

    function isPropCategory(cat) {
      return cat === 'char' || cat === 'furniture' || cat === 'traffic' || cat === 'build';
    }

    function currentPiece() {
      if (isPropCategory(state.category)) {
        const def = PROP_MAP[state.propType] || PROP_DEFS[0];
        return { kind: 'prop', id: def.id, def: def };
      }
      const def = TYPE_MAP[state.type] || BRICK_DEFS[0];
      return { kind: 'brick', id: def.id, def: def };
    }

    function clearGhostGroup(group) {
      while (group.children.length) group.remove(group.children[0]);
    }

    function rebuildGhost() {
      clearGhostGroup(ghostGroup);
      clearGhostGroup(ghostMirror);

      const piece = currentPiece();
      const content = new THREE.Group();

      if (piece.kind === 'brick') {
        const mesh = new THREE.Mesh(getBrickGeometry(piece.id), ghostGoodMat);
        mesh.userData.ghost = true;
        mesh.renderOrder = 4;
        content.add(mesh);
        const edges = new THREE.LineSegments(getGhostEdgeGeometry(piece.id), ghostEdgeMat);
        edges.renderOrder = 5;
        content.add(edges);
      } else {
        const pad = new THREE.Mesh(new THREE.PlaneGeometry(piece.def.w, piece.def.d), ghostGoodMat);
        pad.rotation.x = -Math.PI / 2;
        pad.position.y = 0.004;
        pad.renderOrder = 3;
        pad.userData.ghost = true;
        content.add(pad);

        const model = createPropGhost(piece.id);
        model.traverse(function (o) {
          if (o.isMesh) {
            o.userData.ghost = true;
            o.renderOrder = 4;
          }
        });
        content.add(model);
      }

      ghostGroup.add(content);
      ghostMirror.add(content.clone(true));
    }

    function setGhostGroupValidity(group, valid) {
      const mat = valid ? ghostGoodMat : ghostBadMat;
      group.traverse(function (o) {
        if (o.isMesh && o.userData.ghost) o.material = mat;
      });
    }

    const eraseBox = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({ color: 0xe05a4d, transparent: true, opacity: 0.26, depthWrite: false })
    );
    eraseBox.renderOrder = 4;
    eraseBox.visible = false;
    scene.add(eraseBox);

    // ---------------------------------------------------------------- items & occupancy
    function itemDef(rec) {
      return rec.kind === 'prop' ? PROP_MAP[rec.propType] : TYPE_MAP[rec.type];
    }

    function itemDims(rec) {
      return effDims(itemDef(rec), rec.rot);
    }

    function propLayers(def) {
      return def && def.layers ? def.layers : 1;
    }

    function itemLayers(rec) {
      return rec.kind === 'prop' ? propLayers(itemDef(rec)) : 1;
    }

    function itemSupports(rec) {
      if (rec.kind === 'prop') {
        const def = PROP_MAP[rec.propType];
        return !!(def && def.support);
      }
      return rec.kind === 'brick' && TYPE_MAP[rec.type] && TYPE_MAP[rec.type].support !== false;
    }

    function effectiveSupportArea(def, rot) {
      const area = def && def.supportArea;
      if (!area) return null;
      const w = def.w;
      const d = def.d;
      const r = ((rot % 4) + 4) % 4;
      if (r === 0) return { x: area.x, z: area.z, w: area.w, d: area.d };
      if (r === 1) return { x: area.z, z: w - area.x - area.w, w: area.d, d: area.w };
      if (r === 2) return { x: w - area.x - area.w, z: d - area.z - area.d, w: area.w, d: area.d };
      return { x: d - area.z - area.d, z: area.x, w: area.d, d: area.w };
    }

    function itemSupportsCell(rec, x, z) {
      if (rec.kind === 'brick') {
        return !!(TYPE_MAP[rec.type] && TYPE_MAP[rec.type].support !== false);
      }
      if (rec.kind !== 'prop') return false;
      const def = PROP_MAP[rec.propType];
      if (!def || !def.support) return false;
      const area = effectiveSupportArea(def, rec.rot);
      if (!area) return true;
      return x >= rec.gx + area.x && x < rec.gx + area.x + area.w &&
        z >= rec.gz + area.z && z < rec.gz + area.z + area.d;
    }

    function registerOccupancy(rec) {
      const dims = itemDims(rec);
      const layers = itemLayers(rec);
      for (let l = 0; l < layers; l++) {
        for (let x = rec.gx; x < rec.gx + dims[0]; x++) {
          for (let z = rec.gz; z < rec.gz + dims[1]; z++) {
            state.occupancy.set(cellKey(x, z, rec.layer + l), rec);
          }
        }
      }
    }

    function unregisterOccupancy(rec) {
      const dims = itemDims(rec);
      const layers = itemLayers(rec);
      for (let l = 0; l < layers; l++) {
        for (let x = rec.gx; x < rec.gx + dims[0]; x++) {
          for (let z = rec.gz; z < rec.gz + dims[1]; z++) {
            const k = cellKey(x, z, rec.layer + l);
            if (state.occupancy.get(k) === rec) state.occupancy.delete(k);
          }
        }
      }
    }

    function addItem(data, animate) {
      const kind = data.kind || (data.propType ? 'prop' : 'brick');
      const def = kind === 'prop' ? PROP_MAP[data.propType] : TYPE_MAP[data.type];
      if (!def) return null;

      const rec = {
        id: state.nextId++,
        kind: kind,
        rot: ((data.rot | 0) % 4 + 4) % 4,
        gx: data.gx | 0,
        gz: data.gz | 0,
        layer: data.layer | 0
      };
      if (kind === 'prop') rec.propType = data.propType;
      else {
        rec.type = data.type;
        rec.color = normalizeColor(data.color || COLORS[0].hex);
      }

      const dims = effDims(def, rec.rot);
      const stackLayers = kind === 'prop' ? propLayers(def) : 1;
      if (rec.gx < 0 || rec.gz < 0 || rec.gx + dims[0] > SIZE || rec.gz + dims[1] > SIZE) return null;
      if (rec.layer < 0 || rec.layer + stackLayers - 1 > MAX_LAYER) return null;

      let object3d;
      if (kind === 'brick') {
        object3d = createBrickMesh(rec);
        state.bricks.push(rec);
        state.meshes.push(object3d);
      } else {
        object3d = createPropObject(rec);
        if (!object3d) return null;
        object3d.userData.record = rec;
        state.props.push(rec);
        object3d.userData.propMeshes.forEach(function (m) { state.meshes.push(m); });
      }

      scene.add(object3d);
      state.meshById.set(rec.id, object3d);
      registerOccupancy(rec);

      if (animate) {
        const baseScale = object3d.scale.clone();
        object3d.scale.copy(baseScale).multiplyScalar(0.85);
        spawns.push({ mesh: object3d, baseScale: baseScale, start: performance.now() });
      }
      return rec;
    }

    function removeItem(rec) {
      const object3d = state.meshById.get(rec.id);
      if (object3d) {
        scene.remove(object3d);
        state.meshById.delete(rec.id);
        if (rec.kind === 'prop' && object3d.userData.propMeshes) {
          object3d.userData.propMeshes.forEach(function (m) {
            const idx = state.meshes.indexOf(m);
            if (idx >= 0) state.meshes.splice(idx, 1);
          });
        } else {
          const idx = state.meshes.indexOf(object3d);
          if (idx >= 0) state.meshes.splice(idx, 1);
        }
      }

      const arr = rec.kind === 'prop' ? state.props : state.bricks;
      const ai = arr.indexOf(rec);
      if (ai >= 0) arr.splice(ai, 1);
      unregisterOccupancy(rec);
    }

    function canPlace(kind, id, rot, gx, gz, layer) {
      const def = kind === 'prop' ? PROP_MAP[id] : TYPE_MAP[id];
      if (!def) return false;
      const dims = effDims(def, rot);
      const stackLayers = kind === 'prop' ? propLayers(def) : 1;
      if (gx < 0 || gz < 0 || gx + dims[0] > SIZE || gz + dims[1] > SIZE) return false;
      if (layer < 0 || layer + stackLayers - 1 > MAX_LAYER) return false;

      let hasSupport = layer === 0;
      let allCellsSupported = true;
      let strictBelow = null;
      for (let l = 0; l < stackLayers; l++) {
        for (let x = gx; x < gx + dims[0]; x++) {
          for (let z = gz; z < gz + dims[1]; z++) {
            if (state.occupancy.has(cellKey(x, z, layer + l))) return false;
            if (l === 0) {
              const below = state.occupancy.get(cellKey(x, z, layer - 1));
              if (below && itemSupportsCell(below, x, z)) {
                hasSupport = true;
                if (below.kind === 'prop') {
                  const belowDef = PROP_MAP[below.propType];
                  if (belowDef && belowDef.strictSupport) strictBelow = below;
                }
              } else {
                allCellsSupported = false;
              }
            }
          }
        }
      }
      if (!hasSupport) return false;
      if (strictBelow && !allCellsSupported) return false;
      return true;
    }

    function footprintsOverlap(gx1, gz1, gx2, gz2, ew, ed) {
      return gx1 < gx2 + ew && gx2 < gx1 + ew && gz1 < gz2 + ed && gz2 < gz1 + ed;
    }

    function updateCount() {
      countEl.textContent = String(state.bricks.length + state.props.length);
    }

    // ---------------------------------------------------------------- history
    function snapshot() {
      return {
        size: SIZE,
        bricks: state.bricks.map(function (b) {
          return { kind: 'brick', type: b.type, rot: b.rot, gx: b.gx, gz: b.gz, layer: b.layer, color: b.color };
        }),
        props: state.props.map(function (p) {
          return { kind: 'prop', propType: p.propType, rot: p.rot, gx: p.gx, gz: p.gz, layer: p.layer };
        })
      };
    }

    function updateHistoryUI() {
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
    }

    function pushHistory(before) {
      undoStack.push(JSON.stringify(before));
      if (undoStack.length > 60) undoStack.shift();
      redoStack.length = 0;
      updateHistoryUI();
    }

    function rebuildFrom(bricks, props, animate) {
      Array.from(state.meshById.values()).forEach(function (obj) { scene.remove(obj); });
      state.bricks = [];
      state.props = [];
      state.occupancy.clear();
      state.meshes = [];
      state.meshById.clear();
      state.nextId = 1;
      spawns = [];

      bricks.forEach(function (b) { addItem(b, !!animate); });
      props.forEach(function (p) { addItem(p, !!animate); });
      updateCount();
      updateHistoryUI();
    }

    function restoreSnapshot(snap) {
      if (!snap || !Array.isArray(snap.bricks)) return;
      const nextSize = clamp(Number(snap.size) || MIN_SIZE, MIN_SIZE, MAX_SIZE);
      const sizeChanged = nextSize !== SIZE;
      if (sizeChanged) {
        SIZE = nextSize;
        rebuildPlate();
        rebuildBlueprintMesh();
        cam.userZoomed = false;
        fitViewToPlate();
      } else {
        updatePlateSizeUI();
      }
      rebuildFrom(snap.bricks, Array.isArray(snap.props) ? snap.props : [], false);
      refreshAim();
    }

    function undo() {
      if (!undoStack.length) return;
      redoStack.push(JSON.stringify(snapshot()));
      const snap = JSON.parse(undoStack.pop());
      restoreSnapshot(snap);
      saveNow();
      playSound('tick');
      toast('已撤销');
    }

    function redo() {
      if (!redoStack.length) return;
      undoStack.push(JSON.stringify(snapshot()));
      const snap = JSON.parse(redoStack.pop());
      restoreSnapshot(snap);
      saveNow();
      playSound('tick');
      toast('已重做');
    }

    // ---------------------------------------------------------------- persistence
    function saveNow() {
      try {
        const snap = snapshot();
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          v: 2,
          size: snap.size,
          bricks: snap.bricks,
          props: snap.props,
          category: state.category,
          type: state.type,
          propType: state.propType,
          color: state.color,
          rot: state.rot,
          symmetry: state.symmetry,
          sound: state.sound,
          blueprint: state.blueprint,
          weather: state.weather,
          weatherAuto: state.weatherAuto
        }));
      } catch (err) { /* storage unavailable */ }
    }

    function scheduleSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 300);
    }

    // ---------------------------------------------------------------- sound
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(kind) {
      if (!state.sound) return;
      try {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (kind === 'place') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1150, t);
          osc.frequency.exponentialRampToValueAtTime(430, t + 0.055);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.085, t + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
          osc.start(t);
          osc.stop(t + 0.09);
        } else if (kind === 'erase') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(250, t);
          osc.frequency.exponentialRampToValueAtTime(110, t + 0.09);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.07, t + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.14);
        } else if (kind === 'error') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(170, t);
          osc.frequency.exponentialRampToValueAtTime(120, t + 0.07);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.035, t + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
          osc.start(t);
          osc.stop(t + 0.1);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(760, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.045, t + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          osc.start(t);
          osc.stop(t + 0.06);
        }
      } catch (err) { /* audio blocked */ }
    }

    // ---------------------------------------------------------------- aim & raycast
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    function setNdc(clientX, clientY) {
      const rect = canvasEl.getBoundingClientRect();
      ndc.set(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );
    }

    function raycastBuild(clientX, clientY) {
      camera.updateMatrixWorld();
      setNdc(clientX, clientY);
      raycaster.setFromCamera(ndc, camera);
      const targets = [platePick].concat(state.meshes);
      const hits = raycaster.intersectObjects(targets, false);
      return hits.length ? hits[0] : null;
    }

    function raycastBricks(clientX, clientY) {
      camera.updateMatrixWorld();
      setNdc(clientX, clientY);
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(state.meshes, false);
      return hits.length ? hits[0] : null;
    }

    function computeBuildAim(clientX, clientY) {
      const piece = currentPiece();
      const hit = raycastBuild(clientX, clientY);
      if (!hit) return null;

      let layer;
      let wx;
      let wz;
      let hitItem = null;
      let climbFrom = -1;
      let supportMiss = false;

      if (hit.object === platePick) {
        layer = 0;
        wx = hit.point.x;
        wz = hit.point.z;
      } else {
        const rec = hit.object.userData.record;
        if (!rec) return null;
        if (rec.kind === 'prop') {
          const propDef = PROP_MAP[rec.propType];
          if (!propDef || !propDef.support) return null;
        }
        hitItem = rec;

        const nLocal = hit.face ? hit.face.normal.clone() : new THREE.Vector3(0, 1, 0);
        const n = nLocal.transformDirection(hit.object.matrixWorld);
        const recDims = itemDims(rec);

        let cx = Math.floor((hit.point.x + SIZE / 2) / CELL);
        let cz = Math.floor((hit.point.z + SIZE / 2) / CELL);
        cx = clamp(cx, rec.gx, rec.gx + recDims[0] - 1);
        cz = clamp(cz, rec.gz, rec.gz + recDims[1] - 1);

        if (rec.kind === 'prop') {
          const supportDef = PROP_MAP[rec.propType];
          const supportArea = effectiveSupportArea(supportDef, rec.rot);
          if (supportArea && !(cx >= rec.gx + supportArea.x && cx < rec.gx + supportArea.x + supportArea.w &&
              cz >= rec.gz + supportArea.z && cz < rec.gz + supportArea.z + supportArea.d)) {
            supportMiss = true;
          }
          layer = rec.layer + propLayers(supportDef);
        } else if (n.y < -0.4) {
          layer = rec.layer - 1;
        } else {
          layer = rec.layer + 1;
          if (piece.kind === 'brick') climbFrom = layer;
        }
        wx = -SIZE / 2 + (cx + 0.5) * CELL;
        wz = -SIZE / 2 + (cz + 0.5) * CELL;
      }

      const dims = effDims(piece.def, state.rot);
      const fx = (wx + SIZE / 2) / CELL;
      const fz = (wz + SIZE / 2) / CELL;
      let gx = Math.round(fx - dims[0] / 2);
      let gz = Math.round(fz - dims[1] / 2);
      gx = clamp(gx, 0, SIZE - dims[0]);
      gz = clamp(gz, 0, SIZE - dims[1]);

      if (hitItem && hitItem.kind === 'prop') {
        const supportDef = PROP_MAP[hitItem.propType];
        if (supportDef && supportDef.support) {
          const area = effectiveSupportArea(supportDef, hitItem.rot);
          const supportDims = itemDims(hitItem);
          const zoneX = hitItem.gx + (area ? area.x : 0);
          const zoneZ = hitItem.gz + (area ? area.z : 0);
          const zoneW = area ? area.w : supportDims[0];
          const zoneD = area ? area.d : supportDims[1];
          if (dims[0] <= zoneW && dims[1] <= zoneD) {
            gx = clamp(gx, zoneX, zoneX + zoneW - dims[0]);
            gz = clamp(gz, zoneZ, zoneZ + zoneD - dims[1]);
          }
        }
      }

      let valid = canPlace(piece.kind, piece.id, state.rot, gx, gz, layer);
      if (!valid && climbFrom >= 0 && !supportMiss) {
        for (let l = climbFrom + 1; l <= MAX_LAYER; l++) {
          if (canPlace(piece.kind, piece.id, state.rot, gx, gz, l)) {
            layer = l;
            valid = true;
            break;
          }
        }
      }
      if (supportMiss) valid = false;

      const mirrorGx = SIZE - gx - dims[0];
      const mirrorAvailable = state.symmetry && mirrorGx !== gx &&
        !footprintsOverlap(gx, gz, mirrorGx, gz, dims[0], dims[1]);
      const mirrorValid = !supportMiss && mirrorAvailable && canPlace(piece.kind, piece.id, state.rot, mirrorGx, gz, layer);

      return {
        gx: gx,
        gz: gz,
        layer: layer,
        valid: valid,
        mirrorGx: mirrorGx,
        mirrorAvailable: mirrorAvailable,
        mirrorValid: mirrorValid,
        hitItem: hitItem,
        supportMiss: supportMiss
      };
    }

    function positionGhost(group, gx, gz, layer) {
      const piece = currentPiece();
      const dims = effDims(piece.def, state.rot);
      group.position.set(
        worldX(gx, dims[0]),
        layer * LAYER + 0.006,
        worldZ(gz, dims[1])
      );
      group.rotation.y = state.rot * Math.PI / 2;
    }

    function hideGhosts() {
      ghostGroup.visible = false;
      ghostMirror.visible = false;
      eraseBox.visible = false;
    }

    function setGhostGroupValidity(group, valid) {
      const mat = valid ? ghostGoodMat : ghostBadMat;
      group.traverse(function (o) {
        if (o.isMesh && o.userData.ghost) o.material = mat;
      });
    }

    function renderAim() {
      if (!currentAim) {
        hideGhosts();
        return;
      }
      const aim = currentAim;

      if (state.tool === 'erase') {
        ghostGroup.visible = false;
        ghostMirror.visible = false;
        const rec = aim.hitItem;
        if (rec) {
          const def = itemDef(rec);
          const dims = effDims(def, rec.rot);
          const h = rec.kind === 'prop' ? (PROP_MAP[rec.propType].height || 1) : BODY;
          eraseBox.position.set(
            worldX(rec.gx, dims[0]),
            rec.layer * LAYER + h / 2,
            worldZ(rec.gz, dims[1])
          );
          eraseBox.scale.set(dims[0] * 0.99, h * 1.04, dims[1] * 0.99);
          eraseBox.visible = true;
        } else {
          eraseBox.visible = false;
        }
        return;
      }

      eraseBox.visible = false;
      if (aim.layer < 0) {
        ghostGroup.visible = false;
        ghostMirror.visible = false;
        return;
      }

      setGhostGroupValidity(ghostGroup, aim.valid);
      positionGhost(ghostGroup, aim.gx, aim.gz, aim.layer);
      ghostGroup.visible = true;

      if (aim.mirrorAvailable) {
        setGhostGroupValidity(ghostMirror, aim.mirrorValid);
        positionGhost(ghostMirror, aim.mirrorGx, aim.gz, aim.layer);
        ghostMirror.visible = true;
      } else {
        ghostMirror.visible = false;
      }
    }

    function updateAim(clientX, clientY) {
      lastPointer = { x: clientX, y: clientY, type: 'mouse', active: true };

      if (state.tool === 'erase') {
        const hit = raycastBricks(clientX, clientY);
        currentAim = hit ? { hitItem: hit.object.userData.record } : null;
        renderAim();
        return;
      }

      currentAim = computeBuildAim(clientX, clientY);
      renderAim();
    }

    function refreshAim() {
      if (lastPointer && lastPointer.active && lastPointer.type === 'mouse') {
        updateAim(lastPointer.x, lastPointer.y);
      } else {
        hideGhosts();
      }
    }

    // ---------------------------------------------------------------- actions
    function hideIntro() {
      introEl.classList.add('is-hidden');
    }

    function placeAt(clientX, clientY) {
      const aim = computeBuildAim(clientX, clientY);
      currentAim = aim;
      renderAim();

      if (!aim || !aim.valid) {
        if (aim) {
          playSound('error');
          if (aim.supportMiss) toast('车头不能放东西');
        }
        return;
      }

      const piece = currentPiece();
      const before = snapshot();

      function payload(gx) {
        if (piece.kind === 'prop') {
          return { kind: 'prop', propType: piece.id, rot: state.rot, gx: gx, gz: aim.gz, layer: aim.layer };
        }
        return { kind: 'brick', type: piece.id, rot: state.rot, gx: gx, gz: aim.gz, layer: aim.layer, color: state.color };
      }

      addItem(payload(aim.gx), true);
      if (aim.mirrorAvailable && aim.mirrorValid) {
        addItem(payload(aim.mirrorGx), true);
      }

      pushHistory(before);
      updateCount();
      scheduleSave();
      playSound('place');
      hideIntro();

      if (lastPointer && lastPointer.type === 'mouse') {
        updateAim(clientX, clientY);
      } else {
        hideGhosts();
      }
    }

    function deleteAt(clientX, clientY) {
      const hit = raycastBricks(clientX, clientY);
      if (!hit) return;

      const rec = hit.object.userData.record;
      if (!rec) return;

      const before = snapshot();
      removeItem(rec);

      if (state.symmetry) {
        const dims = itemDims(rec);
        const mirrorGx = SIZE - rec.gx - dims[0];
        if (mirrorGx !== rec.gx) {
          const twin = state.occupancy.get(cellKey(mirrorGx, rec.gz, rec.layer));
          if (twin && twin !== rec) removeItem(twin);
        }
      }

      pushHistory(before);
      updateCount();
      scheduleSave();
      playSound('erase');
      hideIntro();

      if (lastPointer && lastPointer.type === 'mouse') {
        updateAim(clientX, clientY);
      } else {
        hideGhosts();
      }
    }

    function setTool(tool) {
      state.tool = tool;
      buildToolBtn.classList.toggle('is-active', tool === 'build');
      eraseToolBtn.classList.toggle('is-active', tool === 'erase');
      stageEl.classList.toggle('is-erasing', tool === 'erase');
      hideGhosts();
      currentAim = null;
      refreshAim();
      scheduleSave();
    }

    function rotate() {
      state.rot = (state.rot + 1) % 4;
      playSound('tick');
      refreshAim();
      scheduleSave();
    }

    function toggleSymmetry() {
      state.symmetry = !state.symmetry;
      symBtn.classList.toggle('is-active', state.symmetry);
      if (symmetryLine) symmetryLine.visible = state.symmetry;
      refreshAim();
      scheduleSave();
      toast(state.symmetry ? '对称模式开启 · 左右同时放砖' : '对称模式关闭');
    }

    function extendPlate() {
      if (SIZE >= MAX_SIZE) {
        toast('底板已经是最大尺寸了');
        return;
      }

      const before = snapshot();
      const delta = GROW_STEP / 2;
      SIZE = Math.min(MAX_SIZE, SIZE + GROW_STEP);

      state.bricks.forEach(function (b) {
        b.gx += delta;
        b.gz += delta;
      });
      state.props.forEach(function (p) {
        p.gx += delta;
        p.gz += delta;
      });

      state.occupancy.clear();
      state.bricks.forEach(registerOccupancy);
      state.props.forEach(registerOccupancy);

      state.bricks.forEach(function (b) {
        const dims = itemDims(b);
        const obj = state.meshById.get(b.id);
        if (obj) obj.position.set(worldX(b.gx, dims[0]), b.layer * LAYER, worldZ(b.gz, dims[1]));
      });
      state.props.forEach(function (p) {
        const dims = itemDims(p);
        const obj = state.meshById.get(p.id);
        if (obj) obj.position.set(worldX(p.gx, dims[0]), p.layer * LAYER, worldZ(p.gz, dims[1]));
      });

      rebuildPlate();
      rebuildBlueprintMesh();
      cam.userZoomed = false;
      fitViewToPlate();
      hideGhosts();
      currentAim = null;

      pushHistory(before);
      updateCount();
      saveNow();
      playSound('place');
      toast('底板扩展到 ' + SIZE + ' × ' + SIZE);
    }

    function toggleBlueprint() {
      state.blueprint = !state.blueprint;
      blueprintBtn.classList.toggle('is-active', state.blueprint);
      if (blueprintMesh) {
        blueprintMesh.visible = state.blueprint;
        if (state.blueprint) hideIntro();
      }
      scheduleSave();
      if (state.blueprint) toast('城堡蓝图已铺开 · 照着轮廓填砖');
    }

    function toggleSound() {
      state.sound = !state.sound;
      updateSoundUI();
      scheduleSave();
      if (state.sound) playSound('tick');
    }

    function updateSoundUI() {
      soundBtn.classList.toggle('is-muted', !state.sound);
      soundBtn.title = state.sound ? '关闭声音' : '开启声音';
      soundBtn.setAttribute('aria-label', state.sound ? '关闭声音' : '开启声音');
    }

    // ---------------------------------------------------------------- blueprint
    let blueprintMesh = null;

    function rebuildBlueprintMesh() {
      if (blueprintMesh) {
        scene.remove(blueprintMesh);
        blueprintMesh.geometry.dispose();
        blueprintMesh.material.dispose();
        blueprintMesh = null;
      }

      const cells = new Set();
      const key = function (x, z, y) { return x + ',' + z + ',' + y; };
      const add = function (x, z, y) {
        if (x >= 0 && x < SIZE && z >= 0 && z < SIZE && y >= 0 && y < MAX_LAYER) {
          cells.add(key(x, z, y));
        }
      };
      const box = function (x0, z0, w, d, y0, h) {
        for (let y = y0; y < y0 + h; y++) {
          for (let x = x0; x < x0 + w; x++) {
            for (let z = z0; z < z0 + d; z++) add(x, z, y);
          }
        }
      };

      const BP_W = 22;
      const BP_D = 18;
      const X0 = Math.round((SIZE - BP_W) / 2);
      const Z0 = Math.round((SIZE - BP_D) / 2);
      const X1 = X0 + BP_W - 1;
      const Z1 = Z0 + BP_D - 1;
      const WALL_H = 6;
      const GATE_X0 = X0 + 9;
      const GATE_X1 = X0 + 11;

      for (let y = 0; y < WALL_H; y++) {
        for (let x = X0; x <= X1; x++) {
          add(x, Z0, y);
          add(x, Z1, y);
        }
        for (let z = Z0; z <= Z1; z++) {
          add(X0, z, y);
          add(X1, z, y);
        }
      }

      for (let x = GATE_X0; x <= GATE_X1; x++) {
        for (let y = 0; y < 4; y++) cells.delete(key(x, Z0, y));
      }

      const towers = [[X0, Z0], [X1 - 2, Z0], [X0, Z1 - 2], [X1 - 2, Z1 - 2]];
      towers.forEach(function (t) {
        const tx = t[0];
        const tz = t[1];
        box(tx, tz, 3, 3, 0, 10);
        for (let dx = 0; dx < 3; dx++) {
          for (let dz = 0; dz < 3; dz++) {
            if (dx === 0 || dx === 2 || dz === 0 || dz === 2) {
              if ((dx + dz) % 2 === 0) add(tx + dx, tz + dz, 10);
            }
          }
        }
      });

      for (let x = X0 + 1; x < X1; x += 2) {
        if (x < GATE_X0 - 1 || x > GATE_X1 + 1) {
          add(x, Z0, WALL_H);
          add(x, Z1, WALL_H);
        }
      }
      for (let z = Z0 + 1; z < Z1; z += 2) {
        add(X0, z, WALL_H);
        add(X1, z, WALL_H);
      }

      const KX = X0 + 8;
      const KZ = Z0 + 8;
      box(KX, KZ, 6, 6, 0, 8);
      box(KX + 1, KZ + 1, 4, 4, 8, 2);
      for (let x = KX + 1; x <= KX + 4; x++) {
        for (let z = KZ + 1; z <= KZ + 4; z++) {
          if (x === KX + 1 || x === KX + 4 || z === KZ + 1 || z === KZ + 4) {
            if ((x + z) % 2 === 0) add(x, z, 10);
          }
        }
      }

      const geo = new THREE.BoxGeometry(0.92, LAYER * 0.52, 0.92);
      const parts = [];
      cells.forEach(function (k) {
        const p = k.split(',');
        const g = geo.clone();
        g.translate(
          -SIZE / 2 + Number(p[0]) + 0.5,
          Number(p[2]) * LAYER + LAYER / 2,
          -SIZE / 2 + Number(p[1]) + 0.5
        );
        parts.push(g);
      });
      geo.dispose();
      const merged = mergeGeometries(parts);
      parts.forEach(function (g) { g.dispose(); });
      const mat = new THREE.MeshBasicMaterial({
        color: 0xb6a7d8,
        transparent: true,
        opacity: 0.15,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      blueprintMesh = new THREE.Mesh(merged, mat);
      blueprintMesh.renderOrder = 2;
      blueprintMesh.visible = state.blueprint;
      blueprintMesh.raycast = function () {};
      scene.add(blueprintMesh);
    }
    rebuildBlueprintMesh();

    // ---------------------------------------------------------------- ui build
    const lastPicks = {
      basic: '2x4',
      special: 'slope1x2',
      large: 'floor6x6',
      build: 'column',
      char: 'minifig',
      furniture: 'chair',
      traffic: 'road_straight'
    };

    function brickIcon(def) {
      const u = 8;
      const pad = 3;
      const W = def.w * u + pad * 2;
      const H = def.d * u + pad * 2;
      const scale = Math.min(1.45, 40 / W, 40 / H);
      const innerW = def.w * u;
      const innerH = def.d * u;

      if (def.shape === 'round') {
        const r = Math.min(innerW, innerH) / 2 - 1;
        const cx = pad + innerW / 2;
        const cy = pad + innerH / 2;
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + (W * scale) + '" height="' + (H * scale) +
          '" aria-hidden="true"><circle cx="' + cx + '" cy="' + cy + '" r="' + r +
          '" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.3"/>' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.45) +
          '" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".4" stroke-width="1"/></svg>';
      }

      if (def.icon === 'floor') {
        let grid = '';
        for (let i = 2; i < def.w; i += 2) {
          grid += '<path d="M ' + (pad + i * u) + ' ' + pad + ' V ' + (pad + innerH) +
            '" stroke="currentColor" stroke-opacity=".16" stroke-width="1"/>';
        }
        for (let j = 2; j < def.d; j += 2) {
          grid += '<path d="M ' + pad + ' ' + (pad + j * u) + ' H ' + (pad + innerW) +
            '" stroke="currentColor" stroke-opacity=".16" stroke-width="1"/>';
        }
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + (W * scale) + '" height="' + (H * scale) +
          '" aria-hidden="true"><rect x="' + pad + '" y="' + pad + '" width="' + innerW +
          '" height="' + innerH + '" rx="2.5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="1.3"/>' +
          '<rect x="' + (pad + 3) + '" y="' + (pad + 3) + '" width="' + (innerW - 6) + '" height="' + (innerH - 6) +
          '" rx="1.5" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="1"/>' +
          grid + '</svg>';
      }

      let studs = '';
      if (def.shape === 'tile') {
        studs = '<rect x="' + (pad + 2.5) + '" y="' + (pad + 2.5) + '" width="' + (innerW - 5) +
          '" height="' + (innerH - 5) + '" rx="1.6" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1"/>';
      } else if (def.shape === 'slope') {
        const backY = pad + 0.28 * innerH;
        const frontY = pad + innerH;
        studs = '<path d="M ' + pad + ' ' + frontY + ' L ' + pad + ' ' + (backY + innerH * 0.18) +
          ' L ' + (pad + innerW) + ' ' + frontY + ' Z" fill="currentColor" fill-opacity=".16"/>' +
          '<path d="M ' + (pad + 1) + ' ' + frontY + ' L ' + (pad + 1) + ' ' + (backY + innerH * 0.18) +
          ' L ' + (pad + innerW - 1) + ' ' + frontY + '" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>';
        for (let i = 0; i < def.w; i++) {
          studs += '<circle cx="' + (pad + (i + 0.5) * u) + '" cy="' + backY +
            '" r="' + (u * 0.22) + '" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".38" stroke-width="1"/>';
        }
      } else {
        for (let i = 0; i < def.w; i++) {
          for (let j = 0; j < def.d; j++) {
            studs += '<circle cx="' + (pad + (i + 0.5) * u) + '" cy="' + (pad + (j + 0.5) * u) +
              '" r="' + (u * 0.24) + '" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".38" stroke-width="1"/>';
          }
        }
      }

      return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + (W * scale) + '" height="' + (H * scale) +
        '" aria-hidden="true"><rect x="' + pad + '" y="' + pad + '" width="' + innerW +
        '" height="' + innerH + '" rx="2.5" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.3"/>' +
        studs + '</svg>';
    }

    function propIcon(id) {
      const icons = {
        minifig: '<circle cx="12" cy="5.3" r="2.4"/><path d="M8.8 9h6.4l.8 5.6H8L8.8 9Z"/><path d="M8.3 14.6h7.4V20H8.3z"/><path d="M9 16.8v3.2M15 16.8v3.2"/>',
        cat: '<path d="M6.6 7 5 2.6l4.1 2.7h5.8L19 2.6 17.4 7v6.2a5.4 5.4 0 0 1-10.8 0V7Z"/><path d="M9.6 11h.01M14.4 11h.01"/><path d="M12 13v1.6"/>',
        dog: '<path d="M6.2 4.2c1.8 0 3.2 1.8 5.8 1.8s4-1.8 5.8-1.8v7.2a5.8 5.8 0 0 1-11.6 0V4.2Z"/><path d="M6.2 6.5c2 1 2.6 3 2.6 5M17.8 6.5c-2 1-2.6 3-2.6 5"/><circle cx="9.8" cy="11" r=".7" fill="currentColor"/><circle cx="14.2" cy="11" r=".7" fill="currentColor"/><path d="M12 13v1.5"/>',
        duck: '<path d="M4 15a5 5 0 0 1 5-5h4a4 4 0 1 1 0 8H9a5 5 0 0 1-5-3Z"/><path d="m15.4 10.5 6-2.5-2.1 4.3"/><circle cx="10" cy="12" r=".7" fill="currentColor"/>',

        lamp: '<path d="M9 3h6l3 7H6l3-7ZM12 10v9M8 20h8"/>',
        plant: '<path d="M9 14h6l-1 7H10l-1-7Z"/><path d="M12 14c0-5-4-5-4-9 4 0 5 4 4 9ZM12 14c0-5 4-5 4-9-4 0-5 4-4 9Z"/>',
        girl: '<circle cx="12" cy="5.8" r="2.3"/><path d="M8.8 4.9c-2.1 0-3.1.9-3.1 2.1M15.2 4.9c2.1 0 3.1.9 3.1 2.1"/><path d="M9.1 9h5.8l.7 3.8H8.4L9.1 9Z"/><path d="M8.4 12.8h7.2l2.1 7.2H6.3l2.1-7.2Z"/>',
        road_straight: '<path d="M7 2h10v20H7z"/><path d="M12 5v3M12 11v3M12 17v2"/>',
        road_curve: '<path d="M5 20V10a5 5 0 0 1 5-5h11"/><path d="m17 1 4 4-4 4"/>',
