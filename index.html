      });
      tsunamiFoamMats.push(mat);
      tsunamiGroup.add(new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, thick, 6, false),
        mat
      ));
    }
    addTsunamiFoamLine(4.1, 9.2, 0.22);
    addTsunamiFoamLine(6.4, 8.3, 0.13);
    addTsunamiFoamLine(0.2, 0.65, 0.12);
    const tsunamiFloodMat = new THREE.MeshBasicMaterial({
      color: 0x92d9e7,
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    const tsunamiFlood = new THREE.Mesh(new THREE.PlaneGeometry(82, 82), tsunamiFloodMat);
    tsunamiFlood.rotation.x = -Math.PI / 2;
    tsunamiFlood.position.y = 0.18;
    tsunamiFlood.visible = false;
    tsunamiFlood.renderOrder = 2;
    scene.add(tsunamiFlood);

    function triggerTsunami() {
      if (anyMajorActive()) {
        toast('灾害正在发生 · 先避一避吧');
        return false;
      }
      tsunami.active = true;
      tsunami.startTime = performance.now();
      tsunami.targets = [];
      tsunami.washTargets = [];
      tsunami.washed = new Set();
      tsunami.hit = new Set();
      tsunami.lastFoamAt = 0;
      const targets = pickDamageTargets(2, 8);
      for (let i = 0; i < targets.length; i++) {
        const rec = targets[i];
        let wx = 0;
        if (rec.kind === 'prop') {
          const g = state.meshById.get(rec.id);
          if (g) wx = g.position.x;
        } else {
          const dims = itemDims(rec);
          wx = worldX(rec.gx, dims[0]);
        }
        tsunami.targets.push({ rec: rec, x: wx });
      }
      for (let i = 0; i < state.props.length; i++) {
        const p = state.props[i];
        const def = PROP_MAP[p.propType];
        if (!def || p.damaged) continue;
        if (def.cat !== 'person' && def.cat !== 'animal' && def.cat !== 'char') continue;
        const g = state.meshById.get(p.id);
        if (g) tsunami.washTargets.push({ rec: p, x: g.position.x });
      }
      tsunamiGroup.visible = true;
      tsunamiGroup.position.set(58, 0.1, 0);
      tsunamiGroup.scale.set(1, 0.8, 1);
      tsunamiFlood.visible = true;
      tsunamiFloodMat.opacity = 0;
      shakeStage(800);
      playSound('wave');
      toast('海啸来啦 · 海浪从海面冲上舞台');
      return true;
    }

    function updateTsunami(now) {
      if (!tsunami.active) return;
      const p = clamp((now - tsunami.startTime) / tsunami.duration, 0, 1);
      const travel = smoothstep(0, 0.72, p);
      const waveX = 58 + (-48 - 58) * travel;
      tsunamiGroup.position.x = waveX;
      tsunamiGroup.scale.set(1, 0.78 + Math.sin(Math.min(1, p * 1.15) * Math.PI) * 0.32, 1);
      const fade = smoothstep(0, 0.08, p) * (1 - smoothstep(0.72, 1, p));
      tsunamiWaveMat.opacity = 0.7 * fade;
      for (let i = 0; i < tsunamiFoamMats.length; i++) {
        tsunamiFoamMats[i].opacity = 0.82 * fade;
      }
      tsunamiFloodMat.opacity = 0.2 * smoothstep(0.12, 0.38, p) * (1 - smoothstep(0.68, 0.97, p));
      tsunamiFlood.visible = tsunamiFloodMat.opacity > 0.002;
      for (let i = 0; i < tsunami.targets.length; i++) {
        const item = tsunami.targets[i];
        if (tsunami.hit.has(item.rec.id)) continue;
        if (waveX - 1.4 <= item.x) {
          tsunami.hit.add(item.rec.id);
          const g = state.meshById.get(item.rec.id);
          if (damageItem(item.rec, 'broken')) {
            spawnFxParticles(
              g ? g.position.x : item.x,
              0.35,
              g ? g.position.z : 0,
              [0xd8f5fb, 0x9fdfea, 0xf4fdff],
              9, 2.3, { gravity: 5, life: 0.8 }
            );
          }
        }
      }
      for (let i = 0; i < tsunami.washTargets.length; i++) {
        const item = tsunami.washTargets[i];
        if (tsunami.washed.has(item.rec.id)) continue;
        if (waveX - 1.4 > item.x) continue;
        tsunami.washed.add(item.rec.id);
        const g = state.meshById.get(item.rec.id);
        if (!g || !g.parent) continue;
        const fake = {
          rec: item.rec,
          group: g,
          sx: g.scale.x,
          sy: g.scale.y,
          sz: g.scale.z
        };
        scatterTornadoProp(
          fake,
          -SIZE / 2 + 6,
          g.position.z + (Math.random() - 0.5) * 14,
          { colors: [0xd8f5fb, 0x9fdfea, 0xf4fdff], count: 8, power: 2.4, gravity: 5, life: 0.75 }
        );
        scheduleSave();
      }
      if (p < 0.8 && now - tsunami.lastFoamAt > 150) {
        tsunami.lastFoamAt = now;
        spawnFxParticles(
          waveX + 2.5,
          0.22,
          (Math.random() - 0.5) * 38,
          [0xf4fdff, 0xd8f5fb, 0x92d9e7],
          4, 1.8, { gravity: 3.5, life: 0.65, size: 0.11 }
        );
      }
      if (p >= 1) {
        tsunami.active = false;
        tsunamiGroup.visible = false;
        tsunamiFlood.visible = false;
        tsunami.targets = [];
        tsunami.washTargets = [];
        tsunami.washed.clear();
        tsunami.hit.clear();
        scheduleSave();
        toast('海浪退去了');
      }
    }

    // ---------------------------------------------------------------- lightning
    let lastLightningAt = 0;
    function triggerLightning(manual) {
      if (state.weather !== 'rain' && state.weather !== 'snow') {
        if (manual) toast('晴天打不了雷 · 先切到下雨或下雪吧');
        return false;
      }
      if (anyMajorActive()) {
        if (manual) toast('灾害正在发生 · 先避一避吧');
        return false;
      }
      const now = performance.now();
      if (now - lastLightningAt < 900) return false;
      lastLightningAt = now;
      const candidates = state.props.filter(function (p) {
        const def = PROP_MAP[p.propType];
        if (!def || (def.cat !== 'person' && def.cat !== 'animal' && def.cat !== 'char')) return false;
        if (p.damaged) return false;
        return !isSheltered(p);
      });
      shuffleList(candidates);
      const strikeCount = candidates.length ? (Math.random() < 0.32 ? 2 : 1) : 0;
      let hitCount = 0;
      for (let i = 0; i < strikeCount && i < candidates.length; i++) {
        const p = candidates[i];
        const g = state.meshById.get(p.id);
        if (!g) continue;
        const def = PROP_MAP[p.propType];
        const boltY = g.position.y + (def && def.cat === 'animal' ? 1.35 : 2.25);
        spawnLightningBolt(g.position.x, boltY, g.position.z, now);
        if (damageItem(p, 'burnt')) hitCount++;
      }
      if (!hitCount) {
        const a = Math.random() * Math.PI * 2;
        const r = 4 + Math.random() * Math.max(4, SIZE / 2 - 6);
        const x = Math.sin(a) * r;
        const z = Math.cos(a) * r;
        spawnLightningBolt(x, 0.3, z, now);
        spawnCrackLines(x, z, 2);
      }
      flashScreen();
      playSound('thunder');
      if (hitCount || manual) toast(hitCount ? '雷电落下 · 有角色被击中了' : '雷电劈在了空地上');
      return true;
    }

    function updateWeatherLightning(now) {
      if (!nextLightningAt) return;
      if (!state.eventsAuto) return;
      if (state.weather !== 'rain' && state.weather !== 'snow') {
        nextLightningAt = 0;
        return;
      }
      if (now < nextLightningAt) return;
      nextLightningAt = now + 26000 + Math.random() * 22000;
      if (!anyMajorActive()) triggerLightning(false);
    }

    backdropReady = true;

    // ---------------------------------------------------------------- helpers
    function mergeGeometries(list) {
      const parts = list.map(function (g) { return g.index ? g.toNonIndexed() : g; });
      const merged = new THREE.BufferGeometry();
      const names = ['position', 'normal', 'uv'];
      for (let n = 0; n < names.length; n++) {
        const name = names[n];
        const first = parts[0].attributes[name];
        if (!first) continue;
        let total = 0;
        for (let i = 0; i < parts.length; i++) total += parts[i].attributes[name].count;
        const array = new first.array.constructor(total * first.itemSize);
        let offset = 0;
        for (let i = 0; i < parts.length; i++) {
          const attr = parts[i].attributes[name];
          array.set(attr.array, offset);
          offset += attr.array.length;
        }
        merged.setAttribute(name, new THREE.BufferAttribute(array, first.itemSize));
      }
      merged.computeBoundingSphere();
      return merged;
    }

    function effDims(def, rot) {
      return (rot % 2 === 0) ? [def.w, def.d] : [def.d, def.w];
    }

    function cellKey(x, z, y) { return x + ',' + z + ',' + y; }

    function worldX(gx, ew) { return -SIZE / 2 + (gx + ew / 2) * CELL; }
    function worldZ(gz, ed) { return -SIZE / 2 + (gz + ed / 2) * CELL; }

    // ---------------------------------------------------------------- baseplate
    const plateTopMat = new THREE.MeshStandardMaterial({ color: 0xb6d8c6, roughness: 0.58, metalness: 0.02 });
    const plateBodyMat = new THREE.MeshStandardMaterial({ color: 0x8fbca9, roughness: 0.68, metalness: 0 });
    const platePickMat = new THREE.MeshBasicMaterial({ visible: false });

    let plateTopMesh = null;
    let plateBodyMesh = null;
    let platePick = null;
    let groundShadowMesh = null;
    let symmetryLine = null;

    function buildPlateTopGeometry() {
      const parts = [];
      const topSlab = new THREE.BoxGeometry(SIZE, 0.08, SIZE);
      topSlab.translate(0, -0.04, 0);
      parts.push(topSlab);

      const studGeo = new THREE.CylinderGeometry(0.28, 0.3, STUD, 12);
      for (let x = 0; x < SIZE; x++) {
        for (let z = 0; z < SIZE; z++) {
          const s = studGeo.clone();
          s.translate(-SIZE / 2 + x + 0.5, STUD / 2, -SIZE / 2 + z + 0.5);
          parts.push(s);
        }
      }
      return mergeGeometries(parts);
    }

    function rebuildPlate() {
      if (!plateTopMesh) {
        plateTopMesh = new THREE.Mesh(buildPlateTopGeometry(), plateTopMat);
        plateTopMesh.receiveShadow = true;
        plateTopMesh.userData.isPlate = true;
        scene.add(plateTopMesh);
      } else {
        plateTopMesh.geometry.dispose();
        plateTopMesh.geometry = buildPlateTopGeometry();
      }

      if (!plateBodyMesh) {
        plateBodyMesh = new THREE.Mesh(new THREE.BoxGeometry(SIZE + 0.6, 0.42, SIZE + 0.6), plateBodyMat);
        plateBodyMesh.position.y = -0.29;
        plateBodyMesh.receiveShadow = true;
        plateBodyMesh.castShadow = true;
        scene.add(plateBodyMesh);
      } else {
        plateBodyMesh.geometry.dispose();
        plateBodyMesh.geometry = new THREE.BoxGeometry(SIZE + 0.6, 0.42, SIZE + 0.6);
      }

      if (!platePick) {
        platePick = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), platePickMat);
        platePick.rotation.x = -Math.PI / 2;
        platePick.position.y = 0.001;
        scene.add(platePick);
      } else {
        platePick.geometry.dispose();
        platePick.geometry = new THREE.PlaneGeometry(SIZE, SIZE);
      }

      if (groundShadowMesh) {
        groundShadowMesh.scale.setScalar(SIZE / 34);
      }

      const shadowSize = SIZE / 2 + 8;
      keyLight.shadow.camera.left = -shadowSize;
      keyLight.shadow.camera.right = shadowSize;
      keyLight.shadow.camera.top = shadowSize;
      keyLight.shadow.camera.bottom = -shadowSize;
      keyLight.shadow.camera.updateProjectionMatrix();

      rebuildSymmetryLine();
      updatePlateSizeUI();
    }

    function rebuildSymmetryLine() {
      if (!symmetryLine) {
        const mat = new THREE.LineDashedMaterial({

    function getBrickGeometry(id) {
      if (geomCache.has(id)) return geomCache.get(id);
      const def = TYPE_MAP[id];
      const parts = [];
      const width = def.w * CELL - GAP;
      const depth = def.d * CELL - GAP;

      if (def.shape === 'round') {
        const body = new THREE.CylinderGeometry(width / 2, width / 2, BODY, 24);
        body.translate(0, BODY / 2, 0);
        parts.push(body);
        const studGeo = new THREE.CylinderGeometry(0.27, 0.3, STUD, 20);
        const stud = studGeo.clone();
        stud.translate(0, BODY + STUD / 2 - 0.002, 0);
        parts.push(stud);
      } else if (def.shape === 'tile') {
        const lower = new THREE.BoxGeometry(width, BODY - 0.045, depth);
        lower.translate(0, (BODY - 0.045) / 2, 0);
        parts.push(lower);
        const top = new THREE.BoxGeometry(width - 0.09, 0.045, depth - 0.09);
        top.translate(0, BODY - 0.0225, 0);
        parts.push(top);
      } else if (def.shape === 'slope') {
        const hw = width / 2;
        const hd = depth / 2;
        const low = 0.12;
        const zFlat = -hd + 0.6;
        const shape = new THREE.Shape();
        shape.moveTo(-hd, 0);
        shape.lineTo(hd, 0);
        shape.lineTo(hd, low);
        shape.lineTo(zFlat, BODY);
        shape.lineTo(-hd, BODY);
        shape.closePath();
        const wedge = new THREE.ExtrudeGeometry(shape, {
          depth: width,
          bevelEnabled: false,
          curveSegments: 1,
          steps: 1
        });
        wedge.rotateY(-Math.PI / 2);
        wedge.translate(width / 2, 0, 0);
        parts.push(wedge);

        const studGeo = new THREE.CylinderGeometry(0.27, 0.3, STUD, 16);
        for (let i = 0; i < def.w; i++) {
          const stud = studGeo.clone();
          stud.translate(
            -def.w * CELL / 2 + (i + 0.5) * CELL,
            BODY + STUD / 2 - 0.002,
            (-hd + zFlat) / 2
          );
          parts.push(stud);
        }
      } else {
        const body = new THREE.BoxGeometry(width, BODY, depth);
        body.translate(0, BODY / 2, 0);
        parts.push(body);

        const studGeo = new THREE.CylinderGeometry(0.27, 0.3, STUD, 16);
        for (let i = 0; i < def.w; i++) {
          for (let j = 0; j < def.d; j++) {
            const s = studGeo.clone();
            s.translate(
              -def.w * CELL / 2 + (i + 0.5) * CELL,
              BODY + STUD / 2 - 0.002,
              -def.d * CELL / 2 + (j + 0.5) * CELL
            );
            parts.push(s);
          }
        }
      }

      const merged = mergeGeometries(parts);
      geomCache.set(id, merged);
      return merged;
    }

    function getPropTemplate(id) {
      if (propTemplateCache.has(id)) return propTemplateCache.get(id);
      const builder = PROP_BUILDERS[id];
      if (!builder) return new THREE.Group();
      const template = builder();
      const def = PROP_MAP[id];
      if (def && def.scale) template.scale.setScalar(def.scale);
      if (def && def.support && !def.native) template.scale.y *= LAYER;
      template.traverse(function (o) {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      propTemplateCache.set(id, template);
      return template;
    }

    function buildWeatherCoat(color, puffy, accent) {
      const grp = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: color,

        metalness: 0
      });
      const trimMat = new THREE.MeshStandardMaterial({
        color: accent || 0xf8f1e6,
        roughness: 0.7
      });

        new THREE.CylinderGeometry(puffy ? 0.31 : 0.29, puffy ? 0.35 : 0.33, puffy ? 0.52 : 0.48, 18),
        mat
      );
      shell.position.y = 0.72;
      grp.add(shell);
      for (let s = -1; s <= 1; s += 2) {
        const sleeve = new THREE.Mesh(
          new THREE.CylinderGeometry(0.082, 0.088, 0.32, 10),
          mat
        );
        sleeve.position.set(s * 0.31, 0.82, 0);
        sleeve.rotation.z = s * 0.18;
        grp.add(sleeve);
      }
      const zip = new THREE.Mesh(new THREE.BoxGeometry(0.024, 0.4, 0.02), trimMat);

        const seamMat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(color).offsetHSL(0, -0.02, -0.035),

    function attachEnvironmentProps(group, rec) {
      const def = PROP_MAP[rec.propType];
      if (!def) return;
      if ((def.cat === 'person' || def.cat === 'animal' || def.cat === 'char') && CHAR_ACC[def.id]) attachCharacterAccessories(group, def);
      if (rec.propType === 'window' || rec.propType === 'door') attachNightGlow(group, rec.propType);
      if ((def.cat === 'vehicle' || def.cat === 'traffic') && VEHICLE_LIGHT_ANCHORS[rec.propType]) attachVehicleGlow(group, def);
      syncAttachmentVisibility(group);
    }

    function createPropObject(rec) {
      const def = PROP_MAP[rec.propType];
      if (!def) return null;
      const dims = effDims(def, rec.rot);
      const group = getPropTemplate(rec.propType).clone(true);
      group.position.set(
        worldX(rec.gx, dims[0]),
        rec.layer * LAYER,
        worldZ(rec.gz, dims[1])
      );
      group.rotation.y = rec.rot * Math.PI / 2;
      group.userData.propMeshes = [];
      group.traverse(function (o) {
        if (o.isMesh) {
          o.userData.record = rec;
          group.userData.propMeshes.push(o);
        }
      });
      attachEnvironmentProps(group, rec);
      if (def.cat === 'person' || def.cat === 'animal' || def.cat === 'char') {
        group.userData.eyes = group.getObjectByName('eyes') || null;
        group.userData.idlePhase = (rec.id * 1.73 + rec.gx * 0.07 + rec.gz * 0.11) % (Math.PI * 2);
      }
      return group;
    }

    function createPropGhost(id) {
      const template = getPropTemplate(id);
      const group = template.clone(true);
      group.position.set(0, 0, 0);
      group.rotation.set(0, 0, 0);
      group.traverse(function (o) {
        if (o.isMesh) {
          o.material = ghostGoodMat;
          o.castShadow = false;
          o.receiveShadow = false;
          o.userData.ghost = true;
        }
      });
      return group;
    }

    // ---------------------------------------------------------------- ghost + eraser

    const ghostBadMat = new THREE.MeshBasicMaterial({
      color: 0xe05a4d, transparent: true, opacity: 0.46, depthWrite: false
    });

      color: 0x164537, transparent: true, opacity: 0.55
    });

    const ghostGroup = new THREE.Group();
    ghostGroup.visible = false;
    scene.add(ghostGroup);
    const ghostMirror = new THREE.Group();
    ghostMirror.visible = false;
    scene.add(ghostMirror);

    const edgeGeoCache = new Map();
    function getGhostEdgeGeometry(id) {
      if (edgeGeoCache.has(id)) return edgeGeoCache.get(id);
      const geo = new THREE.EdgesGeometry(getBrickGeometry(id), 28);
      edgeGeoCache.set(id, geo);
      return geo;
    }

    function isPropCategory(cat) {
      return cat === 'person' || cat === 'animal' || cat === 'char' ||
        cat === 'road' || cat === 'vehicle' || cat === 'furniture' ||
        cat === 'traffic' || cat === 'build';
    }

    function currentPiece() {
      if (isPropCategory(state.category)) {
        const def = PROP_MAP[state.propType] || PROP_DEFS[0];
        return { kind: 'prop', id: def.id, def: def };
      }
      const def = TYPE_MAP[state.type] || BRICK_DEFS[0];
      return { kind: 'brick', id: def.id, def: def };
    }

    function clearGhostGroup(group) {
      while (group.children.length) group.remove(group.children[0]);
    }

    function rebuildGhost() {
      clearGhostGroup(ghostGroup);
      clearGhostGroup(ghostMirror);

      const piece = currentPiece();
      const content = new THREE.Group();

      if (piece.kind === 'brick') {
        const mesh = new THREE.Mesh(getBrickGeometry(piece.id), ghostGoodMat);
        mesh.userData.ghost = true;
        mesh.renderOrder = 4;
        content.add(mesh);
        const edges = new THREE.LineSegments(getGhostEdgeGeometry(piece.id), ghostEdgeMat);
        edges.renderOrder = 5;
        content.add(edges);
      } else {
        const pad = new THREE.Mesh(new THREE.PlaneGeometry(piece.def.w, piece.def.d), ghostGoodMat);
        pad.rotation.x = -Math.PI / 2;
        pad.position.y = 0.004;
        pad.renderOrder = 3;
        pad.userData.ghost = true;
        content.add(pad);

        const model = createPropGhost(piece.id);
        model.traverse(function (o) {
          if (o.isMesh) {
            o.userData.ghost = true;
            o.renderOrder = 4;
          }
        });
        content.add(model);
      }

      ghostGroup.add(content);
      ghostMirror.add(content.clone(true));
    }

    function setGhostGroupValidity(group, valid) {
      const mat = valid ? ghostGoodMat : ghostBadMat;
      group.traverse(function (o) {
        if (o.isMesh && o.userData.ghost) o.material = mat;
      });
    }

    const eraseBox = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({ color: 0xe05a4d, transparent: true, opacity: 0.26, depthWrite: false })
    );
    eraseBox.renderOrder = 4;
    eraseBox.visible = false;

    // ---------------------------------------------------------------- items & occupancy
    function itemDef(rec) {
      return rec.kind === 'prop' ? PROP_MAP[rec.propType] : TYPE_MAP[rec.type];
    }

    function itemDims(rec) {
      return effDims(itemDef(rec), rec.rot);
    }

    function propLayers(def) {
      return def && def.layers ? def.layers : 1;
    }

    function itemLayers(rec) {
      return rec.kind === 'prop' ? propLayers(itemDef(rec)) : 1;
    }

    function itemSupports(rec) {
      if (rec.kind === 'prop') {
        const def = PROP_MAP[rec.propType];
        return !!(def && def.support);
      }
      return rec.kind === 'brick' && TYPE_MAP[rec.type] && TYPE_MAP[rec.type].support !== false;
    }

    function effectiveSupportArea(def, rot) {
      const area = def && def.supportArea;
      if (!area) return null;
      const w = def.w;
      const d = def.d;
      const r = ((rot % 4) + 4) % 4;
      if (r === 0) return { x: area.x, z: area.z, w: area.w, d: area.d };
      if (r === 1) return { x: area.z, z: w - area.x - area.w, w: area.d, d: area.w };
      if (r === 2) return { x: w - area.x - area.w, z: d - area.z - area.d, w: area.w, d: area.d };
      return { x: d - area.z - area.d, z: area.x, w: area.d, d: area.w };
    }

    function itemSupportsCell(rec, x, z) {
      if (rec.kind === 'brick') {
        return !!(TYPE_MAP[rec.type] && TYPE_MAP[rec.type].support !== false);
      }
      if (rec.kind !== 'prop') return false;
      const def = PROP_MAP[rec.propType];
      if (!def || !def.support) return false;
      const area = effectiveSupportArea(def, rec.rot);
      if (!area) return true;
      return x >= rec.gx + area.x && x < rec.gx + area.x + area.w &&
        z >= rec.gz + area.z && z < rec.gz + area.z + area.d;
    }

    function registerOccupancy(rec) {
      const dims = itemDims(rec);
      const layers = itemLayers(rec);
      for (let l = 0; l < layers; l++) {
        for (let x = rec.gx; x < rec.gx + dims[0]; x++) {
          for (let z = rec.gz; z < rec.gz + dims[1]; z++) {
            state.occupancy.set(cellKey(x, z, rec.layer + l), rec);
          }
        }
      }
    }

    function unregisterOccupancy(rec) {
      const dims = itemDims(rec);
      const layers = itemLayers(rec);
      for (let l = 0; l < layers; l++) {
        for (let x = rec.gx; x < rec.gx + dims[0]; x++) {
          for (let z = rec.gz; z < rec.gz + dims[1]; z++) {
            const k = cellKey(x, z, rec.layer + l);
            if (state.occupancy.get(k) === rec) state.occupancy.delete(k);
          }
        }
      }
    }

    function addItem(data, animate) {
      const kind = data.kind || (data.propType ? 'prop' : 'brick');
      const def = kind === 'prop' ? PROP_MAP[data.propType] : TYPE_MAP[data.type];
      if (!def) return null;

      const rec = {
        id: state.nextId++,
        kind: kind,
        rot: ((data.rot | 0) % 4 + 4) % 4,
        gx: data.gx | 0,
        gz: data.gz | 0,
        layer: data.layer | 0,
        damaged: data.damaged || null,
        damageDir: data.damageDir === -1 ? -1 : 1
      };
      if (kind === 'prop') rec.propType = data.propType;
      else {
        rec.type = data.type;
        rec.color = normalizeColor(data.color || COLORS[0].hex);
      }

      const dims = effDims(def, rec.rot);
      const stackLayers = kind === 'prop' ? propLayers(def) : 1;
      if (rec.gx < 0 || rec.gz < 0 || rec.gx + dims[0] > SIZE || rec.gz + dims[1] > SIZE) return null;
      if (rec.layer < 0 || rec.layer + stackLayers - 1 > MAX_LAYER) return null;

      let object3d;
      if (kind === 'brick') {
        object3d = createBrickMesh(rec);
        state.bricks.push(rec);
        state.meshes.push(object3d);
      } else {
        object3d = createPropObject(rec);
        if (!object3d) return null;
        object3d.userData.record = rec;
        state.props.push(rec);
        object3d.userData.propMeshes.forEach(function (m) { state.meshes.push(m); });
      }

      scene.add(object3d);
      state.meshById.set(rec.id, object3d);
      registerOccupancy(rec);
      if (rec.damaged) applyDamageVisual(rec, object3d);

      if (animate) {
        const baseScale = object3d.scale.clone();
        object3d.scale.copy(baseScale).multiplyScalar(0.85);
        spawns.push({ mesh: object3d, baseScale: baseScale, start: performance.now() });
      }
      return rec;
    }

    function removeItem(rec) {
      if (rec.scorchMesh) {
        scene.remove(rec.scorchMesh);
        rec.scorchMesh.geometry.dispose();
        rec.scorchMesh.material.dispose();
        rec.scorchMesh = null;
      }
      const object3d = state.meshById.get(rec.id);
      if (object3d) {
        scene.remove(object3d);
        state.meshById.delete(rec.id);
        if (rec.kind === 'prop' && object3d.userData.propMeshes) {
          object3d.userData.propMeshes.forEach(function (m) {
            const idx = state.meshes.indexOf(m);
            if (idx >= 0) state.meshes.splice(idx, 1);
          });
        } else {
          const idx = state.meshes.indexOf(object3d);
          if (idx >= 0) state.meshes.splice(idx, 1);
        }
      }

      const arr = rec.kind === 'prop' ? state.props : state.bricks;
      const ai = arr.indexOf(rec);
      if (ai >= 0) arr.splice(ai, 1);
      unregisterOccupancy(rec);
    }

    function canPlace(kind, id, rot, gx, gz, layer) {
      const def = kind === 'prop' ? PROP_MAP[id] : TYPE_MAP[id];
      if (!def) return false;
      const dims = effDims(def, rot);
      const stackLayers = kind === 'prop' ? propLayers(def) : 1;
      if (gx < 0 || gz < 0 || gx + dims[0] > SIZE || gz + dims[1] > SIZE) return false;
      if (layer < 0 || layer + stackLayers - 1 > MAX_LAYER) return false;

      let hasSupport = layer === 0;
      let allCellsSupported = true;
      let strictBelow = null;
      for (let l = 0; l < stackLayers; l++) {
        for (let x = gx; x < gx + dims[0]; x++) {
          for (let z = gz; z < gz + dims[1]; z++) {
            if (state.occupancy.has(cellKey(x, z, layer + l))) return false;
            if (l === 0) {
              const below = state.occupancy.get(cellKey(x, z, layer - 1));
              if (below && itemSupportsCell(below, x, z)) {
                hasSupport = true;
                if (below.kind === 'prop') {
                  const belowDef = PROP_MAP[below.propType];
                  if (belowDef && belowDef.strictSupport) strictBelow = below;
                }
              } else {
                allCellsSupported = false;
              }
            }
          }
        }
      }
      if (!hasSupport) return false;
      if (strictBelow && !allCellsSupported) return false;
      return true;
    }

    function footprintsOverlap(gx1, gz1, gx2, gz2, ew, ed) {
      return gx1 < gx2 + ew && gx2 < gx1 + ew && gz1 < gz2 + ed && gz2 < gz1 + ed;
    }

    function updateCount() {
      countEl.textContent = String(state.bricks.length + state.props.length);
    }

    // ---------------------------------------------------------------- history
    function snapshot() {
      return {
        size: SIZE,
        bricks: state.bricks.map(function (b) {
          return {
            kind: 'brick', type: b.type, rot: b.rot, gx: b.gx, gz: b.gz,
            layer: b.layer, color: b.color,
            damaged: b.damaged || null, damageDir: b.damageDir || 1
          };
        }),
        props: state.props.map(function (p) {
          return {
            kind: 'prop', propType: p.propType, rot: p.rot, gx: p.gx, gz: p.gz,
            layer: p.layer, damaged: p.damaged || null, damageDir: p.damageDir || 1
          };
        })
      };
    }

    function updateHistoryUI() {
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
    }

    function pushHistory(before) {
      undoStack.push(JSON.stringify(before));
      if (undoStack.length > 60) undoStack.shift();
      redoStack.length = 0;
      updateHistoryUI();
    }

    function rebuildFrom(bricks, props, animate) {
      Array.from(state.meshById.values()).forEach(function (obj) { scene.remove(obj); });
      state.bricks.concat(state.props).forEach(function (rec) {
        if (rec.scorchMesh) {
          scene.remove(rec.scorchMesh);
          rec.scorchMesh.geometry.dispose();
          rec.scorchMesh.material.dispose();
          rec.scorchMesh = null;
        }
      });
      state.bricks = [];
      state.props = [];
      state.occupancy.clear();
      state.meshes = [];
      state.meshById.clear();
      state.nextId = 1;
      spawns = [];

      bricks.forEach(function (b) { addItem(b, !!animate); });
      props.forEach(function (p) { addItem(p, !!animate); });
      updateCount();
      updateHistoryUI();
    }

    function restoreSnapshot(snap) {
      if (!snap || !Array.isArray(snap.bricks)) return;
      const nextSize = clamp(Number(snap.size) || MIN_SIZE, MIN_SIZE, MAX_SIZE);
      const sizeChanged = nextSize !== SIZE;
      if (sizeChanged) {
        SIZE = nextSize;
        rebuildPlate();
        rebuildBlueprintMesh();
        layoutEnvironmentGrounds();
        cam.userZoomed = false;
        fitViewToPlate();
      } else {
        updatePlateSizeUI();
      }
      rebuildFrom(snap.bricks, Array.isArray(snap.props) ? snap.props : [], false);
      refreshAim();
    }

    function undo() {
      if (!undoStack.length) return;
      redoStack.push(JSON.stringify(snapshot()));
      const snap = JSON.parse(undoStack.pop());
      restoreSnapshot(snap);
      saveNow();
      playSound('tick');
      toast('已撤销');
    }

    function redo() {
      if (!redoStack.length) return;
      undoStack.push(JSON.stringify(snapshot()));
      const snap = JSON.parse(redoStack.pop());
      restoreSnapshot(snap);
      saveNow();
      playSound('tick');
      toast('已重做');
    }

    // ---------------------------------------------------------------- persistence
    function saveNow() {
      try {
        const snap = snapshot();
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          v: 2,
          size: snap.size,
          bricks: snap.bricks,
          props: snap.props,
          category: state.category,
          type: state.type,
          propType: state.propType,
          color: state.color,
          rot: state.rot,
          symmetry: state.symmetry,
          sound: state.sound,
          blueprint: state.blueprint,
          weather: state.weather,
          weatherAuto: state.weatherAuto,
          wetness: state.wetness,
          snowDepth: state.snowDepth,
          eventsAuto: state.eventsAuto,
          timeOfDay: state.timeOfDay,
          timeAuto: state.timeAuto
        }));
      } catch (err) { /* storage unavailable */ }
    }

    function scheduleSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 300);
    }

    // ---------------------------------------------------------------- sound
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(kind) {
      if (!state.sound) return;
      try {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (kind === 'place') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1150, t);
          osc.frequency.exponentialRampToValueAtTime(430, t + 0.055);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.085, t + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
          osc.start(t);
          osc.stop(t + 0.09);
        } else if (kind === 'erase') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(250, t);
          osc.frequency.exponentialRampToValueAtTime(110, t + 0.09);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.07, t + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.14);
        } else if (kind === 'error') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(170, t);
          osc.frequency.exponentialRampToValueAtTime(120, t + 0.07);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.035, t + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
          osc.start(t);
          osc.stop(t + 0.1);
        } else if (kind === 'tornado') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(82, t + 0.9);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.032, t + 0.16);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
          osc.start(t);
          osc.stop(t + 1.12);
        } else if (kind === 'quake') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(68, t);
          osc.frequency.exponentialRampToValueAtTime(42, t + 1.0);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.05, t + 0.12);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
          osc.start(t);
          osc.stop(t + 1.15);
        } else if (kind === 'wave') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(105, t);
          osc.frequency.exponentialRampToValueAtTime(62, t + 1.2);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.03, t + 0.2);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
          osc.start(t);
          osc.stop(t + 1.35);
        } else if (kind === 'thunder') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(38, t + 0.7);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.045, t + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.82);
          osc.start(t);
          osc.stop(t + 0.86);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(760, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.045, t + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          osc.start(t);
          osc.stop(t + 0.06);
        }
      } catch (err) { /* audio blocked */ }
    }

    // ---------------------------------------------------------------- aim & raycast
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    function setNdc(clientX, clientY) {
      const rect = canvasEl.getBoundingClientRect();
      ndc.set(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );
    }

    function raycastBuild(clientX, clientY) {
      camera.updateMatrixWorld();
      setNdc(clientX, clientY);
      raycaster.setFromCamera(ndc, camera);
      const targets = [platePick].concat(state.meshes);
      const hits = raycaster.intersectObjects(targets, false);
      return hits.length ? hits[0] : null;
    }

    function raycastBricks(clientX, clientY) {
      camera.updateMatrixWorld();
      setNdc(clientX, clientY);
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(state.meshes, false);
      return hits.length ? hits[0] : null;
    }

    function computeBuildAim(clientX, clientY) {
      const piece = currentPiece();
      const hit = raycastBuild(clientX, clientY);
      if (!hit) return null;

      let layer;
      let wx;
      let wz;
      let hitItem = null;
      let climbFrom = -1;
      let supportMiss = false;

      if (hit.object === platePick) {
        layer = 0;
        wx = hit.point.x;
        wz = hit.point.z;
      } else {
        const rec = hit.object.userData.record;
        if (!rec) return null;
        if (rec.kind === 'prop') {
          const propDef = PROP_MAP[rec.propType];
          if (!propDef || !propDef.support) return null;
        }
        hitItem = rec;

        const nLocal = hit.face ? hit.face.normal.clone() : new THREE.Vector3(0, 1, 0);
        const n = nLocal.transformDirection(hit.object.matrixWorld);
        const recDims = itemDims(rec);

        let cx = Math.floor((hit.point.x + SIZE / 2) / CELL);
        let cz = Math.floor((hit.point.z + SIZE / 2) / CELL);
        cx = clamp(cx, rec.gx, rec.gx + recDims[0] - 1);
        cz = clamp(cz, rec.gz, rec.gz + recDims[1] - 1);

        if (rec.kind === 'prop') {
          const supportDef = PROP_MAP[rec.propType];
          const supportArea = effectiveSupportArea(supportDef, rec.rot);
          if (supportArea && !(cx >= rec.gx + supportArea.x && cx < rec.gx + supportArea.x + supportArea.w &&
              cz >= rec.gz + supportArea.z && cz < rec.gz + supportArea.z + supportArea.d)) {
            supportMiss = true;
          }
          layer = rec.layer + propLayers(supportDef);
        } else if (n.y < -0.4) {
          layer = rec.layer - 1;
        } else {
          layer = rec.layer + 1;
          if (piece.kind === 'brick') climbFrom = layer;
        }
        wx = -SIZE / 2 + (cx + 0.5) * CELL;
        wz = -SIZE / 2 + (cz + 0.5) * CELL;
      }

      const dims = effDims(piece.def, state.rot);
      const fx = (wx + SIZE / 2) / CELL;
      const fz = (wz + SIZE / 2) / CELL;
      let gx = Math.round(fx - dims[0] / 2);
      let gz = Math.round(fz - dims[1] / 2);
      gx = clamp(gx, 0, SIZE - dims[0]);
      gz = clamp(gz, 0, SIZE - dims[1]);

      if (hitItem && hitItem.kind === 'prop') {
        const supportDef = PROP_MAP[hitItem.propType];
        if (supportDef && supportDef.support) {
          const area = effectiveSupportArea(supportDef, hitItem.rot);
          const supportDims = itemDims(hitItem);
          const zoneX = hitItem.gx + (area ? area.x : 0);
          const zoneZ = hitItem.gz + (area ? area.z : 0);
          const zoneW = area ? area.w : supportDims[0];
          const zoneD = area ? area.d : supportDims[1];
          if (dims[0] <= zoneW && dims[1] <= zoneD) {
            gx = clamp(gx, zoneX, zoneX + zoneW - dims[0]);
            gz = clamp(gz, zoneZ, zoneZ + zoneD - dims[1]);
          }
        }
      }

      let valid = canPlace(piece.kind, piece.id, state.rot, gx, gz, layer);
      if (!valid && climbFrom >= 0 && !supportMiss) {
        for (let l = climbFrom + 1; l <= MAX_LAYER; l++) {
          if (canPlace(piece.kind, piece.id, state.rot, gx, gz, l)) {
            layer = l;
            valid = true;
            break;
          }
        }
      }
      if (supportMiss) valid = false;

      const mirrorGx = SIZE - gx - dims[0];
      const mirrorAvailable = state.symmetry && mirrorGx !== gx &&
        !footprintsOverlap(gx, gz, mirrorGx, gz, dims[0], dims[1]);
      const mirrorValid = !supportMiss && mirrorAvailable && canPlace(piece.kind, piece.id, state.rot, mirrorGx, gz, layer);

      return {
        gx: gx,
        gz: gz,
        layer: layer,
        valid: valid,
        mirrorGx: mirrorGx,
        mirrorAvailable: mirrorAvailable,
        mirrorValid: mirrorValid,
        hitItem: hitItem,
        supportMiss: supportMiss
      };
    }

    function positionGhost(group, gx, gz, layer) {
      const piece = currentPiece();
      const dims = effDims(piece.def, state.rot);
      group.position.set(
        worldX(gx, dims[0]),
        layer * LAYER + 0.006,
        worldZ(gz, dims[1])
      );
      group.rotation.y = state.rot * Math.PI / 2;
    }

    function hideGhosts() {
      ghostGroup.visible = false;
      ghostMirror.visible = false;
      eraseBox.visible = false;
    }

    function setGhostGroupValidity(group, valid) {
      const mat = valid ? ghostGoodMat : ghostBadMat;
      group.traverse(function (o) {
        if (o.isMesh && o.userData.ghost) o.material = mat;
      });
    }

    function renderAim() {
      if (!currentAim) {
        hideGhosts();
        return;
      }
      const aim = currentAim;

      if (state.tool === 'erase') {
        ghostGroup.visible = false;
        ghostMirror.visible = false;
        const rec = aim.hitItem;
        if (rec) {
          const def = itemDef(rec);
          const dims = effDims(def, rec.rot);
          const h = rec.kind === 'prop' ? (PROP_MAP[rec.propType].height || 1) : BODY;
          eraseBox.position.set(
            worldX(rec.gx, dims[0]),
            rec.layer * LAYER + h / 2,
            worldZ(rec.gz, dims[1])
          );
          eraseBox.scale.set(dims[0] * 0.99, h * 1.04, dims[1] * 0.99);
          eraseBox.visible = true;
        } else {
          eraseBox.visible = false;
        }
        return;
      }

      eraseBox.visible = false;
      if (aim.layer < 0) {
        ghostGroup.visible = false;
        ghostMirror.visible = false;
        return;
      }

      setGhostGroupValidity(ghostGroup, aim.valid);
      positionGhost(ghostGroup, aim.gx, aim.gz, aim.layer);
      ghostGroup.visible = true;

      if (aim.mirrorAvailable) {
        setGhostGroupValidity(ghostMirror, aim.mirrorValid);
        positionGhost(ghostMirror, aim.mirrorGx, aim.gz, aim.layer);
        ghostMirror.visible = true;
      } else {
        ghostMirror.visible = false;
      }
    }

    function updateAim(clientX, clientY) {
      lastPointer = { x: clientX, y: clientY, type: 'mouse', active: true };

      if (state.tool === 'erase') {
        const hit = raycastBricks(clientX, clientY);
        currentAim = hit ? { hitItem: hit.object.userData.record } : null;
        renderAim();
        return;
      }

      currentAim = computeBuildAim(clientX, clientY);
      renderAim();
    }

    function refreshAim() {
      if (lastPointer && lastPointer.active && lastPointer.type === 'mouse') {
        updateAim(lastPointer.x, lastPointer.y);
      } else {
        hideGhosts();
      }
    }

    // ---------------------------------------------------------------- actions
    function hideIntro() {
      introEl.classList.add('is-hidden');
    }

    function placeAt(clientX, clientY) {
      const aim = computeBuildAim(clientX, clientY);
      currentAim = aim;
      renderAim();

      if (!aim || !aim.valid) {
        if (aim) {
          playSound('error');
          if (aim.supportMiss) toast('车头不能放东西');
        }
        return;
      }

      const piece = currentPiece();
      const before = snapshot();

      function payload(gx) {
        if (piece.kind === 'prop') {
          return { kind: 'prop', propType: piece.id, rot: state.rot, gx: gx, gz: aim.gz, layer: aim.layer };
        }
        return { kind: 'brick', type: piece.id, rot: state.rot, gx: gx, gz: aim.gz, layer: aim.layer, color: state.color };
      }

      addItem(payload(aim.gx), true);
      if (aim.mirrorAvailable && aim.mirrorValid) {
        addItem(payload(aim.mirrorGx), true);
      }

      pushHistory(before);
      updateCount();
      scheduleSave();
      playSound('place');
      hideIntro();

      if (lastPointer && lastPointer.type === 'mouse') {
        updateAim(clientX, clientY);
      } else {
        hideGhosts();
      }
    }

    function deleteAt(clientX, clientY) {
      const hit = raycastBricks(clientX, clientY);
      if (!hit) return;

      const rec = hit.object.userData.record;
      if (!rec) return;

      const before = snapshot();
      removeItem(rec);

      if (state.symmetry) {
        const dims = itemDims(rec);
        const mirrorGx = SIZE - rec.gx - dims[0];
        if (mirrorGx !== rec.gx) {
          const twin = state.occupancy.get(cellKey(mirrorGx, rec.gz, rec.layer));
          if (twin && twin !== rec) removeItem(twin);
        }
      }

      pushHistory(before);
      updateCount();
      scheduleSave();
      playSound('erase');
      hideIntro();

      if (lastPointer && lastPointer.type === 'mouse') {
        updateAim(clientX, clientY);
      } else {
        hideGhosts();
      }
    }

    function setTool(tool) {
      state.tool = tool;
      buildToolBtn.classList.toggle('is-active', tool === 'build');
      eraseToolBtn.classList.toggle('is-active', tool === 'erase');
      stageEl.classList.toggle('is-erasing', tool === 'erase');
      hideGhosts();
      currentAim = null;
      refreshAim();
      scheduleSave();
    }

    function rotate() {
      state.rot = (state.rot + 1) % 4;
      playSound('tick');
      refreshAim();
      scheduleSave();
    }

    function toggleSymmetry() {
      state.symmetry = !state.symmetry;
      symBtn.classList.toggle('is-active', state.symmetry);
      if (symmetryLine) symmetryLine.visible = state.symmetry;
      refreshAim();
      scheduleSave();
      toast(state.symmetry ? '对称模式开启 · 左右同时放砖' : '对称模式关闭');
    }

    function extendPlate() {
      if (SIZE >= MAX_SIZE) {
        toast('底板已经是最大尺寸了');
        return;
      }

      const before = snapshot();
      const delta = GROW_STEP / 2;
      SIZE = Math.min(MAX_SIZE, SIZE + GROW_STEP);

      state.bricks.forEach(function (b) {
        b.gx += delta;
        b.gz += delta;
      });
      state.props.forEach(function (p) {
        p.gx += delta;
        p.gz += delta;
      });

      state.occupancy.clear();
      state.bricks.forEach(registerOccupancy);
      state.props.forEach(registerOccupancy);

      state.bricks.forEach(function (b) {
        const dims = itemDims(b);
        const obj = state.meshById.get(b.id);
        if (obj) obj.position.set(worldX(b.gx, dims[0]), b.layer * LAYER, worldZ(b.gz, dims[1]));
      });
      state.props.forEach(function (p) {
        const dims = itemDims(p);
        const obj = state.meshById.get(p.id);
        if (obj) obj.position.set(worldX(p.gx, dims[0]), p.layer * LAYER, worldZ(p.gz, dims[1]));
      });

      rebuildPlate();
      rebuildBlueprintMesh();
      layoutEnvironmentGrounds();
      cam.userZoomed = false;
      fitViewToPlate();
      hideGhosts();
      currentAim = null;

      pushHistory(before);
      updateCount();
      saveNow();
      playSound('place');
      toast('底板扩展到 ' + SIZE + ' × ' + SIZE);
    }

    function toggleBlueprint() {
      state.blueprint = !state.blueprint;
      blueprintBtn.classList.toggle('is-active', state.blueprint);
      if (blueprintMesh) {
        blueprintMesh.visible = state.blueprint;
        if (state.blueprint) hideIntro();
      }
      scheduleSave();
      if (state.blueprint) toast('城堡蓝图已铺开 · 照着轮廓填砖');
    }

    function toggleSound() {
      state.sound = !state.sound;
      updateSoundUI();
      scheduleSave();
      if (state.sound) playSound('tick');
    }

    function updateSoundUI() {
      soundBtn.classList.toggle('is-muted', !state.sound);
      soundBtn.title = state.sound ? '关闭声音' : '开启声音';
      soundBtn.setAttribute('aria-label', state.sound ? '关闭声音' : '开启声音');
    }

    // ---------------------------------------------------------------- blueprint
    let blueprintMesh = null;

    function rebuildBlueprintMesh() {
      if (blueprintMesh) {
        scene.remove(blueprintMesh);
        blueprintMesh.geometry.dispose();
        blueprintMesh.material.dispose();
        blueprintMesh = null;
      }

      const cells = new Set();
      const key = function (x, z, y) { return x + ',' + z + ',' + y; };
      const add = function (x, z, y) {
        if (x >= 0 && x < SIZE && z >= 0 && z < SIZE && y >= 0 && y < MAX_LAYER) {
          cells.add(key(x, z, y));
        }
      };
      const box = function (x0, z0, w, d, y0, h) {
        for (let y = y0; y < y0 + h; y++) {
          for (let x = x0; x < x0 + w; x++) {
            for (let z = z0; z < z0 + d; z++) add(x, z, y);
          }
        }
      };

      const BP_W = 22;
      const BP_D = 18;
      const X0 = Math.round((SIZE - BP_W) / 2);
      const Z0 = Math.round((SIZE - BP_D) / 2);
      const X1 = X0 + BP_W - 1;
      const Z1 = Z0 + BP_D - 1;
      const WALL_H = 6;
      const GATE_X0 = X0 + 9;
      const GATE_X1 = X0 + 11;

      for (let y = 0; y < WALL_H; y++) {
        for (let x = X0; x <= X1; x++) {
          add(x, Z0, y);
          add(x, Z1, y);
        }
        for (let z = Z0; z <= Z1; z++) {
          add(X0, z, y);
          add(X1, z, y);
        }
      }

      for (let x = GATE_X0; x <= GATE_X1; x++) {
        for (let y = 0; y < 4; y++) cells.delete(key(x, Z0, y));
      }

      const towers = [[X0, Z0], [X1 - 2, Z0], [X0, Z1 - 2], [X1 - 2, Z1 - 2]];
      towers.forEach(function (t) {
        const tx = t[0];
        const tz = t[1];
        box(tx, tz, 3, 3, 0, 10);
        for (let dx = 0; dx < 3; dx++) {
          for (let dz = 0; dz < 3; dz++) {
            if (dx === 0 || dx === 2 || dz === 0 || dz === 2) {
              if ((dx + dz) % 2 === 0) add(tx + dx, tz + dz, 10);
            }
          }
        }
      });

      for (let x = X0 + 1; x < X1; x += 2) {
        if (x < GATE_X0 - 1 || x > GATE_X1 + 1) {
          add(x, Z0, WALL_H);
          add(x, Z1, WALL_H);
        }
      }
      for (let z = Z0 + 1; z < Z1; z += 2) {
        add(X0, z, WALL_H);
        add(X1, z, WALL_H);
      }

      const KX = X0 + 8;
      const KZ = Z0 + 8;
      box(KX, KZ, 6, 6, 0, 8);
      box(KX + 1, KZ + 1, 4, 4, 8, 2);
      for (let x = KX + 1; x <= KX + 4; x++) {
        for (let z = KZ + 1; z <= KZ + 4; z++) {
          if (x === KX + 1 || x === KX + 4 || z === KZ + 1 || z === KZ + 4) {
            if ((x + z) % 2 === 0) add(x, z, 10);
          }
        }
      }

      const geo = new THREE.BoxGeometry(0.92, LAYER * 0.52, 0.92);
      const parts = [];
      cells.forEach(function (k) {
        const p = k.split(',');
        const g = geo.clone();
        g.translate(
          -SIZE / 2 + Number(p[0]) + 0.5,
          Number(p[2]) * LAYER + LAYER / 2,
          -SIZE / 2 + Number(p[1]) + 0.5
        );
        parts.push(g);
      });
      geo.dispose();
      const merged = mergeGeometries(parts);
      parts.forEach(function (g) { g.dispose(); });
      const mat = new THREE.MeshBasicMaterial({
        color: 0xb6a7d8,
        transparent: true,
        opacity: 0.15,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      blueprintMesh = new THREE.Mesh(merged, mat);
      blueprintMesh.renderOrder = 2;
      blueprintMesh.visible = state.blueprint;
      blueprintMesh.raycast = function () {};
      scene.add(blueprintMesh);

        const r = Math.min(innerW, innerH) / 2 - 1;
        const cx = pad + innerW / 2;
        const cy = pad + innerH / 2;
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + (W * scale) + '" height="' + (H * scale) +

      }

      if (def.icon === 'floor') {
        let grid = '';
        for (let i = 2; i < def.w; i += 2) {
          grid += '<path d="M ' + (pad + i * u) + ' ' + pad + ' V ' + (pad + innerH) +
            '" stroke="currentColor" stroke-opacity=".16" stroke-width="1"/>';

        for (let i = 0; i < def.w; i++) {
          studs += '<circle cx="' + (pad + (i + 0.5) * u) + '" cy="' + backY +
            '" r="' + (u * 0.22) + '" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".38" stroke-width="1"/>';
        }
      } else {
        for (let i = 0; i < def.w; i++) {
          for (let j = 0; j < def.d; j++) {
            studs += '<circle cx="' + (pad + (i + 0.5) * u) + '" cy="' + (pad + (j + 0.5) * u) +
              '" r="' + (u * 0.24) + '" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".38" stroke-width="1"/>';

      return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + (W * scale) + '" height="' + (H * scale) +

    function activeDefsForCategory(cat) {
      if (isPropCategory(cat)) return PROP_DEFS.filter(function (d) { return d.cat === cat; });
      return BRICK_DEFS.filter(function (d) { return d.cat === cat; });
    }

    function ensureCategoryPick(cat) {
      if (isPropCategory(cat)) {
        const current = PROP_MAP[state.propType];
        if (!current || current.cat !== cat) {
          const fallback = PROP_MAP[lastPicks[cat]] && PROP_MAP[lastPicks[cat]].cat === cat
            ? lastPicks[cat]
            : (activeDefsForCategory(cat)[0] || PROP_DEFS[0]).id;
          state.propType = fallback;
        }
      } else {
        const current = TYPE_MAP[state.type];
        if (!current || current.cat !== cat) {
          const fallback = TYPE_MAP[lastPicks[cat]] && TYPE_MAP[lastPicks[cat]].cat === cat
            ? lastPicks[cat]
            : (activeDefsForCategory(cat)[0] || BRICK_DEFS[0]).id;
          state.type = fallback;
        }
      }
    }

    function isActivePiece(def, isProp) {
      return isProp ? state.propType === def.id : state.type === def.id;
    }

    function renderPieceList() {
      const cat = state.category;
      const isProp = isPropCategory(cat);
      const defs = activeDefsForCategory(cat);
      brickListEl.innerHTML = '';

      defs.forEach(function (def) {
        const btn = document.createElement('button');
        const active = isActivePiece(def, isProp);
        btn.className = 'brick-chip' + (isProp ? ' brick-chip--prop' : (cat === 'large' ? ' brick-chip--labeled' : '')) + (active ? ' is-active' : '');
        btn.dataset.type = def.id;
        btn.title = def.name;
        btn.setAttribute('aria-label', def.name);
        if (isProp) {
          btn.innerHTML = propIcon(def.id) + '<span>' + def.name + '</span>';
        } else if (cat === 'large') {
          btn.innerHTML = brickIcon(def) + '<span>' + (def.label || def.name) + '</span>';
        } else {
          btn.innerHTML = brickIcon(def);
        }
        btn.addEventListener('click', function () {
          if (isProp) {
            state.propType = def.id;
            lastPicks[cat] = def.id;
          } else {
            state.type = def.id;
            lastPicks[cat] = def.id;
          }
          brickListEl.querySelectorAll('.brick-chip').forEach(function (el) {
            el.classList.toggle('is-active', el.dataset.type === def.id);
          });
          rebuildGhost();
          currentAim = null;
          refreshAim();
          scheduleSave();
        });
        brickListEl.appendChild(btn);
      });

      requestAnimationFrame(function () {
        const active = brickListEl.querySelector('.brick-chip.is-active');
        if (!active) return;
        const listRect = brickListEl.getBoundingClientRect();
        const itemRect = active.getBoundingClientRect();
        if (itemRect.right > listRect.right) {
          brickListEl.scrollLeft += itemRect.right - listRect.right + 6;
        } else if (itemRect.left < listRect.left) {
          brickListEl.scrollLeft -= listRect.left - itemRect.left + 6;
        }
      });
    }

      const cat = state.category;
      ensureCategoryPick(cat);
      catTabsEl.querySelectorAll('.cat-tab').forEach(function (el) {
        el.classList.toggle('is-active', el.dataset.cat === cat);
      });
      const fixed = isPropCategory(cat);
      colorGroupEl.classList.toggle('is-fixed', fixed);
      colorLabelEl.textContent = fixed ? '颜色 · 固定' : '颜色';
      renderPieceList();
    }

      if (!CATEGORIES.some(function (c) { return c.id === cat; })) return;
      if (state.category === cat) return;
      state.category = cat;

      updateCategoryUI();
      rebuildGhost();
      currentAim = null;

    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && envPanelEl && !envPanelEl.hidden) setEnvPanel(false);
    });
    clearBtn.addEventListener('click', requestClear);
    extendBtn.addEventListener('click', extendPlate);

    updateCategoryUI();

    // ---------------------------------------------------------------- toast / modal / export
    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('is-show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.classList.remove('is-show');
      }, 2200);
    }

    function requestClear() {
      if (state.bricks.length === 0 && state.props.length === 0) {
        toast('底板已经是空的');
        return;
      }
      modalTitleEl.textContent = '确定清空底板吗？';
      modalBodyEl.textContent = '所有砖块、角色和车辆都会被移除，不过还可以用撤销把它们找回来。';
      modalConfirmEl.textContent = '清空';
      pendingModalAction = function () {
        const before = snapshot();
        rebuildFrom([], [], false);
        pushHistory(before);
        updateCount();
        saveNow();
        hideIntro();
        playSound('erase');
        toast('底板已清空');
      };
      modalEl.hidden = false;
    }

    function closeModal() {
      modalEl.hidden = true;
      pendingModalAction = null;
    }

    modalCancelEl.addEventListener('click', closeModal);
    modalConfirmEl.addEventListener('click', function () {
      const action = pendingModalAction;
      closeModal();
      if (action) action();
    });
    modalEl.addEventListener('pointerdown', function (e) {
      if (e.target === modalEl) closeModal();
    });

    function exportPNG() {
      try {
        renderer.render(scene, camera);
        const source = renderer.domElement;
        const out = document.createElement('canvas');
        out.width = source.width;
        out.height = source.height;
        const ctx = out.getContext('2d');
        const w = out.width;
        const h = out.height;

        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#cfe2ee');
        sky.addColorStop(0.44, '#dfe9ec');
        sky.addColorStop(1, '#f4ebdd');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(w * 0.74, h * 0.1, 0, w * 0.74, h * 0.1, w * 0.6);
        glow.addColorStop(0, 'rgba(255,250,235,.9)');
        glow.addColorStop(1, 'rgba(255,250,235,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        ctx.drawImage(source, 0, 0);

        const link = document.createElement('a');
        const stamp = new Date().toISOString().slice(0, 10);
        link.download = 'brick-studio-' + stamp + '.png';
        link.href = out.toDataURL('image/png');
        link.click();
        toast('截图已导出');
        playSound('tick');
      } catch (err) {
        toast('截图导出失败');
      }
    }

    // ---------------------------------------------------------------- pointer controls
    const pointers = new Map();
    let drag = null;
    let pinch = null;

    function pointerMid() {
      const arr = Array.from(pointers.values());
      return {
        x: (arr[0].x + arr[1].x) / 2,
        y: (arr[0].y + arr[1].y) / 2
      };
    }

    function pointerDistance() {
      const arr = Array.from(pointers.values());
      const dx = arr[0].x - arr[1].x;
      const dy = arr[0].y - arr[1].y;
      return Math.hypot(dx, dy);
    }

    function panCamera(dx, dy) {
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 0.0001) forward.set(0, 0, -1);
      forward.normalize();

      const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
      const scale = cam.radius * 0.0015;

      const panLimit = SIZE * 0.72;
      cam.target.addScaledVector(right, -dx * scale);
      cam.target.addScaledVector(forward, dy * scale);
      cam.target.x = clamp(cam.target.x, -panLimit, panLimit);
      cam.target.z = clamp(cam.target.z, -panLimit, panLimit);
      cam.target.y = clamp(cam.target.y, 0, 14);
      applyCamera();
    }

    function onPointerDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 1 && e.button !== 2) return;
      if (e.target !== canvasEl) return;

      e.preventDefault();
      try { canvasEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        const mode = (e.button === 2 || e.button === 1 || e.shiftKey) ? 'pan' : 'rotate';
        drag = {
          mode: mode,
          startX: e.clientX,
          startY: e.clientY,
          lastX: e.clientX,
          lastY: e.clientY,
          moved: false,
          button: e.button,
          pointerId: e.pointerId
        };
        stageEl.classList.add(mode === 'pan' ? 'is-panning' : 'is-rotating');
        hideGhosts();
      } else if (pointers.size === 2) {
        drag = null;
        stageEl.classList.remove('is-rotating', 'is-panning');
        pinch = {
          startDist: pointerDistance(),
          startRadius: cam.radius,
          lastMid: pointerMid()
        };
        hideGhosts();
      }
    }

    function onPointerMove(e) {
      if (pointers.has(e.pointerId)) {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }

      if (pointers.size >= 2 && pinch) {
        const d = Math.max(pointerDistance(), 1);
        cam.userZoomed = true;
        cam.radius = clamp(pinch.startRadius * pinch.startDist / d, 18, 200);
        const mid = pointerMid();
        panCamera(mid.x - pinch.lastMid.x, mid.y - pinch.lastMid.y);
        pinch.lastMid = mid;
        applyCamera();
        hideGhosts();
        return;
      }

      if (drag) {
        const dx = e.clientX - drag.lastX;
        const dy = e.clientY - drag.lastY;

        if (!drag.moved &&
            Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 4) {
          drag.moved = true;
          hideGhosts();
        }

        if (drag.moved) {
          if (drag.mode === 'rotate') {
            cam.theta -= dx * 0.0055;
            cam.phi = clamp(cam.phi - dy * 0.0045, 0.22, 1.32);
          } else {
            panCamera(dx, dy);
          }
          applyCamera();
        }

        drag.lastX = e.clientX;
        drag.lastY = e.clientY;
        return;
      }

      if (e.pointerType === 'mouse') {
        updateAim(e.clientX, e.clientY);
      }
    }

    function endDrag(e, cancelled) {
      const wasDrag = drag && drag.pointerId === e.pointerId ? drag : null;

      pointers.delete(e.pointerId);
      if (pinch && pointers.size < 2) pinch = null;

      if (wasDrag) {
        drag = null;
        stageEl.classList.remove('is-rotating', 'is-panning');

        if (!cancelled && !wasDrag.moved) {
          lastPointer = { x: e.clientX, y: e.clientY, type: e.pointerType, active: e.pointerType === 'mouse' };
          if (wasDrag.button === 2) {
            deleteAt(e.clientX, e.clientY);
          } else if (wasDrag.button === 0) {
            if (state.tool === 'erase') deleteAt(e.clientX, e.clientY);
            else placeAt(e.clientX, e.clientY);
          }
        } else if (!cancelled && e.pointerType === 'mouse') {
          updateAim(e.clientX, e.clientY);
        }
      }

      if (pointers.size === 0) {
        drag = null;
        pinch = null;
        stageEl.classList.remove('is-rotating', 'is-panning');
      }
    }

    function onPointerUp(e) {
      endDrag(e, false);
    }

    function onPointerCancel(e) {
      endDrag(e, true);
    }

    canvasEl.addEventListener('pointerdown', onPointerDown);
    canvasEl.addEventListener('pointermove', onPointerMove);
    canvasEl.addEventListener('pointerup', onPointerUp);
    canvasEl.addEventListener('pointercancel', onPointerCancel);
    canvasEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    canvasEl.addEventListener('pointerleave', function (e) {
      if (e.pointerType === 'mouse' && !drag) {
        if (lastPointer) lastPointer.active = false;
        hideGhosts();
        currentAim = null;
      }
    });

    canvasEl.addEventListener('wheel', function (e) {
      e.preventDefault();
      cam.userZoomed = true;
      cam.radius = clamp(cam.radius * Math.exp(e.deltaY * 0.0011), 18, 200);
      applyCamera();
      if (lastPointer && lastPointer.active && lastPointer.type === 'mouse' && !drag) {
        updateAim(lastPointer.x, lastPointer.y);
      } else {
        hideGhosts();
      }
    }, { passive: false });

    // ---------------------------------------------------------------- keyboard
    window.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') {
          e.preventDefault();
          if (e.shiftKey) redo(); else undo();
        } else if (k === 'y') {
          e.preventDefault();
          redo();
        }
        return;
      }

      if (e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === 'r') {
        e.preventDefault();
        rotate();
      } else if (key === 'b') {
        setTool('build');
      } else if (key === 'e') {
        setTool('erase');
      } else if (key === 'm') {
        toggleSymmetry();
      } else if (key === 'escape') {
        closeModal();
      }
    });

    // ---------------------------------------------------------------- resize
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (cam.userZoomed) applyCamera();
      else fitViewToPlate();
      refreshAim();
    });

    window.addEventListener('pagehide', function () { saveNow(); });

    // ---------------------------------------------------------------- load save
    (function boot() {
      let data = null;
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) data = JSON.parse(raw);
      } catch (err) { data = null; }

      if (data) {
        if (data.size === 48 || data.size === 56) {
          SIZE = data.size;
          rebuildPlate();
          rebuildBlueprintMesh();
        }
        let savedCategory = data.category;
        if (savedCategory === 'char') {
          const savedProp = PROP_MAP[data.propType];
          savedCategory = savedProp && savedProp.cat === 'animal' ? 'animal' : 'person';
        } else if (savedCategory === 'traffic') {
          const savedProp = PROP_MAP[data.propType];
          savedCategory = savedProp && savedProp.cat === 'road' ? 'road' : 'vehicle';
        }
        if (CATEGORIES.some(function (c) { return c.id === savedCategory; })) {
          state.category = savedCategory;
        }
        if (TYPE_MAP[data.type]) state.type = data.type;
        if (PROP_MAP[data.propType]) state.propType = data.propType;
        if (typeof data.color === 'string') state.color = normalizeColor(data.color);
        if (typeof data.rot === 'number') state.rot = ((data.rot % 4) + 4) % 4;
        state.symmetry = !!data.symmetry;
        state.sound = data.sound !== false;
        state.blueprint = !!data.blueprint;
        if (WEATHER_MODES.indexOf(data.weather) !== -1) state.weather = data.weather;
        state.weatherAuto = !!data.weatherAuto;
        if (typeof data.wetness === 'number') state.wetness = clamp(data.wetness, 0, 1);
        if (typeof data.snowDepth === 'number') state.snowDepth = clamp(data.snowDepth, 0, 1);
        state.eventsAuto = data.eventsAuto !== false;
        if (TIME_MODES.indexOf(data.timeOfDay) !== -1) state.timeOfDay = data.timeOfDay;
        state.timeAuto = !!data.timeAuto;

        lastPicks[state.category] = isPropCategory(state.category) ? state.propType : state.type;
        rebuildFrom(
          Array.isArray(data.bricks) ? data.bricks : [],
          Array.isArray(data.props) ? data.props : [],
          false
        );
      }

      ensureCategoryPick(state.category);
      updateCategoryUI();
      rebuildGhost();

      colorListEl.querySelectorAll('.color-dot').forEach(function (el) {
        el.classList.toggle('is-active', el.dataset.color === state.color);
      });

      symBtn.classList.toggle('is-active', state.symmetry);
      if (symmetryLine) symmetryLine.visible = state.symmetry;
      blueprintBtn.classList.toggle('is-active', state.blueprint);
      if (blueprintMesh) blueprintMesh.visible = state.blueprint;

      updateSoundUI();
      updateCount();
      updateHistoryUI();
      updatePlateSizeUI();
      fitViewToPlate();
      applyEnvironment();
      if (state.weatherAuto) startWeatherAuto();
      if (state.timeAuto) startTimeAuto();
      wetToastShown = state.wetness > 0.4;
      snowToastShown = state.snowDepth > 0.3;
      if (state.eventsAuto) scheduleRandomEvent();
      updateWeatherUI();

      if (state.bricks.length + state.props.length === 0 && !state.blueprint) {
        setTimeout(function () { introEl.classList.remove('is-hidden'); }, 500);
      }

      if (data) saveNow();
    })();

    // ---------------------------------------------------------------- loop
    function animateSpawns(now) {
      if (!spawns.length) return;
      const alive = [];
      for (let i = 0; i < spawns.length; i++) {
        const item = spawns[i];
        if (!item.mesh.parent) continue;
        const t = clamp((now - item.start) / 180, 0, 1);
        const c1 = 1.70158;
        const c3 = c1 + 1;
        const tt = t - 1;
        const eased = 1 + c3 * tt * tt * tt + c1 * tt * tt;
        const s = 0.85 + 0.15 * eased;
        item.mesh.scale.copy(item.baseScale).multiplyScalar(s);
        if (t < 1) {
          alive.push(item);
        } else {
          item.mesh.scale.copy(item.baseScale);
        }
      }
      spawns = alive;
    }

    function updateCharacterIdle(now) {
      for (let i = 0; i < state.props.length; i++) {
        const p = state.props[i];
        const def = PROP_MAP[p.propType];
        if (!def || (def.cat !== 'person' && def.cat !== 'animal' && def.cat !== 'char')) continue;
        if (p.damaged) continue;
        if (tornado.active && tornado.captured.has(p.id)) continue;
        const g = state.meshById.get(p.id);
        if (!g) continue;
        const phase = g.userData.idlePhase || 0;
        const base = def.scale || 1;
        const breathe = 1 + Math.sin(now * 0.0014 + phase) * 0.008;
        g.scale.setScalar(base * breathe);
        g.rotation.y = p.rot * Math.PI / 2 + Math.sin(now * 0.0009 + phase) * 0.018;
        g.position.y = p.layer * LAYER + Math.sin(now * 0.0017 + phase * 1.3) * 0.006;
        const eyes = g.userData.eyes;
        if (eyes) {
          const t = (now * 0.001 + phase * 2.7) % 4.8;
          let k = 1;
          if (t < 0.07) k = 0.14;
          else if (t < 0.14) k = 0.14 + (t - 0.07) * 12.3;
          eyes.scale.y = k;
        }
      }
    }

    function frame(now) {
      requestAnimationFrame(frame);
      animateSpawns(now);
      updateCharacterIdle(now);
      updateWeather(now);
      updateTornado(now);
      updateQuake(now);
      updateTsunami(now);
      updateWeatherLightning(now);
      updateBackdrop(now);
      updateFx(now);

      if (blueprintMesh && blueprintMesh.visible) {
        blueprintMesh.material.opacity = 0.13 + Math.sin(now * 0.0016) * 0.025;
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
