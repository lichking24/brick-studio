<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>砖块工坊 · Brick Studio</title>
<meta name="description" content="砖块工坊：在马卡龙色的 3D 世界里自由拼搭积木、角色、建筑与城市交通。" />
<meta name="theme-color" content="#f7eef4" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d98ca1'/%3E%3Crect x='6' y='14' width='20' height='10' rx='2' fill='white'/%3E%3Crect x='8' y='10' width='4' height='6' rx='1.5' fill='white'/%3E%3Crect x='14' y='10' width='4' height='6' rx='1.5' fill='white'/%3E%3Crect x='20' y='10' width='4' height='6' rx='1.5' fill='white'/%3E%3C/svg%3E" />
<style>
  :root {
    --site-bg: #f7eef4;
    --site-fg: #5a4a55;
    --site-accent: #d98ca1;
    --site-on-accent: #fffaf8;
    --site-surface: #fdfaf7;
    --site-muted: #9a8e97;
    --site-border: rgba(90, 74, 85, .12);
    --site-font: "Avenir Next", -apple-system, BlinkMacSystemFont, "SF Pro Display",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --site-radius: 12px;
    --site-space: 1;
    --site-type: 1;
    --site-motion: 1;

    --ink: var(--site-fg);
    --ink-2: #75636e;
    --muted: var(--site-muted);
    --paper: var(--site-surface);
    --line: var(--site-border);
    --coral: var(--site-accent);
    --panel: rgba(255, 255, 255, .7);
    --shadow: 0 18px 50px rgba(90, 74, 85, .15), 0 2px 8px rgba(90, 74, 85, .05);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: var(--site-font);
    color: var(--ink);
    background-color: var(--site-bg);
    background-image:
      radial-gradient(900px 620px at 78% 8%, rgba(255, 230, 238, .88), transparent 62%),
      radial-gradient(900px 620px at 12% 92%, rgba(214, 237, 230, .6), transparent 66%),
      linear-gradient(165deg, rgba(233, 242, 251, .9) 0%, rgba(247, 238, 244, 0) 48%, rgba(253, 244, 233, .9) 100%);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: crosshair;
  }
  #stage canvas { display: block; cursor: inherit; }
  #stage.is-rotating { cursor: grabbing; }
  #stage.is-panning { cursor: move; }
  #stage.is-erasing { cursor: cell; }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(84, 67, 79, .10) 100%);
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: calc(20px * var(--site-space, 1)) calc(24px * var(--site-space, 1));
    pointer-events: none;
    animation: fadeIn .8s ease both;
  }
  .topbar > * { pointer-events: auto; }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px 9px 10px;
    border-radius: calc(var(--site-radius, 12px) * 1.5);
    background: color-mix(in srgb, var(--site-surface) 55%, transparent);
    border: 1px solid rgba(255, 255, 255, .72);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    box-shadow: 0 8px 26px rgba(45, 64, 57, .1);
  }
  .brand__logo {
    width: 38px; height: 38px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: var(--coral);
    display: grid;
    place-items: center;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12), 0 4px 10px rgba(217, 85, 63, .25);
  }
  .brand h1 {
    margin: 0;
    font-size: calc(17px * var(--site-type, 1));
    font-weight: 800;
    letter-spacing: .01em;
    line-height: 1.15;
  }
  .brand__tag {
    display: block;
    margin-top: 2px;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: .3em;
    color: var(--muted);
  }
  .topbar__right {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .counter {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 42px;
    padding: 0 15px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(255, 255, 255, .72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 26px rgba(45, 64, 57, .08);
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .counter b {
    font-size: 13px;
    color: var(--ink);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .counter__size {
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: .01em;
  }
  .counter__dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--coral);
    box-shadow: 0 0 0 3px rgba(217, 85, 63, .14);
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 5px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(255, 255, 255, .72);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    box-shadow: 0 8px 26px rgba(45, 64, 57, .08);
  }
  .actions__sep {
    width: 1px; height: 20px;
    margin: 0 3px;
    background: var(--line);
  }
  .icon-btn {
    width: 38px; height: 38px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: var(--site-radius, 12px);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    transition: background calc(180ms * var(--site-motion, 1)) ease,
      color calc(180ms * var(--site-motion, 1)) ease,
      transform calc(180ms * var(--site-motion, 1)) ease;
  }
  .icon-btn:hover { background: rgba(90, 74, 85, .07); }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn.is-active { background: var(--ink); color: var(--site-on-accent); }
  .icon-btn:disabled { opacity: .28; cursor: default; background: transparent; }
  .icon-btn svg { width: 19px; height: 19px; pointer-events: none; }
  .icon-btn .icon-off { display: none; }
  .icon-btn.is-muted .icon-on { display: none; }
  .icon-btn.is-muted .icon-off { display: block; }

  /* ---------- hint ---------- */
  .hint {
    position: fixed;
    left: 24px;
    top: 104px;
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 11px 14px;
    border-radius: calc(var(--site-radius, 12px) * 1.1667);
    background: color-mix(in srgb, var(--site-surface) 38%, transparent);
    border: 1px solid rgba(255, 255, 255, .5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: rgba(90, 74, 85, .62);
    font-size: 11px;
    line-height: 1.4;
    pointer-events: none;
    animation: fadeIn 1s .2s ease both;
  }
  .hint kbd {
    display: inline-block;
    min-width: 34px;
    margin-right: 7px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, .7);
    border: 1px solid rgba(90, 74, 85, .08);
    box-shadow: 0 1px 0 rgba(90, 74, 85, .06);
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--ink-2);
    text-align: center;
  }

  /* ---------- intro ---------- */
  .intro {
    position: fixed;
    left: 50%;
    top: 104px;
    z-index: 8;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(255, 255, 255, .8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 12px 34px rgba(45, 64, 57, .1);
    font-size: 13px;
    color: var(--ink-2);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .55s ease, transform .55s ease;
  }
  .intro b { color: var(--ink); font-weight: 800; }
  .intro__dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--coral);
    box-shadow: 0 0 0 0 rgba(217, 85, 63, .35);
    animation: pulse 2s infinite;
  }
  .intro.is-hidden {
    opacity: 0;
    transform: translate(-50%, -10px);
  }

  /* ---------- dock ---------- */
  .dock {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: max-content;
    max-width: calc(100vw - 32px);
    padding: calc(12px * var(--site-space, 1)) calc(16px * var(--site-space, 1));
    border-radius: calc(var(--site-radius, 12px) * 2);
    background: color-mix(in srgb, var(--site-surface) 74%, transparent);
    border: 1px solid rgba(255, 255, 255, .82);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: var(--shadow);
    flex-wrap: wrap;
    animation: fadeIn .8s .08s ease both;
  }
  .dock__group {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .dock__label {
    padding-left: 3px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .24em;
    color: var(--muted);
  }
  .dock__row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dock__sep {
    width: 1px;
    height: 46px;
    background: var(--line);
    align-self: center;
  }
  .cat-tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-left: 1px;
    min-height: 16px;
  }
  .cat-tab {
    padding: 2px 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .1em;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  .cat-tab:hover { background: rgba(90, 74, 85, .06); color: var(--ink-2); }
  .cat-tab.is-active { background: rgba(90, 74, 85, .09); color: var(--ink); }
  .cat-tab:focus-visible { outline: 2px solid var(--coral); outline-offset: 1px; }

  .brick-list {
    display: flex;
    gap: 6px;
    flex: 0 1 auto;
    min-width: 0;
    max-width: min(52vw, 500px);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 1px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-behavior: smooth;
  }
  .brick-list::-webkit-scrollbar { display: none; }
  .brick-list .brick-chip { flex: 0 0 auto; }
  .brick-chip {
    width: 50px; height: 46px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: calc(var(--site-radius, 12px) * 1.0833);
    background: rgba(90, 74, 85, .045);
    color: var(--ink-2);
    cursor: pointer;
    transition: background calc(180ms * var(--site-motion, 1)) ease,
      color calc(180ms * var(--site-motion, 1)) ease,
      transform calc(180ms * var(--site-motion, 1)) ease,
      box-shadow calc(180ms * var(--site-motion, 1)) ease;
  }
  .brick-chip:hover { background: rgba(90, 74, 85, .09); }
  .brick-chip:active { transform: scale(.95); }
  .brick-chip.is-active {
    background: var(--ink);
    color: var(--site-on-accent);
    box-shadow: 0 7px 16px rgba(90, 74, 85, .22);
  }
  .brick-chip svg { display: block; }
  .brick-chip--prop {
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-family: inherit;
  }
  .brick-chip--prop svg { width: 22px; height: 22px; }
  .brick-chip--prop span {
    display: block;
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .02em;
    color: inherit;
    opacity: .8;
  }
  .brick-chip--labeled {
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-family: inherit;
  }
  .brick-chip--labeled svg { width: 25px; height: 25px; }
  .brick-chip--labeled span {
    display: block;
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .02em;
    color: inherit;
    opacity: .8;
  }
  .dock__group--colors.is-fixed {
    opacity: .32;
    pointer-events: none;
    filter: saturate(.4);
  }
  .tool-btn:disabled {
    opacity: .32;
    cursor: default;
    transform: none;
  }
  .rotate-btn {
    height: 46px;
    min-width: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: 1px dashed rgba(90, 74, 85, .28);
    border-radius: calc(var(--site-radius, 12px) * 1.0833);
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .rotate-btn:hover { background: rgba(90, 74, 85, .05); border-color: rgba(90, 74, 85, .4); }
  .rotate-btn:active { transform: scale(.95); }
  .rotate-btn svg { width: 18px; height: 18px; }
  .rotate-btn span {
    font-size: 9px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .color-list { display: flex; gap: 7px; align-items: center; }
  .color-dot {
    position: relative;
    width: 26px; height: 26px;
    flex: 0 0 auto;
    padding: 0;
    border: 2px solid rgba(255, 255, 255, .9);
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 -3px 6px rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .12);
    cursor: pointer;
    transition: transform .16s ease, outline-color .16s ease;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .color-dot:hover { transform: scale(1.1); }
  .color-dot.is-active { outline-color: var(--ink); }
  .color-dot.is-active::after {
    content: "";
    position: absolute;
    left: 8px; top: 7px;
    width: 8px; height: 4px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg);
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .45));
  }
  .tool-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 11px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: rgba(90, 74, 85, .045);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .tool-btn:hover { background: rgba(90, 74, 85, .09); }
  .tool-btn:active { transform: scale(.96); }
  .tool-btn.is-active { background: var(--ink); color: var(--site-on-accent); }
  .tool-btn svg { width: 16px; height: 16px; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 150px;
    z-index: 30;
    transform: translate(-50%, 8px);
    padding: 9px 17px;
    border-radius: 999px;
    background: rgba(90, 74, 85, .9);
    color: #fff;
    font-size: 12px;
    letter-spacing: .02em;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.is-show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- modal ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(80, 64, 74, .26);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .modal[hidden] { display: none; }
  .modal__card {
    width: min(360px, 100%);
    padding: 24px;
    border-radius: 22px;
    background: var(--paper);
    border: 1px solid rgba(255, 255, 255, .6);
    box-shadow: 0 24px 80px rgba(20, 35, 30, .32);
    animation: pop .22s ease both;
  }
  .modal__card h2 {
    margin: 0 0 8px;
    font-size: 18px;
    letter-spacing: .01em;
  }
  .modal__card p {
    margin: 0 0 20px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--muted);
  }
  .modal__actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .18s ease, transform .18s ease;
  }
  .btn:hover { filter: brightness(.96); }
  .btn:active { transform: scale(.97); }
  .btn--ghost { background: rgba(90, 74, 85, .06); color: var(--ink-2); }
  .btn--danger { background: var(--coral); color: var(--site-on-accent); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(217, 85, 63, .35); }
    70% { box-shadow: 0 0 0 8px rgba(217, 85, 63, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 85, 63, 0); }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    .hint { display: none; }
  }
  @media (max-width: 980px) {
    .topbar { padding: 14px 16px; }
    .dock { gap: 12px; padding: 10px 12px; bottom: 14px; }
    .dock__sep { display: none; }
    .brand__tag { display: none; }
    .counter { height: 38px; padding: 0 12px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
    .intro { top: 88px; }
  }
  @media (max-width: 760px) {
    .topbar { padding: 12px; }
    .brand { padding: 7px 12px 7px 8px; gap: 9px; }
    .brand__logo { width: 32px; height: 32px; border-radius: 10px; }
    .brand h1 { font-size: 15px; }
    .counter { display: none; }
    .dock {
      left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
      width: auto;
      max-width: none;
      transform: none;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      border-radius: 20px;
    }
    .dock__group { gap: 0; }
    .dock__label { display: none; }
    .dock__row { gap: 5px; }
    .brick-list { max-width: calc(100vw - 92px); }
    .brick-chip { width: 44px; height: 42px; border-radius: 11px; }
    .brick-chip--prop { width: 52px; }
    .brick-chip--labeled { width: 48px; }
    .rotate-btn { height: 42px; min-width: 42px; border-radius: 11px; }
    .color-dot { width: 23px; height: 23px; }
    .color-list { gap: 6px; }
    .tool-btn { height: 32px; padding: 0 9px; }
    .intro {
      top: 80px;
      max-width: calc(100vw - 28px);
      padding: 8px 14px;
      font-size: 12px;
      white-space: normal;
      text-align: center;
    }
    .toast { bottom: 190px; }
  }
  @media (max-width: 520px) {
    .topbar { padding: 10px; }
    .actions { gap: 1px; padding: 4px; }
    .icon-btn { width: 32px; height: 32px; }
    .icon-btn svg { width: 17px; height: 17px; }
    .brand { padding: 6px 9px 6px 7px; gap: 7px; border-radius: 14px; }
    .brand__logo { width: 28px; height: 28px; border-radius: 9px; }
    .brand h1 { font-size: 13.5px; }
    .dock { gap: 8px; padding: 8px; }
    .brick-chip { width: 40px; height: 38px; }
    .brick-chip--prop { width: 48px; }
    .brick-chip--labeled { width: 44px; }
    .brick-chip--labeled svg { width: 22px; height: 22px; }
    .rotate-btn { height: 38px; min-width: 38px; }
    .color-dot { width: 21px; height: 21px; }
    .color-dot.is-active::after { left: 6px; top: 5px; width: 7px; height: 3px; }
    .tool-btn { font-size: 11px; padding: 0 8px; gap: 4px; }
    .cat-tab { padding: 1px 5px; font-size: 8.5px; }
  }
  /* ---------- environment: time, sky and weather ---------- */
  .time-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: transparent;
    transition: background 1.4s ease, opacity 1.4s ease;
  }
  body.time-morning .time-overlay {
    background: linear-gradient(180deg, rgba(255, 209, 201, .36), rgba(255, 236, 214, .18) 55%, rgba(255, 247, 235, 0));
  }
  body.time-day .time-overlay {
    background: radial-gradient(ellipse at 78% 7%, rgba(255, 242, 198, .3), transparent 46%);
  }

    function plateFits(radius) {
      cam.radius = radius;
      applyCamera();
      const corners = [
        new THREE.Vector3(-SIZE / 2, 0, -SIZE / 2),
        new THREE.Vector3(SIZE / 2, 0, -SIZE / 2),
        new THREE.Vector3(SIZE / 2, 0, SIZE / 2),
        new THREE.Vector3(-SIZE / 2, 0, SIZE / 2)
      ];
      let maxX = 0;
      let maxY = -Infinity;
      let minY = Infinity;
      for (let i = 0; i < corners.length; i++) {
        const v = corners[i].clone().project(camera);
        maxX = Math.max(maxX, Math.abs(v.x));
        maxY = Math.max(maxY, v.y);
        minY = Math.min(minY, v.y);
      }
      const xLimit = window.innerWidth < window.innerHeight ? 1.22 : 0.87;
      return maxX <= xLimit && maxY <= 0.72 && -minY <= 0.82;
    }

      let hi = 200;
      for (let i = 0; i < 26; i++) {
        const mid = (lo + hi) / 2;
        if (plateFits(mid)) hi = mid;
        else lo = mid;
      }
      cam.radius = hi;
      applyCamera();
    }

    function applyCamera() {

      const sp = Math.sin(cam.phi);
      camera.position.set(
        cam.target.x + r * sp * Math.sin(cam.theta),
        cam.target.y + r * Math.cos(cam.phi),
        cam.target.z + r * sp * Math.cos(cam.theta)
      );
      camera.lookAt(cam.target);

      mesh.userData.baseScale = bs;
      mesh.scale.set(bs.x, bs.y, 1);
      mesh.renderOrder = 1;
      mesh.visible = false;
      puddleGroup.add(mesh);
      puddleMeshes.push(mesh);
    }
    const rippleMeshes = [];
    const rippleGeo = new THREE.RingGeometry(0.35, 0.43, 22);
    for (let i = 0; i < 8; i++) {
      const puddleIndex = (i * 3 + 1) % puddlePositions.length;
      const p = puddlePositions[puddleIndex];
      const mat = new THREE.MeshBasicMaterial({
        color: 0xc8ecf7,
        transparent: true,
        opacity: 0,
        depthWrite: false
      });
      const ring = new THREE.Mesh(rippleGeo, mat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(p.nx * 17, 0.118, p.nz * 17);
      ring.userData.phase = Math.random();
      ring.userData.puddleIndex = puddleIndex;
      ring.visible = false;
      puddleGroup.add(ring);
      rippleMeshes.push(ring);
    }

    const snowGroundGroup = new THREE.Group();
    snowGroundGroup.visible = false;
    environmentGroundGroup.add(snowGroundGroup);
    function makeSnowGroundTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillRect(0, 0, 128, 128);
      for (let i = 0; i < 220; i++) {
        const a = Math.random() * 0.08;
        ctx.fillStyle = 'rgba(180,205,224,' + a.toFixed(3) + ')';
        const r = 0.5 + Math.random() * 2;
        ctx.beginPath();
        ctx.arc(Math.random() * 128, Math.random() * 128, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const snowTex = new THREE.CanvasTexture(c);
      if ('encoding' in snowTex) snowTex.encoding = THREE.sRGBEncoding;
      return snowTex;
    }
    const snowGroundMat = new THREE.MeshStandardMaterial({      color: 0xffffff,
      map: makeSnowGroundTexture(),
      roughness: 0.9,
      metalness: 0,
      transparent: true,
      opacity: 0.42,
      depthWrite: false
    });
    const snowCover = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), snowGroundMat);
    snowCover.rotation.x = -Math.PI / 2;
    snowCover.position.y = 0.115;
    snowCover.receiveShadow = true;
    snowCover.renderOrder = 1;
    snowGroundGroup.add(snowCover);
    const snowMounds = [];
    const snowMoundGeo = new THREE.SphereGeometry(1, 12, 8);
    const snowMoundMat = new THREE.MeshStandardMaterial({
      color: 0xf7fbfd,
      roughness: 0.88,
      metalness: 0
    });
    for (let i = 0; i < 14; i++) {
      const nx = Math.random() * 2 - 1;
      const nz = Math.random() * 2 - 1;
      const mound = new THREE.Mesh(snowMoundGeo, snowMoundMat);
      mound.position.set(nx * 16, 0.1, nz * 16);
      const base = {
        x: 0.25 + Math.random() * 0.35,
        y: 0.08 + Math.random() * 0.12,
        z: 0.25 + Math.random() * 0.35
      };
      mound.scale.set(base.x, base.y, base.z);
      mound.userData.baseScale = base;
      mound.userData.nx = nx;
      mound.userData.nz = nz;
      mound.userData.threshold = (i / 14) * 0.56;
      mound.visible = false;
      mound.castShadow = false;
      mound.receiveShadow = true;
      snowGroundGroup.add(mound);
      snowMounds.push(mound);
    }

    function layoutEnvironmentGrounds() {
      const span = Math.max(1, SIZE - 1.4);
      const spread = Math.max(2, SIZE / 2 - 2);
      snowCover.scale.set(span, span, 1);
      for (let i = 0; i < puddleMeshes.length; i++) {
        const p = puddlePositions[i];
        puddleMeshes[i].position.x = p.nx * spread;
        puddleMeshes[i].position.z = p.nz * spread;
      }
      for (let i = 0; i < rippleMeshes.length; i++) {
        const ring = rippleMeshes[i];
        const p = puddlePositions[ring.userData.puddleIndex];
        ring.position.x = p.nx * spread;
        ring.position.z = p.nz * spread;
      }
      for (let i = 0; i < snowMounds.length; i++) {
        const mound = snowMounds[i];
        mound.position.x = mound.userData.nx * spread;
        mound.position.z = mound.userData.nz * spread;
      }
    }
    layoutEnvironmentGrounds();

    // star field for the night sky
    if (starsEl) {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 92; i++) {
        const star = document.createElement('i');
        star.style.left = (2 + Math.random() * 96).toFixed(2) + '%';
        star.style.top = (2 + Math.random() * 40).toFixed(2) + '%';
        const s = 1 + Math.random() * 1.8;
        star.style.width = s.toFixed(2) + 'px';
        star.style.height = s.toFixed(2) + 'px';
        star.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
        star.style.animationDelay = (Math.random() * 3.6).toFixed(2) + 's';
        star.style.animationDuration = (2.8 + Math.random() * 3.2).toFixed(2) + 's';
        frag.appendChild(star);
      }
      starsEl.appendChild(frag);
    }

    function isNightTime() {
      return state.timeOfDay === 'night';
    }
    function isDuskTime() {
      return state.timeOfDay === 'dusk';
    }
    function vehicleLightsOn() {
      return isNightTime() || isDuskTime() || state.weather === 'rain' || state.weather === 'snow';
    }

    function computeEnvironmentLight() {
      const t = TIME_LIGHT[state.timeOfDay] || TIME_LIGHT.day;
      const w = WEATHER_LIGHT[state.weather] || WEATHER_LIGHT.sunny;
      return {
        key: t.key * w.key,
        hemi: t.hemi * w.hemi,
        fill: t.fill * w.fill,
        face: t.face * w.key,
        keyColor: new THREE.Color(t.keyColor).lerp(w.tint, 0.3),
        hemiColor: new THREE.Color(t.hemiColor).lerp(w.tint, 0.24),
        groundColor: new THREE.Color(t.groundColor),
        fillColor: new THREE.Color(t.fillColor)
      };
    }

    function updateWeatherUI() {
      if (weatherRowEl) {
        weatherRowEl.querySelectorAll('.weather-btn').forEach(function (btn) {
          const mode = btn.dataset.weather;
          const active = mode === 'auto' ? state.weatherAuto : (!state.weatherAuto && state.weather === mode);
          btn.classList.toggle('is-active', active);
          btn.classList.toggle('is-current', state.weatherAuto && mode === state.weather);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }
      if (timeRowEl) {
        timeRowEl.querySelectorAll('.time-btn').forEach(function (btn) {
          const mode = btn.dataset.time;
          const active = mode === 'auto' ? state.timeAuto : (!state.timeAuto && state.timeOfDay === mode);
          btn.classList.toggle('is-active', active);
          btn.classList.toggle('is-current', state.timeAuto && mode === state.timeOfDay);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }
      if (envSummaryEl) {
        envSummaryEl.textContent = (TIME_LABELS[state.timeOfDay] || '白天') + ' · ' + (WEATHER_LABELS[state.weather] || '晴天');
      }
      if (envControlEl) {
        envControlEl.classList.toggle('has-auto', state.timeAuto || state.weatherAuto);
      }
      if (eventRowEl) {
        eventRowEl.querySelectorAll('.event-btn').forEach(function (btn) {
          if (btn.dataset.event !== 'auto') return;
          btn.classList.toggle('is-active', state.eventsAuto);
          btn.setAttribute('aria-pressed', state.eventsAuto ? 'true' : 'false');
        });
      }
    }

    function syncAttachmentVisibility(group) {
      if (!group) return;
      const acc = group.userData.charAccessories;
      const rec = group.userData.record;
      if (rec && rec.damaged) {
        if (acc) {
          acc.umbrella.visible = false;
          acc.scarf.visible = false;
          acc.lantern.visible = false;
          if (acc.rainCoat) acc.rainCoat.visible = false;
          if (acc.snowCoat) acc.snowCoat.visible = false;
          if (acc.beanie) acc.beanie.visible = false;
        }
        if (group.userData.nightGlow) group.userData.nightGlow.visible = false;
        if (group.userData.vehicleGlow) group.userData.vehicleGlow.visible = false;
        return;
      }
      if (acc) {
        acc.umbrella.visible = state.weather === 'rain';
        acc.scarf.visible = state.weather === 'snow';
        acc.lantern.visible = isNightTime() || isDuskTime();
        if (acc.rainCoat) acc.rainCoat.visible = state.weather === 'rain';
        if (acc.snowCoat) acc.snowCoat.visible = state.weather === 'snow';
        if (acc.beanie) acc.beanie.visible = state.weather === 'snow';
      }
      if (group.userData.nightGlow) {
        const glow = group.userData.nightGlow;
        const level = isNightTime() ? 0.56 : (isDuskTime() ? 0.2 : 0);
        glow.visible = level > 0;
        glow.material.opacity = level;
      }
      if (group.userData.vehicleGlow) {
        group.userData.vehicleGlow.visible = vehicleLightsOn();
      }
    }

    function refreshEnvironmentAttachments() {
      state.props.forEach(function (p) {
        const group = state.meshById.get(p.id);
        if (group) syncAttachmentVisibility(group);
      });
    }

    function applyEnvironment() {
      document.body.classList.remove('weather-sunny', 'weather-rain', 'weather-snow',
        'time-morning', 'time-day', 'time-dusk', 'time-night');
      document.body.classList.add('weather-' + state.weather, 'time-' + state.timeOfDay);
      rainLines.visible = state.weather === 'rain';
      snowPoints.visible = state.weather === 'snow';
      if (state.eventsAuto && (state.weather === 'rain' || state.weather === 'snow')) {
        if (!nextLightningAt) {
          nextLightningAt = performance.now() + 14000 + Math.random() * 16000;
        }
      } else {
        nextLightningAt = 0;
      }
      environmentLightTarget = computeEnvironmentLight();
      lastWeatherFrame = performance.now();
      layoutEnvironmentGrounds();
      syncGroundAccumulation(performance.now());
      if (scene.fog) {
        const base = new THREE.Color(FOG_SKY[state.timeOfDay] || FOG_SKY.day);
        if (state.weather !== 'sunny') {
          base.lerp(new THREE.Color(FOG_WEATHER[state.weather] || 0xffffff),
            state.timeOfDay === 'night' ? 0.3 : 0.56);
        }
        scene.fog.color.copy(base);
      }
      if (backdropReady) applyBackdropEnvironment();
      refreshEnvironmentAttachments();
      updateWeatherUI();
    }

    function stopWeatherAuto() {
      if (weatherAutoTimer) clearInterval(weatherAutoTimer);
      weatherAutoTimer = null;
    }
    function stopTimeAuto() {
      if (timeAutoTimer) clearInterval(timeAutoTimer);
      timeAutoTimer = null;
    }
    function startWeatherAuto() {
      stopWeatherAuto();
      weatherAutoTimer = setInterval(function () {
        const prev = state.weather;
        const i = WEATHER_MODES.indexOf(state.weather);
        state.weather = WEATHER_MODES[(i + 1) % WEATHER_MODES.length];
        applyEnvironment();
        if (prev === 'rain' && state.weather === 'sunny' && state.wetness > 0.06) {
          if (showRainbow(false)) toast('雨停啦 · 彩虹出来了');
        }
        scheduleSave();
      }, WEATHER_AUTO_MS);
    }
    function startTimeAuto() {
      stopTimeAuto();
      timeAutoTimer = setInterval(function () {
        const i = TIME_MODES.indexOf(state.timeOfDay);
        state.timeOfDay = TIME_MODES[(i + 1) % TIME_MODES.length];
        applyEnvironment();
        scheduleSave();
      }, TIME_AUTO_MS);
    }
    function setWeatherMode(mode) {
      if (WEATHER_MODES.indexOf(mode) === -1) return;
      const prev = state.weather;
      stopWeatherAuto();
      state.weatherAuto = false;
      state.weather = mode;
      applyEnvironment();
      const madeRainbow = prev === 'rain' && mode === 'sunny' &&
        state.wetness > 0.06 && showRainbow(false);
      scheduleSave();
      toast(madeRainbow ? '天气 · 晴天 · 彩虹出来了' : '天气 · ' + WEATHER_LABELS[mode]);
      playSound('tick');
    }
    function setTimeMode(mode) {
      if (TIME_MODES.indexOf(mode) === -1) return;
      stopTimeAuto();
      state.timeAuto = false;
      state.timeOfDay = mode;
      applyEnvironment();
      scheduleSave();
      toast('时间 · ' + TIME_LABELS[mode]);
      playSound('tick');
    }
    function toggleWeatherAuto() {
      state.weatherAuto = !state.weatherAuto;
      if (state.weatherAuto) {
        startWeatherAuto();
        toast('自动天气已开启 · 每 1 分钟切换');
      } else {
        stopWeatherAuto();
        toast('自动天气已关闭');
      }
      updateWeatherUI();
      scheduleSave();
      playSound('tick');
    }
    function toggleTimeAuto() {
      state.timeAuto = !state.timeAuto;
      if (state.timeAuto) {
        startTimeAuto();
        toast('自动时间已开启 · 每 45 秒切换');
      } else {
        stopTimeAuto();
        toast('自动时间已关闭');
      }
      updateWeatherUI();
      scheduleSave();
      playSound('tick');
    }
    function toggleEventsAuto() {
      state.eventsAuto = !state.eventsAuto;
      if (state.eventsAuto) {
        scheduleRandomEvent();
        if ((state.weather === 'rain' || state.weather === 'snow') && !nextLightningAt) {
          nextLightningAt = performance.now() + 14000 + Math.random() * 16000;
        }
        toast('自动灾害已开启 · 龙卷风、地震、海啸会来访，雨雪天还有雷电');
      } else {
        stopRandomEvents();
        nextLightningAt = 0;
        toast('自动灾害已关闭');
      }
      updateWeatherUI();
      scheduleSave();
      playSound('tick');
    }
    function triggerEvent(kind) {
      if (kind === 'tornado') return triggerTornado();
      if (kind === 'earthquake') return triggerEarthquake();
      if (kind === 'tsunami') return triggerTsunami();
      if (kind === 'lightning') return triggerLightning(true);
      if (kind === 'rainbow') return showRainbow(true);
      return false;
    }

    function smoothstep(a, b, x) {
      const t = clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function updateAccumulation(dt) {
      if (state.weather === 'rain') {
        state.wetness += dt / 24;
        state.snowDepth = Math.max(0, state.snowDepth - dt / 16);
      } else if (state.weather === 'snow') {
        state.snowDepth += dt / 34;
        state.wetness = Math.max(0, state.wetness - dt / 18);
      } else {
        state.wetness = Math.max(0, state.wetness - dt / 55);
        state.snowDepth = Math.max(0, state.snowDepth - dt / 70);
      }
      state.wetness = clamp(state.wetness, 0, 1);
      state.snowDepth = clamp(state.snowDepth, 0, 1);

      if (state.weather === 'rain' && state.wetness > 0.44 && !wetToastShown) {
        wetToastShown = true;
        toast('地面开始积水啦');
      } else if (state.wetness < 0.06) {
        wetToastShown = false;
      }
      if (state.weather === 'snow' && state.snowDepth > 0.32 && !snowToastShown) {
        snowToastShown = true;
        toast('雪已经积起来啦');
      } else if (state.snowDepth < 0.05) {
        snowToastShown = false;
      }
    }

    function syncGroundAccumulation(now) {
      const wet = clamp(state.wetness, 0, 1);
      const snow = clamp(state.snowDepth, 0, 1);
      const showPuddles = wet > 0.012 && snow < 0.15;
      puddleGroup.visible = showPuddles;
      if (showPuddles) {
        puddleMat.opacity = 0.44 * smoothstep(0.012, 0.5, wet);
        const reveal = wet * puddleMeshes.length;
        for (let i = 0; i < puddleMeshes.length; i++) {
          const mesh = puddleMeshes[i];
          const local = clamp(reveal - i, 0, 1);
          mesh.visible = local > 0.004;
          const grow = 0.4 + 0.6 * smoothstep(0, 1, local);
          mesh.scale.set(
            mesh.userData.baseScale.x * grow,
            mesh.userData.baseScale.y * grow,
            1
          );
        }
      }
      const rainActive = state.weather === 'rain' && showPuddles && wet > 0.08;
      for (let i = 0; i < rippleMeshes.length; i++) {
        rippleMeshes[i].visible = rainActive;
      }

      const showSnow = snow > 0.012;
      snowGroundGroup.visible = showSnow;
      if (showSnow) {
        snowGroundMat.opacity = 0.1 + 0.46 * smoothstep(0.012, 0.55, snow);
        snowCover.position.y = 0.113 + snow * 0.022;
        for (let i = 0; i < snowMounds.length; i++) {
          const mound = snowMounds[i];
          const local = clamp((snow - mound.userData.threshold) / 0.18, 0, 1);
          mound.visible = local > 0.01;
          const s = 0.05 + 0.95 * smoothstep(0, 1, local);
          mound.scale.set(
            mound.userData.baseScale.x * s,
            mound.userData.baseScale.y * s,
            mound.userData.baseScale.z * s
          );
          mound.position.y = 0.1 + snow * 0.018;
        }
      }
      for (let i = 0; i < backdropSnowCaps.length; i++) {
        const cap = backdropSnowCaps[i];
        const local = clamp((snow - cap.threshold) / 0.26, 0, 1);
        cap.mesh.visible = local > 0.008;
        const s = 0.02 + 0.98 * smoothstep(0, 1, local);
        cap.mesh.scale.set(
          cap.base.x * s,
          cap.base.y * s,
          cap.base.z * s
        );
      }
      const hillDust = smoothstep(0.02, 0.75, snow) * 0.34;
      for (let i = 0; i < backdropHills.length; i++) {
        const hill = backdropHills[i];
        hill.mesh.material.color.copy(hill.baseColor).lerp(snowTintColor, hillDust);
      }
    }

    function updateWeather(now) {
      if (environmentLightTarget) {
        const t = environmentLightTarget;
        hemiLight.intensity += (t.hemi - hemiLight.intensity) * 0.055;
        hemiLight.color.lerp(t.hemiColor, 0.055);
        hemiLight.groundColor.lerp(t.groundColor, 0.055);
        keyLight.intensity += (t.key - keyLight.intensity) * 0.055;
        keyLight.color.lerp(t.keyColor, 0.055);
        fillLight.intensity += (t.fill - fillLight.intensity) * 0.055;
        fillLight.color.lerp(t.fillColor, 0.055);
        faceLight.intensity += (t.face - faceLight.intensity) * 0.055;
      }

      const rawDt = Math.min(0.35, Math.max(0, (now - lastWeatherFrame) / 1000));
      lastWeatherFrame = now;
      updateAccumulation(rawDt);
      syncGroundAccumulation(now);

      if (puddleGroup.visible && state.weather === 'rain') {
        for (let i = 0; i < rippleMeshes.length; i++) {
          const ring = rippleMeshes[i];
          const p = ((now * 0.0012 + ring.userData.phase) % 1);
          ring.scale.setScalar(0.55 + p * 1.7);
          ring.material.opacity = 0.4 * (1 - p) * smoothstep(0.05, 0.4, state.wetness);
        }
      }

      if (!rainLines.visible && !snowPoints.visible) return;
      const dt = Math.min(0.06, rawDt);

      if (rainLines.visible) {
        for (let i = 0; i < RAIN_COUNT; i++) {
          const drop = rainDrops[i];
          drop.y -= drop.speed * dt;
          if (drop.y < -1) {
            drop.y = 18 + Math.random() * 5;
            drop.x = (Math.random() * 2 - 1) * WEATHER_HALF;
            drop.z = (Math.random() * 2 - 1) * WEATHER_HALF;
          }
          writeRainDrop(i, drop);
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      if (snowPoints.visible) {
        for (let i = 0; i < SNOW_COUNT; i++) {
          const flake = snowFlakes[i];
          flake.y -= flake.speed * dt;
          if (flake.y < 0) {
            flake.y = 14 + Math.random() * 4;
            flake.sx = (Math.random() * 2 - 1) * WEATHER_HALF;
            flake.sz = (Math.random() * 2 - 1) * WEATHER_HALF;
            flake.phase = Math.random() * Math.PI * 2;
          }
          snowPositions[i * 3] = flake.sx + Math.sin(now * 0.0007 + flake.phase) * 0.55;
          snowPositions[i * 3 + 1] = flake.y;
          snowPositions[i * 3 + 2] = flake.sz + Math.cos(now * 0.00055 + flake.phase) * 0.42;
        }
        snowGeo.attributes.position.needsUpdate = true;
      }
    }

    // ---------------------------------------------------------------- backdrop scenery
    function backdropMat(hex, opts) {
      return new THREE.MeshStandardMaterial(Object.assign({
        color: new THREE.Color(hex),
        roughness: 0.94,
        metalness: 0
      }, opts || {}));
    }

    const backdropGroup = new THREE.Group();
    backdropGroup.name = 'backdrop';
    scene.add(backdropGroup);

    function makeMeadowTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#a9c9a0';
      ctx.fillRect(0, 0, 512, 512);
      const blobs = ['#9bbf96', '#bcd9b0', '#a3c59d', '#c6dfb7', '#8fb98f'];
      for (let i = 0; i < 150; i++) {
        ctx.fillStyle = blobs[i % blobs.length];
        ctx.globalAlpha = 0.38 + Math.random() * 0.42;
        ctx.beginPath();
        ctx.ellipse(Math.random() * 512, Math.random() * 512,
          14 + Math.random() * 48, 8 + Math.random() * 30,
          Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 90; i++) {
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = i % 2 ? '#f2f7e9' : '#91b894';
        ctx.beginPath();
        ctx.arc(Math.random() * 512, Math.random() * 512, 1.5 + Math.random() * 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7, 7);
      if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
      return tex;
    }
    const meadow = new THREE.Mesh(
      new THREE.CircleGeometry(160, 64),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: makeMeadowTexture(),
        roughness: 1,
        metalness: 0
      })
    );
    meadow.rotation.x = -Math.PI / 2;
    meadow.position.y = -7.8;
    meadow.receiveShadow = false;
    backdropGroup.add(meadow);

    // layered pastel hills on the mountain side
    const HILLS = [
      { x: -64, z: -42, rx: 27, ry: 10, rz: 19, c: 0x96c2a5 },
      { x: -86, z: -4, rx: 25, ry: 8.5, rz: 18, c: 0xaac6b4 },
      { x: -38, z: -72, rx: 31, ry: 12, rz: 23, c: 0xa5bfd6 },
      { x: 8, z: -88, rx: 36, ry: 13, rz: 25, c: 0xb7d1ba },

    function makeOceanTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8ecfdf';
      ctx.fillRect(0, 0, 256, 256);
      const waveColors = ['#a7dfe8', '#78bfd2', '#b8e8ec', '#6fb4c9'];
      for (let i = 0; i < 70; i++) {
        ctx.strokeStyle = waveColors[i % waveColors.length];
        ctx.globalAlpha = 0.18 + Math.random() * 0.3;
        ctx.lineWidth = 1.5 + Math.random() * 3;
        const y = Math.random() * 256;
        ctx.beginPath();
        ctx.moveTo(-10, y);
        ctx.bezierCurveTo(60, y - 10, 120, y + 12, 190, y - 4);
        ctx.stroke();
      }
      for (let i = 0; i < 45; i++) {
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = '#e9fbff';
        ctx.lineWidth = 1;
        const y = Math.random() * 256;
        ctx.beginPath();
        ctx.moveTo(Math.random() * 256, y);
        ctx.quadraticCurveTo(Math.random() * 256, y + 6, Math.random() * 256, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 10);
      if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

        const p = Math.sin(now * 0.0011 + foam.userData.phase);

          foam.userData.base.y * (0.82 + p * 0.22),

      puff.scale.set(p[3] * 1.35, p[3] * 0.6, p[3] * 0.9);
      tornadoTop.add(puff);

    const tornadoDust = new THREE.Mesh(

    const TORNADO_DEBRIS = 56;

        transparent: true,

      }), 0.95),

    );
    const tornadoDebrisColors = [0xd9b6a0, 0xe9a9b8, 0xb3dccb, 0xf4e09b];
    for (let i = 0; i < TORNADO_DEBRIS; i++) {
      tornadoDebris.setColorAt(i, new THREE.Color(tornadoDebrisColors[i % tornadoDebrisColors.length]));
    }
    if (tornadoDebris.instanceColor) tornadoDebris.instanceColor.needsUpdate = true;
    tornadoDebris.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    tornadoDebris.frustumCulled = false;
    tornadoGroup.add(tornadoDebris);
    const tornadoDebrisSeeds = [];
    for (let i = 0; i < TORNADO_DEBRIS; i++) {
      const y = 0.5 + Math.random() * 11.4;
      tornadoDebrisSeeds.push({
        angle: Math.random() * Math.PI * 2,
        radius: 0.9 + (y / 12) * 3.2 + Math.random() * 0.6,
        y: y,
        speed: 0.9 + Math.random() * 1.7,
        size: 0.55 + Math.random() * 1.0,
        phase: Math.random() * Math.PI * 2
      });
    }

    const tornado = {
      active: false,
      startTime: 0,
      duration: 10800,
      startX: 0,
      startZ: 0,
      endX: 0,
      endZ: 0,
      cx: 0,
      cz: 0,
      fade: 0,
      captured: new Map()
    };
    const tornadoDummy = new THREE.Object3D();

    function isLiftableProp(p) {
      const def = PROP_MAP[p.propType];
      if (!def || p.damaged) return false;
      return def.cat === 'person' || def.cat === 'animal' ||
        def.cat === 'vehicle' || def.cat === 'char';
    }

    function triggerTornado() {
      if (anyMajorActive()) {
        toast('灾害正在发生 · 先避一避吧');
        return false;
      }
      let targetX = 0;
      let targetZ = 0;
      const candidates = state.props.filter(isLiftableProp);
      if (candidates.length) {
        const pick = candidates[Math.floor(Math.random() * candidates.length)];
        const def = PROP_MAP[pick.propType];
        const dims = effDims(def, pick.rot);
        targetX = worldX(pick.gx, dims[0]);
        targetZ = worldZ(pick.gz, dims[1]);
      } else {
        const a = Math.random() * Math.PI * 2;
        targetX = Math.sin(a) * 3;
        targetZ = Math.cos(a) * 3;
      }
      const R = Math.max(6, SIZE / 2 - 1.2);
      let rr = Math.hypot(targetX, targetZ);
      if (rr > R * 0.9) {
        const k = (R * 0.9) / rr;
        targetX *= k;
        targetZ *= k;
        rr = R * 0.9;
      }
      const dirAngle = Math.atan2(targetX, targetZ) + Math.PI / 2 + (Math.random() * 0.5 - 0.25);
      const dx = Math.sin(dirAngle);
      const dz = Math.cos(dirAngle);
      const half = Math.sqrt(Math.max(4, R * R - rr * rr));
      tornado.startX = targetX - dx * half;
      tornado.startZ = targetZ - dz * half;
      tornado.endX = targetX + dx * half;
      tornado.endZ = targetZ + dz * half;
      if (Math.random() < 0.5) {
        const sx = tornado.startX;
        const sz = tornado.startZ;
        tornado.startX = tornado.endX;
        tornado.startZ = tornado.endZ;
        tornado.endX = sx;
        tornado.endZ = sz;
      }
      tornado.captured.clear();
      tornado.active = true;
      tornado.startTime = performance.now();
      tornado.fade = 0;
      tornadoGroup.visible = true;
      tornadoGroup.position.set(tornado.startX, 0.12, tornado.startZ);
      toast('龙卷风来啦 · 小心被吹起来');
      playSound('tornado');
      return true;
    }

    function restoreTornadoProp(item) {
      const g = item.group;
      if (!g) return;
      g.position.set(item.px, item.py, item.pz);
      g.rotation.set(item.rx, item.ry, item.rz);
      g.scale.set(item.sx, item.sy, item.sz);
    }

    function finishTornado() {
      let scattered = 0;
      tornado.captured.forEach(function (item) {
        if (!scatterTornadoProp(item, tornado.endX, tornado.endZ)) restoreTornadoProp(item);
        else scattered++;
      });
      tornado.captured.clear();
      tornado.active = false;
      tornadoGroup.visible = false;
      for (let i = 0; i < tornadoOpacityMats.length; i++) {
        tornadoOpacityMats[i].opacity = 0;
      }
      if (scattered) {
        toast('龙卷风把东西吹散啦');
        scheduleSave();
      }
    }

    function updateTornado(now) {
      if (!tornado.active) return;
      const p = clamp((now - tornado.startTime) / tornado.duration, 0, 1);
      const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const cx = tornado.startX + (tornado.endX - tornado.startX) * ease +
        Math.sin(now * 0.0011) * 0.35;
      const cz = tornado.startZ + (tornado.endZ - tornado.startZ) * ease +
        Math.cos(now * 0.0009) * 0.3;
      tornado.cx = cx;
      tornado.cz = cz;
      const fade = smoothstep(0, 0.1, p) * (1 - smoothstep(0.88, 1, p));
      tornado.fade = fade;
      tornadoGroup.position.set(cx, 0.12, cz);
      tornadoGroup.visible = fade > 0.004;
      for (let i = 0; i < tornadoOpacityMats.length; i++) {
        const mat = tornadoOpacityMats[i];
        mat.opacity = mat.userData.tornadoBaseOpacity * fade;
      }
      for (let i = 0; i < tornadoCones.length; i++) {
        const cone = tornadoCones[i];
        cone.position.x = Math.sin(now * 0.0012 + cone.userData.phase) * (0.06 + i * 0.03);
        cone.position.z = Math.cos(now * 0.0011 + cone.userData.phase) * (0.06 + i * 0.03);
      }
      for (let i = 0; i < tornadoSwirls.length; i++) {
        const swirl = tornadoSwirls[i];
        swirl.holder.rotation.y = now * 0.001 * swirl.speed + swirl.phase;
      }
      for (let i = 0; i < tornadoRibbons.length; i++) {
        const ribbon = tornadoRibbons[i];
        ribbon.mesh.rotation.y = now * 0.00024 * (i === 0 ? 1 : -1);
        ribbon.tex.offset.x = now * ribbon.speedX;
        ribbon.tex.offset.y = now * ribbon.speedY;
      }
      tornadoTop.rotation.y = now * 0.00035;
      tornadoDust.scale.setScalar(0.9 + Math.sin(now * 0.0026) * 0.08);
      for (let i = 0; i < tornadoDebrisSeeds.length; i++) {
        const seed = tornadoDebrisSeeds[i];
        const angle = seed.angle + now * 0.001 * seed.speed;
        const radius = seed.radius + Math.sin(now * 0.0011 + seed.phase) * 0.16;
        tornadoDummy.position.set(
          Math.cos(angle) * radius,
          seed.y + Math.sin(now * 0.0016 + seed.phase) * 0.35,
          Math.sin(angle) * radius
        );
        tornadoDummy.rotation.set(angle * 1.3, angle * 2.1, angle * 0.7);
        tornadoDummy.scale.setScalar(seed.size);
        tornadoDummy.updateMatrix();
        tornadoDebris.setMatrixAt(i, tornadoDummy.matrix);
      }
      tornadoDebris.instanceMatrix.needsUpdate = true;

      if (p > 0.02 && p < 0.82 && tornado.captured.size < 14) {
        for (let i = 0; i < state.props.length; i++) {
          const prop = state.props[i];
          if (tornado.captured.has(prop.id) || !isLiftableProp(prop)) continue;
          const g = state.meshById.get(prop.id);
          if (!g || !g.parent) continue;
          const dxp = g.position.x - cx;
          const dzp = g.position.z - cz;
          const dist = Math.hypot(dxp, dzp);
          if (dist > 5.2 || g.position.y > 10) continue;
          tornado.captured.set(prop.id, {
            group: g,
            rec: prop,
            px: g.position.x,
            py: g.position.y,
            pz: g.position.z,
            rx: g.rotation.x,
            ry: g.rotation.y,
            rz: g.rotation.z,
            sx: g.scale.x,
            sy: g.scale.y,
            sz: g.scale.z,
            caughtAt: now,
            phase: Math.atan2(dzp, dxp),
            radius: clamp(dist, 0.8, 4.2),
            lift: 3.2 + Math.random() * 4.0,
            spin: (0.8 + Math.random() * 1.1) * (Math.random() < 0.5 ? -1 : 1),
            tumble: 0.5 + Math.random() * 0.9
          });
          if (tornado.captured.size >= 14) break;
        }
      }

      const settle = smoothstep(0.76, 0.97, p);
      const envelope = smoothstep(0.02, 0.16, p) * (1 - smoothstep(0.76, 0.96, p));
      tornado.captured.forEach(function (item, id) {
        const g = state.meshById.get(id);
        if (g !== item.group || !g.parent) return;
        const ageRamp = smoothstep(0, 1, (now - item.caughtAt) / 500);
        const lift = ageRamp * envelope;
        const angle = item.phase + (now - item.caughtAt) * 0.001 * item.spin * 1.9;
        const radius = item.radius * (0.82 + 0.18 * Math.sin(now * 0.002 + item.phase));
        const swirlX = cx + Math.cos(angle) * radius;
        const swirlZ = cz + Math.sin(angle) * radius;
        const swirlY = item.py + 0.8 + item.lift * lift +
          Math.sin(now * 0.0022 + item.phase) * 0.3 * lift;
        g.position.set(
          swirlX * (1 - settle) + item.px * settle,
          swirlY * (1 - settle) + item.py * settle,
          swirlZ * (1 - settle) + item.pz * settle
        );
        const spinAngle = (now - item.caughtAt) * 0.001 * item.spin * 2.1;
        g.rotation.y = item.ry + spinAngle * (1 - settle);
        g.rotation.x = item.rx + Math.sin(now * 0.0021 + item.phase) * item.tumble * 0.26 * (1 - settle);
        g.rotation.z = item.rz + Math.cos(now * 0.0018 + item.phase) * item.tumble * 0.24 * (1 - settle);
        const wobble = 1 + Math.sin(now * 0.004 + item.phase) * 0.045 * (1 - settle);
        g.scale.set(
          item.sx * wobble * (1 - settle) + item.sx * settle,
          item.sy * wobble * (1 - settle) + item.sy * settle,
          item.sz * wobble * (1 - settle) + item.sz * settle
        );
      });

      if (p >= 1) finishTornado();
    }

    function stopRandomEvents() {
      if (randomEventTimer) clearTimeout(randomEventTimer);
      randomEventTimer = null;
    }
    function scheduleRandomEvent() {
      stopRandomEvents();
      if (!state.eventsAuto) return;
      const delay = 60000 + Math.random() * 50000;
      randomEventTimer = setTimeout(function () {
        randomEventTimer = null;
        if (!state.eventsAuto) return;
        if (!document.hidden && !anyMajorActive()) {
          const pool = ['tornado', 'earthquake', 'tsunami'];
          triggerEvent(pool[Math.floor(Math.random() * pool.length)]);
        }
        scheduleRandomEvent();
      }, delay);
    }

    // ---------------------------------------------------------------- damage & disaster effects
    const FX_BOX = new THREE.BoxGeometry(1, 1, 1);
    const fxParticles = [];
    const lightningBolts = [];
    let fxLastNow = 0;
    let quakeShakeTimer = null;

    const charredMat = new THREE.MeshStandardMaterial({
      color: 0x2f2a2d,
      roughness: 0.96,
      metalness: 0.02
    });

    function spawnFxParticles(x, y, z, colors, count, power, opts) {
      opts = opts || {};
      const gravity = opts.gravity == null ? 9.8 : opts.gravity;
      const lifeBase = opts.life || 0.85;
      for (let i = 0; i < count; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: colors[i % colors.length],
          roughness: 0.9,
          metalness: 0,
          transparent: true,
          opacity: 1
        });
        const mesh = new THREE.Mesh(FX_BOX, mat);
        const s = (opts.size || 0.13) * (0.6 + Math.random() * 0.9);
        mesh.scale.set(s, s * (0.6 + Math.random() * 0.7), s);
        mesh.position.set(
          x + (Math.random() - 0.5) * 0.9,
          y + Math.random() * 0.45,
          z + (Math.random() - 0.5) * 0.9
        );
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        scene.add(mesh);
        fxParticles.push({
          mesh: mesh,
          vx: (Math.random() - 0.5) * power,
          vy: 0.8 + Math.random() * power,
          vz: (Math.random() - 0.5) * power,
          rx: (Math.random() - 0.5) * 9,
          ry: (Math.random() - 0.5) * 9,
          rz: (Math.random() - 0.5) * 9,
          gravity: gravity,
          life: lifeBase * (0.7 + Math.random() * 0.7),
          maxLife: lifeBase
        });
      }
      while (fxParticles.length > 240) {
        const old = fxParticles.shift();
        scene.remove(old.mesh);
        old.mesh.material.dispose();
      }
    }

    function spawnCrackLines(x, z, count) {
      for (let i = 0; i < count; i++) {
        const points = [];
        const a = Math.random() * Math.PI * 2;
        const len = 1.4 + Math.random() * 2.6;
        for (let j = 0; j < 5; j++) {
          const t = j / 4;
          points.push(new THREE.Vector3(
            x + Math.cos(a) * len * t + (Math.random() - 0.5) * 0.35,
            0.125,
            z + Math.sin(a) * len * t + (Math.random() - 0.5) * 0.35
          ));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({
          color: 0x5c4d56,
          transparent: true,
          opacity: 0.55
        });
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        fxParticles.push({
          mesh: line,
          vx: 0, vy: 0, vz: 0,
          rx: 0, ry: 0, rz: 0,
          gravity: 0,
          life: 4.2,
          maxLife: 4.2,
          fadeOnly: true
        });
      }
    }

    function spawnLightningBolt(x, y, z, now) {
      const points = [];
      const topY = 31 + Math.random() * 4;
      for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        const jitter = 4.8 * (1 - t) + 0.15;
        points.push(new THREE.Vector3(
          x + (Math.random() - 0.5) * jitter,
          topY + (y - topY) * t,
          z + (Math.random() - 0.5) * jitter
        ));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const geo = new THREE.TubeGeometry(curve, 30, 0.12, 6, false);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xf4fbff,
        transparent: true,
        opacity: 1,
        depthWrite: false,
        fog: false
      });
      const bolt = new THREE.Mesh(geo, mat);
      const outerGeo = new THREE.TubeGeometry(curve, 30, 0.34, 6, false);
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0xbfe8ff,
        transparent: true,
        opacity: 0.3,
        depthWrite: false,
        fog: false
      });
      const outer = new THREE.Mesh(outerGeo, outerMat);
      scene.add(outer);
      scene.add(bolt);
      const glowMat = new THREE.SpriteMaterial({
        map: glowTexture,
        color: 0xdaf2ff,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      });
      const glow = new THREE.Sprite(glowMat);
      glow.position.set(x, y, z);
      glow.scale.set(8.5, 8.5, 1);
      scene.add(glow);
      lightningBolts.push({
        bolt: bolt, outer: outer, glow: glow,
        born: now, life: 620
      });
    }

    function flashScreen() {
      if (!lightningFlashEl) return;
      lightningFlashEl.classList.remove('is-flash');
      void lightningFlashEl.offsetWidth;
      lightningFlashEl.classList.add('is-flash');
    }

    function shakeStage(ms) {
      if (!stageEl) return;
      stageEl.classList.remove('is-quaking');
      void stageEl.offsetWidth;
      stageEl.classList.add('is-quaking');
      if (quakeShakeTimer) clearTimeout(quakeShakeTimer);
      quakeShakeTimer = setTimeout(function () {
        stageEl.classList.remove('is-quaking');
      }, ms);
    }

    function updateFx(now) {
      let dt = 0;
      if (fxLastNow) dt = Math.min(0.06, Math.max(0, (now - fxLastNow) / 1000));
      fxLastNow = now;
      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.life -= dt;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          if (p.mesh.geometry && p.mesh.geometry.type !== 'BoxGeometry') p.mesh.geometry.dispose();
          if (p.mesh.material) p.mesh.material.dispose();
          fxParticles.splice(i, 1);
          continue;
        }
        if (!p.fadeOnly) {
          p.mesh.position.x += p.vx * dt;
          p.mesh.position.y += p.vy * dt;
          p.mesh.position.z += p.vz * dt;
          p.vy -= p.gravity * dt;
          if (p.mesh.position.y < 0.08) {
            p.mesh.position.y = 0.08;
            p.vy *= -0.25;
            p.vx *= 0.72;
            p.vz *= 0.72;
          }
          p.mesh.rotation.x += p.rx * dt;
          p.mesh.rotation.y += p.ry * dt;
          p.mesh.rotation.z += p.rz * dt;
        }
        p.mesh.material.opacity = clamp(p.life / p.maxLife, 0, 1);
      }
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const item = lightningBolts[i];
        const age = now - item.born;
        if (age >= item.life) {
          scene.remove(item.bolt);
          scene.remove(item.outer);
          scene.remove(item.glow);
          item.bolt.geometry.dispose();
          item.bolt.material.dispose();
          item.outer.geometry.dispose();
          item.outer.material.dispose();
          item.glow.material.dispose();
          lightningBolts.splice(i, 1);
          continue;
        }
        const fade = 1 - age / item.life;
        item.bolt.material.opacity = fade;
        item.outer.material.opacity = 0.3 * fade;
        item.glow.material.opacity = fade * 0.95;
        item.glow.scale.setScalar(8.5 + (1 - fade) * 4.5);
      }
    }

    function hideCharAccessories(group) {
      const acc = group.userData.charAccessories;
      if (!acc) return;
      acc.umbrella.visible = false;
      acc.scarf.visible = false;
      acc.lantern.visible = false;
      if (acc.rainCoat) acc.rainCoat.visible = false;
      if (acc.snowCoat) acc.snowCoat.visible = false;
      if (acc.beanie) acc.beanie.visible = false;
    }

    function debrisColorsFor(rec) {
      if (rec.kind === 'brick') return [rec.color, rec.color, 0xe8d8c8];
      const def = PROP_MAP[rec.propType];
      if (def && def.cat === 'vehicle') return [0xf0b7b5, 0xe8d8c8, 0xafcfe8, 0xd2cbd3];
      return [0xe8d8c8, 0xd2cbd3, 0xf0b7b5, 0xdcc692];
    }

    function applyDamageVisual(rec, object3d) {
      if (!object3d || object3d.userData.damageApplied) return;
      object3d.userData.damageApplied = true;
      const def = rec.kind === 'prop' ? PROP_MAP[rec.propType] : null;
      if (rec.damaged === 'burnt') {
        object3d.traverse(function (o) {
          if (o.isMesh) {
            o.material = charredMat;
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        hideCharAccessories(object3d);
        if (object3d.userData.vehicleGlow) object3d.userData.vehicleGlow.visible = false;
        const isAnimal = def && def.cat === 'animal';
        object3d.position.y = rec.layer * LAYER + (isAnimal ? 0.24 : 0.34);
        object3d.rotation.z = (rec.damageDir || 1) * (isAnimal ? 1.4 : 1.46);
        object3d.rotation.x = 0.06;
        const scorchMat = new THREE.MeshBasicMaterial({
          color: 0x3b3032,
          transparent: true,
          opacity: 0.28,
          depthWrite: false
        });
        const scorch = new THREE.Mesh(new THREE.CircleGeometry(1, 18), scorchMat);
        scorch.rotation.x = -Math.PI / 2;
        scorch.position.set(object3d.position.x, 0.035, object3d.position.z);
        scorch.scale.set(1.25, 0.9, 1);
        scorch.renderOrder = 1;
        scene.add(scorch);
        rec.scorchMesh = scorch;
        syncAttachmentVisibility(object3d);
        return;
      }
      if (rec.damaged !== 'broken') return;

      const dims = itemDims(rec);
      const halfW = dims[0] * CELL * 0.5;
      const halfD = dims[1] * CELL * 0.5;
      const groundLocal = -rec.layer * LAYER + 0.06;
      const colors = debrisColorsFor(rec);
      for (let i = 0; i < 5; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: colors[i % colors.length],
          roughness: 0.92,
          metalness: 0
        });
        const chunk = new THREE.Mesh(FX_BOX, mat);
        const s = 0.1 + Math.random() * 0.2;
        chunk.scale.set(s, s * (0.55 + Math.random() * 0.6), s * (0.7 + Math.random() * 0.6));
        const side = i % 2 === 0 ? -1 : 1;
        chunk.position.set(
          side * (halfW + 0.15 + Math.random() * 0.85),
          groundLocal + Math.random() * 0.12,
          (Math.random() - 0.5) * (halfD * 1.8 + 0.8)
        );
        chunk.rotation.set(Math.random() * 0.6, Math.random() * Math.PI, Math.random() * 0.4);
        chunk.castShadow = false;
        object3d.add(chunk);
      }
      const topY = rec.kind === 'brick' ? BODY + STUD + 0.005 : 1.43;
      const addTopCrack = rec.kind === 'brick' || (def && def.cat === 'vehicle');
      if (addTopCrack) {
        const crackPoints = [];
        for (let i = 0; i < 5; i++) {
          const t = i / 4;
          crackPoints.push(new THREE.Vector3(
            -halfW * 0.66 + halfW * 1.32 * t,
            topY,
            (i % 2 === 0 ? -1 : 1) * halfD * 0.28
          ));
        }
        const crackGeo = new THREE.BufferGeometry().setFromPoints(crackPoints);
        const crackMat = new THREE.LineBasicMaterial({
          color: 0x5a4a50,
          transparent: true,
          opacity: 0.8
        });
        object3d.add(new THREE.Line(crackGeo, crackMat));
      }

      if (rec.kind === 'prop') {
        const sidePoints = [];
        for (let i = 0; i < 5; i++) {
          const t = i / 4;
          sidePoints.push(new THREE.Vector3(
            halfW - 0.08,
            0.54 + t * 0.72,
            -halfD * 0.35 + halfD * 0.82 * t + (i % 2 === 0 ? -0.11 : 0.11)
          ));
        }
        const sideGeo = new THREE.BufferGeometry().setFromPoints(sidePoints);
        object3d.add(new THREE.Line(sideGeo, new THREE.LineBasicMaterial({
          color: 0x4e4047,
          transparent: true,
          opacity: 0.78
        })));
      }

      if (rec.kind === 'brick') {
        if (object3d.material) {
          object3d.material = object3d.material.clone();
          object3d.material.color.multiplyScalar(0.82);
        }
      } else if (def) {
        if (object3d.userData.vehicleGlow) object3d.userData.vehicleGlow.visible = false;
        if (def.cat === 'vehicle') {
          object3d.rotation.z += (rec.damageDir || 1) * 0.065;
          object3d.rotation.x += 0.025;
          object3d.position.y = rec.layer * LAYER + 0.01;
        } else {
          object3d.rotation.z += (rec.damageDir || 1) * 0.05;
        }
      }
      syncAttachmentVisibility(object3d);
    }

    function damageItem(rec, type) {
      if (!rec || rec.damaged) return false;
      const inState = rec.kind === 'brick'
        ? state.bricks.indexOf(rec) !== -1
        : state.props.indexOf(rec) !== -1;
      if (!inState) return false;
      const def = rec.kind === 'prop' ? PROP_MAP[rec.propType] : null;
      const cat = def ? def.cat : 'brick';
      if (type === 'burnt') {
        if (!def || (cat !== 'person' && cat !== 'animal' && cat !== 'char')) return false;
      } else if (type === 'broken') {
        if (def && (cat === 'person' || cat === 'animal' || cat === 'char' || cat === 'road')) return false;
      } else {
        return false;
      }
      rec.damaged = type;
      rec.damageDir = rec.id % 2 === 0 ? 1 : -1;
      const object3d = state.meshById.get(rec.id);
      if (object3d) {
        applyDamageVisual(rec, object3d);
        const colors = type === 'burnt'
          ? [0x3d3436, 0x2e2a2c, 0xffd58a, 0xb9aeb6]
          : debrisColorsFor(rec);
        spawnFxParticles(
          object3d.position.x,
          object3d.position.y + 0.3,
          object3d.position.z,
          colors,
          type === 'burnt' ? 7 : 10,
          type === 'burnt' ? 2.1 : 2.7,
          { gravity: type === 'burnt' ? 5 : 8, life: 0.9 }
        );
        if (type === 'broken') {
          spawnCrackLines(object3d.position.x, object3d.position.z, 2);
        }
      }
      scheduleSave();
      return true;
    }

    function isSheltered(p) {
      const dims = itemDims(p);
      const maxCheckLayer = Math.min(MAX_LAYER, p.layer + 7);
      for (let l = p.layer + 1; l <= maxCheckLayer; l++) {
        for (let x = p.gx; x < p.gx + dims[0]; x++) {
          for (let z = p.gz; z < p.gz + dims[1]; z++) {
            const above = state.occupancy.get(cellKey(x, z, l));
            if (!above || above === p) continue;
            if (above.kind === 'brick') return true;
            if (above.kind === 'prop') {
              const d = PROP_MAP[above.propType];
              if (d && (d.cat === 'build' || d.cat === 'road' || d.support)) return true;
            }
          }
        }
      }
      return false;
    }

    function anyMajorActive() {
      return tornado.active || quake.active || tsunami.active;
    }

    function shuffleList(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = list[i];
        list[i] = list[j];
        list[j] = tmp;
      }
      return list;
    }

    function pickStructureTargets(maxCount) {
      const all = [];
      for (let i = 0; i < state.bricks.length; i++) {
        if (!state.bricks[i].damaged) all.push(state.bricks[i]);
      }
      for (let i = 0; i < state.props.length; i++) {
        const p = state.props[i];
        const def = PROP_MAP[p.propType];
        if (def && def.cat === 'build' && !p.damaged) all.push(p);
      }
      if (!all.length) return [];
      const picked = [];
      const pickedIds = new Set();
      const epicenters = shuffleList(all.slice()).slice(0, 2);
      for (let e = 0; e < epicenters.length; e++) {
        const center = epicenters[e];
        const cluster = all.filter(function (item) {
          return Math.abs(item.gx - center.gx) <= 2 &&
            Math.abs(item.gz - center.gz) <= 2;
        });
        shuffleList(cluster);
        for (let i = 0; i < cluster.length && picked.length < maxCount; i++) {
          if (pickedIds.has(cluster[i].id)) continue;
          pickedIds.add(cluster[i].id);
          picked.push(cluster[i]);
        }
        if (picked.length >= maxCount) break;
      }
      if (!picked.length) {
        for (let i = 0; i < all.length && picked.length < maxCount; i++) {
          if (!pickedIds.has(all[i].id)) {
            pickedIds.add(all[i].id);
            picked.push(all[i]);
          }
        }
      }
      return picked;
    }

    function pickDamageTargets(maxVehicles, maxStructures) {
      const targets = [];
      const vehicles = state.props.filter(function (p) {
        const def = PROP_MAP[p.propType];
        return def && def.cat === 'vehicle' && !p.damaged;
      });
      shuffleList(vehicles);
      for (let i = 0; i < vehicles.length && i < maxVehicles; i++) targets.push(vehicles[i]);
      const structures = pickStructureTargets(maxStructures);
      for (let i = 0; i < structures.length; i++) targets.push(structures[i]);
      return targets;
    }

    function scatterTornadoProp(item, endX, endZ, opts) {
      opts = opts || {};
      const rec = item.rec;
      const group = item.group;
      if (!rec || !group || !group.parent) return false;
      if (state.meshById.get(rec.id) !== group) return false;
      if (state.props.indexOf(rec) === -1) return false;
      const def = PROP_MAP[rec.propType];
      if (!def) return false;
      const dims = effDims(def, rec.rot);
      unregisterOccupancy(rec);
      let chosen = null;
      for (let attempt = 0; attempt < 44; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = attempt < 4 ? 2 + Math.random() * 3 : 3 + Math.random() * 9.5;
        const wx = clamp(endX + Math.cos(angle) * radius, -SIZE / 2 + 1, SIZE / 2 - 1);
        const wz = clamp(endZ + Math.sin(angle) * radius, -SIZE / 2 + 1, SIZE / 2 - 1);
        let gx = Math.round((wx + SIZE / 2) / CELL - dims[0] / 2);
        let gz = Math.round((wz + SIZE / 2) / CELL - dims[1] / 2);
        gx = clamp(gx, 0, SIZE - dims[0]);
        gz = clamp(gz, 0, SIZE - dims[1]);
        if (canPlace('prop', rec.propType, rec.rot, gx, gz, 0)) {
          chosen = { gx: gx, gz: gz };
          break;
        }
      }
      if (!chosen) {
        registerOccupancy(rec);
        return false;
      }
      rec.gx = chosen.gx;
      rec.gz = chosen.gz;
      rec.layer = 0;
      const wx = worldX(rec.gx, dims[0]);
      const wz = worldZ(rec.gz, dims[1]);
      group.position.set(wx, 0, wz);
      group.rotation.set(0, rec.rot * Math.PI / 2, 0);
      group.scale.set(item.sx, item.sy, item.sz);
      registerOccupancy(rec);
      spawnFxParticles(
        wx, 0.12, wz,
        opts.colors || [0xe8d8c8, 0xf0b7b5, 0xd2cbd3],
        opts.count || 6,
        opts.power || 2.2,
        { gravity: opts.gravity == null ? 8 : opts.gravity, life: opts.life || 0.65 }
      );
      return true;
    }

    // ---------------------------------------------------------------- earthquake
    const quake = {
      active: false,
      startTime: 0,
      duration: 2700,
      queue: []
    };

    function triggerEarthquake() {
      if (anyMajorActive()) {
        toast('灾害正在发生 · 先避一避吧');
        return false;
      }
      quake.active = true;
      quake.startTime = performance.now();
      quake.queue = [];
      const targets = pickDamageTargets(2, 8);
      for (let i = 0; i < targets.length; i++) {
        quake.queue.push({ rec: targets[i], at: 280 + i * 165, done: false });
      }
      shakeStage(1700);
      playSound('quake');
      toast(targets.length ? '地震啦 · 建筑和车辆被震坏了' : '地震啦 · 大地在摇晃');
      return true;
    }

    function updateQuake(now) {
      if (!quake.active) return;
      const elapsed = now - quake.startTime;
      for (let i = 0; i < quake.queue.length; i++) {
        const item = quake.queue[i];
        if (!item.done && elapsed >= item.at) {
          item.done = true;
          damageItem(item.rec, 'broken');
        }
      }
      if (elapsed >= quake.duration) {
        quake.active = false;
        quake.queue = [];
      }
    }

    // ---------------------------------------------------------------- tsunami
    const tsunami = {
      active: false,
      startTime: 0,
      duration: 7200,
      targets: [],
      washTargets: [],
      washed: new Set(),
      hit: new Set(),
      lastFoamAt: 0
    };
    const tsunamiGroup = new THREE.Group();
    tsunamiGroup.visible = false;
    scene.add(tsunamiGroup);
    const tsunamiWaveShape = new THREE.Shape();
    tsunamiWaveShape.moveTo(-1.2, 0);
    tsunamiWaveShape.lineTo(13, 0);
    tsunamiWaveShape.lineTo(13, 3.4);
    tsunamiWaveShape.quadraticCurveTo(11.5, 8.8, 7.2, 9.7);
    tsunamiWaveShape.quadraticCurveTo(4.6, 10, 3.5, 7.9);
    tsunamiWaveShape.quadraticCurveTo(2.2, 5.8, -1.2, 5.2);
    tsunamiWaveShape.closePath();
    const tsunamiWaveGeo = new THREE.ExtrudeGeometry(tsunamiWaveShape, {
      depth: 72,
      bevelEnabled: false,
      curveSegments: 8,

    });
    tsunamiWaveGeo.translate(0, 0, -36);
    const tsunamiWaveMat = new THREE.MeshStandardMaterial({
      color: 0x79c9df,
      roughness: 0.23,

    });

    const tsunamiFoamMats = [];
    function addTsunamiFoamLine(x, y, thick) {
      const pts = [];
      for (let i = 0; i <= 16; i++) {
        const z = -36 + i * 4.5;
        pts.push(new THREE.Vector3(x + Math.sin(i * 1.7) * 0.28, y + Math.sin(i * 1.3) * 0.12, z));
      }

        transparent: true,
        opacity: 0.82,
        depthWrite: false,
